<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRZYBtv - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111319;
      color: #ffffff;
      font-family: 'Lato', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Box Form Password */
    .pass-box {
      background: #2a2b36;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      text-align: center;
      max-width: 380px;
      width: 90%;
      border: 1px solid #5558c9;
    }

    .pass-box h3 {
      margin-bottom: 8px;
      color: #fff;
      font-size: 22px;
    }

    .pass-box p {
      color: #c4dcff;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .pass-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 2px solid #5558c9;
      background: #191a1f;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .pass-box button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #5558c9;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* EFEK FOKUS REMOTE TV (Warna Neon Cyan) */
    .pass-box input:focus, 
    .pass-box button:focus {
      border: 2px solid #00e5ff !important;
      background: #3d3d79 !important;
      color: #ffffff !important;
      box-shadow: 0 0 15px #00e5ff;
      outline: none;
    }

    /* Pesan Error */
    #passError {
      color: #ff5252;
      font-size: 13px;
      margin-top: 14px;
      display: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="pass-box" id="loginBox">
    <h3>Akses Masuk MRZYBtv</h3>
    <p>Masukkan password untuk melanjutkan</p>
    
    <!-- Tabindex="0" agar bisa dijangkau navigasi Remote TV -->
    <input type="password" id="passInput" placeholder="Password..." tabindex="0" autocomplete="off">
    <button onclick="checkPassword()" id="btnSubmit" tabindex="0">MASUK</button>
    
    <div id="passError">Password salah! Silakan coba lagi.</div>
  </div>

  <script>
    (function() {
      // SETTING PASSWORD & ALAMAT HOME
      const CORRECT_PASSWORD = "Raihan432";
      const HOME_URL = "https://mrzybtv-api.ukielaki88.workers.dev/app/home";

      const input = document.getElementById("passInput");
      const btnSubmit = document.getElementById("btnSubmit");
      const errorMsg = document.getElementById("passError");

      // Cek apakah user sudah pernah sukses login sebelumnya
      if (localStorage.getItem("access_granted") === "true") {
        // Jika sudah pernah login, langsung buka halaman Home Anda
        window.location.href = HOME_URL;
      } else {
        // Fokuskan remote otomatis ke kotak input
        setTimeout(function() {
          input.focus();
        }, 300);
      }

      // Fungsi Verifikasi Password & Redirect
      window.checkPassword = function() {
        if (input.value === CORRECT_PASSWORD) {
          // Simpan status login sekali saja di browser/TV
          localStorage.setItem("access_granted", "true");
          
          // Redirect (pindah) ke alamat home Anda
          window.location.href = HOME_URL;
        } else {
          errorMsg.style.display = "block";
          input.value = "";
          input.focus();
        }
      };

      // --- NAVIGASI REMOTE TV (D-PAD) ---
      document.addEventListener("keydown", function(e) {
        const activeEl = document.activeElement;

        // Panah Bawah (KeyCode: 40)
        if (e.keyCode === 40) {
          if (activeEl === input) {
            e.preventDefault();
            btnSubmit.focus(); // Pindah dari Input ke Tombol Masuk
          }
        }

        // Panah Atas (KeyCode: 38)
        if (e.keyCode === 38) {
          if (activeEl === btnSubmit) {
            e.preventDefault();
            input.focus(); // Pindah dari Tombol Masuk ke Input
          }
        }

        // Tombol Enter / OK Remote (KeyCode: 13 / 66)
        if (e.keyCode === 13 || e.keyCode === 66) {
          if (activeEl === input) {
            e.preventDefault();
            checkPassword();
          }
        }
      });
    })();
  </script>

</body>
</html>
