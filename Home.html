<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman - MRZYBtv</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111319;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Card Box */
    .announcement-box {
      background: #2a2b36;
      padding: 40px 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
      max-width: 420px;
      width: 90%;
      border: 1px solid #5558c9;
    }

    /* Icon / Logo Styling */
    .icon-container {
      width: 64px;
      height: 64px;
      background: #3d3d79;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      border: 2px solid #5558c9;
    }

    .icon-container svg {
      width: 32px;
      height: 32px;
      fill: #00e5ff;
    }

    .announcement-box h3 {
      margin-bottom: 12px;
      color: #fff;
      font-size: 22px;
      font-weight: 600;
    }

    .announcement-box p {
      color: #c4dcff;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .announcement-box p span {
      color: #00e5ff;
      font-weight: 500;
    }

    /* Tombol Aksi */
    .announcement-box a {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      text-decoration: none;
      background: #5558c9;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(85, 88, 201, 0.4);
    }

    /* EFEK FOKUS REMOTE TV (Cyan Glow) */
    .announcement-box a:focus,
    .announcement-box a:hover {
      border: 2px solid #00e5ff !important;
      background: #3d3d79 !important;
      color: #ffffff !important;
      box-shadow: 0 0 20px #00e5ff;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="announcement-box">
    <!-- Icon Telegram / Informasi -->
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.02-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.89.03-.25.38-.51 1.05-.78 4.11-1.79 6.85-2.97 8.22-3.55 3.91-1.66 4.72-1.95 5.25-1.96.12 0 .39.03.56.17.14.12.18.28.2.45-.02.07-.02.13-.04.2z"/>
      </svg>
    </div>

    <h3>Akses Terbatas</h3>
    <p>Aplikasi ini bersifat privat serta terbatas dan hanya tersedia khusus untuk anggota resmi grup Telegram kami di <span>t.me/mrzybstream</span>.</p>
    
    <!-- Tombol Link Telegram, diberi tabindex="0" agar bisa diakses Remote TV -->
    <a href="https://t.me/mrzybstream" id="btnTelegram" tabindex="0">GABUNG TELEGRAM</a>
  </div>

  <script>
    // Fokus otomatis ke tombol saat halaman dimuka
    window.onload = function() {
      const btn = document.getElementById("btnTelegram");
      setTimeout(function() {
        btn.focus();
      }, 300);
    };

    // Navigasi Remote TV / Keyboard Enter
    document.addEventListener("keydown", function(e) {
      if (e.keyCode === 13 || e.keyCode === 66) {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.tagName === "A") {
          // Biarkan link terbuka secara normal
          window.location.href = activeEl.href;
        }
      }
    });
  </script>

</body>
</html>
