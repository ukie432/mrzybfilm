<!DOCTYPE html>
<html lang="id">
<head>    
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta content='width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' name='viewport'/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>TV Online Multi-Playlist & Custom UA</title>

    <style>
    body { margin: 0; background: #111; font-family: Arial, sans-serif; color: #fff; }
    .header-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1a1a1a; flex-wrap: wrap; gap: 10px; }
    h2 { margin: 0; font-size: 18px; }

    .playlist-tabs { display: flex; gap: 8px; }
    .tab-btn { background: #222; color: #aaa; border: 2px solid #444; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; outline: none; transition: 0.2s; }
    .tab-btn.active { background: #00bfff; color: #000; border-color: #00bfff; }
    .tab-btn:focus { border-color: #fff; transform: scale(1.05); box-shadow: 0 0 10px #00bfff; }

    #btnPengaturan { background: #333; color: #fff; border: 2px solid transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; outline: none; transition: 0.2s; }
    #btnPengaturan:focus { border-color: #00bfff; background: #00bfff; color: #000; font-weight: bold; transform: scale(1.05); box-shadow: 0 0 10px #00bfff; }

    /* Modal Form Custom Playlist & UA */
    #modalPlaylist { display: none; background: #222; padding: 15px; margin: 10px auto; width: 90%; border-radius: 8px; border: 1px solid #444; box-sizing: border-box; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }

    #modalPlaylist input[type="text"], #modalPlaylist select {
        width: 100%; padding: 10px; border-radius: 6px; border: 2px solid #444; background: #111; color: #fff; box-sizing: border-box; outline: none; font-size: 13px;
    }
    #modalPlaylist input[type="text"]:focus, #modalPlaylist select:focus { border-color: #00bfff; box-shadow: 0 0 8px #00bfff; }

    .modal-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .button-group-row { display: flex; gap: 8px; }
    .modal-buttons button { padding: 10px; border-radius: 6px; border: 2px solid transparent; font-weight: bold; cursor: pointer; outline: none; transition: 0.2s; }

    .btn-file { background: #2ed573; color: #000; width: 100%; }
    .btn-save { background: #00bfff; color: #000; flex: 1; }
    .btn-reset { background: #ff4757; color: #fff; flex: 1; }

    .btn-file:focus { border-color: #fff; transform: scale(1.02); box-shadow: 0 0 10px #2ed573; }
    .btn-save:focus { border-color: #fff; transform: scale(1.03); box-shadow: 0 0 10px #00bfff; }
    .btn-reset:focus { border-color: #fff; transform: scale(1.03); box-shadow: 0 0 10px #ff4757; }

    #search { width: 90%; margin: 10px auto; display: block; padding: 12px; border-radius: 8px; border: 2px solid transparent; font-size: 16px; outline: none; box-sizing: border-box; background: #222; color: #fff; }
    #search:focus { border-color: #00bfff; box-shadow: 0 0 10px #00bfff; }

    #kategori { display: flex; gap: 10px; overflow-x: auto; padding: 10px; scroll-behavior: smooth; }
    #kategori button { background: #333; color: #fff; border: 2px solid transparent; padding: 10px 18px; border-radius: 20px; white-space: nowrap; cursor: pointer; outline: none; transition: .2s; flex-shrink: 0; }
    #kategori button.active { background: #00bfff; color: #000; font-weight: bold; }
    #kategori button:focus { background: #00bfff; color: #000; transform: scale(1.05); box-shadow: 0 0 10px #00bfff; border-color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; padding: 20px; }
    .item { cursor: pointer; outline: none; transition: .2s; content-visibility: auto; contain-intrinsic-size: 1px 120px; background: #1a1a1a; border-radius: 10px; overflow: hidden; }
    .item img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #222; display: block; }
    .item p { text-align: center; margin: 8px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; }
    .item:focus { transform: scale(1.08); }
    .item:focus img { border: 3px solid #00bfff; }

    #customToast { visibility: hidden; min-width: 220px; background-color: #222; color: #fff; text-align: center; border-radius: 8px; padding: 12px 16px; position: fixed; z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.7); border: 1px solid #00bfff; pointer-events: none; }
    #customToast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.4s 2.6s; }

    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="header-container">
    <h2>TV ONLINE</h2>
    
    <div class="playlist-tabs">
        <button id="tab-p1" class="tab-btn active" tabindex="0" onclick="gantiPlaylistUtama('p1')">Playlist 1</button>
        <button id="tab-p2" class="tab-btn" tabindex="0" onclick="gantiPlaylistUtama('p2')">Playlist 2</button>
        <button id="tab-p3" class="tab-btn" tabindex="0" onclick="gantiPlaylistUtama('p3')">Playlist 3</button>
    </div>

    <button id="btnPengaturan" tabindex="0" onclick="toggleModal()">⚙️ Sunting</button>
</div>

<!-- Modal Sunting Playlist & User-Agent -->
<div id="modalPlaylist">
    <div class="form-group" id="containerCustomUrl">
        <label for="inputCustomUrl">URL Remote Playlist:</label>
        <input type="text" id="inputCustomUrl" tabindex="0" placeholder="https://contoh.com/playlist.m3u">
    </div>

    <div class="form-group">
        <label for="selectUAMode">Pilih User-Agent Mode:</label>
        <select id="selectUAMode" tabindex="0" onchange="gantiUAMode()">
            <option value="default">Default / Bawaan</option>
            <option value="ott_nav">OTT Navigator 1.9.6.4</option>
            <option value="tivimate">TiviMate / 4.6.1</option>
            <option value="vlc">VLC / 3.0.18</option>
            <option value="custom">Custom (Ketik Manual)</option>
        </select>
    </div>

    <div class="form-group" id="containerCustomUA" style="display: none;">
        <label for="inputCustomUA">Teks User-Agent Custom:</label>
        <input type="text" id="inputCustomUA" tabindex="0" placeholder="Contoh: Mozilla/5.0 ...">
    </div>
    
    <div class="modal-buttons">
        <button id="btnFileM3u" class="btn-file" tabindex="0" onclick="pilihFileInternal()">📁 Impor Media Lokal (.m3u)</button>
        <div class="button-group-row">
            <button id="btnSavePlaylist" class="btn-save" tabindex="0" onclick="simpanPengaturan()">SIMPAN</button>
            <button id="btnResetPlaylist" class="btn-reset" tabindex="0" onclick="resetKeUtama()">RESET SLOT INI</button>
        </div>
    </div>

    <input type="file" id="filePicker" accept=".m3u,.m3u8,.txt" style="display: none;" onchange="bacaFileWeb(event)">
</div>

<input id="search" tabindex="0" type="text" placeholder="Cari channel..." oninput="cariChannel()">

<div id="kategori"></div>
<div class="grid" id="tvList">Memuat TV...</div>
<div id="customToast">Notifikasi</div>

<script>
const _playlist1_Base64 = "aHR0cHM6Ly9tcnp5YnR2LWFwaS51a2llbGFraTg4LndvcmtlcnMuZGV2L2FwaS9wbGF5bGlzdA=="; 
const PLAYLIST_1 = atob(_playlist1_Base64); // Playlist Utama Bawaan

let semuaTV = [];

// --- BRIDGE SIMPAN KE HP & FALLBACK BROWSING ---
function simpanDataStorage(key, val) {
    if (window.Android && typeof window.Android.savePlaylistData === "function") {
        window.Android.savePlaylistData(key, val);
    }
    localStorage.setItem(key, val);
}

function ambilDataStorage(key) {
    if (window.Android && typeof window.Android.getPlaylistData === "function") {
        let val = window.Android.getPlaylistData(key);
        if (val && val !== "") return val;
    }
    return localStorage.getItem(key) || "";
}

function hapusDataStorage(key) {
    if (window.Android && typeof window.Android.savePlaylistData === "function") {
        window.Android.savePlaylistData(key, "");
    }
    localStorage.removeItem(key);
}

let kategoriAktif = ambilDataStorage("lastCategory") || "Semua";

// --- PRESET USER-AGENT ---
const PRESET_UA = {
    "ott_nav": "OTT Navigator 1.9.6.4 (Android; TV)",
    "tivimate": "TiviMate/4.6.1 (Android TV)",
    "vlc": "VLC/3.0.18 (Linux; Android 10)"
};

function gantiUAMode() {
    let mode = document.getElementById("selectUAMode").value;
    let customContainer = document.getElementById("containerCustomUA");
    customContainer.style.display = (mode === "custom") ? "block" : "none";
}

function ambilUserAgentAktif() {
    let mode = ambilDataStorage("ua_mode") || "default";
    if (mode === "custom") return ambilDataStorage("custom_ua_text");
    if (PRESET_UA[mode]) return PRESET_UA[mode];
    return "";
}

function showToast(pesan) {
    let toast = document.getElementById("customToast");
    toast.innerText = pesan;
    toast.className = "show";
    setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
}

function updateTabUI(activeTab) {
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    let btn = document.getElementById(`tab-${activeTab}`);
    if (btn) btn.classList.add("active");
}

function gantiPlaylistUtama(tipe) {
    simpanDataStorage("activeTabPlaylist", tipe);
    simpanDataStorage("lastCategory", "Semua");
    
    updateTabUI(tipe);
    muatDataTV();
    
    let label = (tipe === 'p1') ? 'Playlist 1 (Utama)' : ((tipe === 'p2') ? 'Playlist 2' : 'Playlist 3');
    showToast(`Beralih ke ${label}`);
}

function muatDataTV() {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    updateTabUI(activeTab);

    // Jika Playlist 1 -> Muat Playlist Bawaan Aplikasi
    if (activeTab === "p1") {
        muatDariURL(PLAYLIST_1);
        return;
    }

    // Untuk Playlist 2 dan 3 -> Cek apakah ada File M3U Lokal atau URL Custom
    let localData = ambilDataStorage(`localM3uContent_${activeTab}`);
    let customUrl = ambilDataStorage(`customPlaylistURL_${activeTab}`);

    if (localData && !customUrl) {
        let tvData = parseM3U(localData);
        if (tvData.length > 0) {
            semuaTV = tvData;
            prosesTampilan();
            return;
        }
    }

    if (customUrl) {
        muatDariURL(customUrl);
    } else {
        semuaTV = [];
        document.getElementById("tvList").innerHTML = "Slot ini masih kosong. Klik '⚙️ Sunting' untuk menambah URL / Impor File.";
        buatKategori();
    }
}

function muatDariURL(targetURL) {
    document.getElementById("tvList").innerHTML = "Memuat TV...";

    if (window.Android && typeof window.Android.fetchUrl === "function") {
        setTimeout(() => {
            try {
                let activeUA = ambilUserAgentAktif();
                let responseData = window.Android.fetchUrl(targetURL, activeUA);
                if (responseData && !responseData.startsWith("ERROR:")) {
                    let tvData = parseM3U(responseData);
                    if (tvData.length > 0) {
                        semuaTV = tvData;
                        prosesTampilan();
                        return;
                    }
                }
                throw new Error("Gagal parsing");
            } catch (err) {
                document.getElementById("tvList").innerHTML = "Gagal membaca Playlist.";
            }
        }, 100);
        return;
    }

    let fetchURL = targetURL;
    if (targetURL.includes("bit.ly") || targetURL.includes("tinyurl.com") || targetURL.includes("s.id")) {
        fetchURL = "https://corsproxy.io/?" + encodeURIComponent(targetURL);
    }

    fetch(fetchURL)
    .then(res => res.text())
    .then(data => {
        let tvData = parseM3U(data);
        semuaTV = tvData;
        prosesTampilan();
    })
    .catch(() => {
        document.getElementById("tvList").innerHTML = "Gagal membaca Playlist.";
    });
}

function prosesTampilan() {
    let savedKat = ambilDataStorage("lastCategory") || "Semua";
    kategoriAktif = savedKat;
    buatKategori();

    let dataToDisplay = semuaTV;
    if (savedKat !== "Semua") {
        dataToDisplay = semuaTV.filter(tv => tv.group === savedKat);
    }
    tampilkanTV(dataToDisplay);
}

muatDataTV();

// --- OPERASI MODAL SUNTING ---
function toggleModal() {
    let modal = document.getElementById("modalPlaylist");
    if (modal.style.display === "block") {
        modal.style.display = "none";
        document.getElementById("btnPengaturan").focus();
    } else {
        modal.style.display = "block";
        
        let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
        let savedUrl = ambilDataStorage(`customPlaylistURL_${activeTab}`);
        let savedUAMode = ambilDataStorage("ua_mode") || "default";
        let savedUAText = ambilDataStorage("custom_ua_text");

        let containerUrl = document.getElementById("containerCustomUrl");
        let btnFile = document.getElementById("btnFileM3u");
        
        // Playlist 1 dikunci dari URL/impor luar agar playlist utama kamu aman
        if (activeTab === "p1") {
            containerUrl.style.display = "none";
            btnFile.style.display = "none";
        } else {
            containerUrl.style.display = "block";
            btnFile.style.display = "block";
        }

        document.getElementById("inputCustomUrl").value = savedUrl;
        document.getElementById("selectUAMode").value = savedUAMode;
        document.getElementById("inputCustomUA").value = savedUAText;

        gantiUAMode();
        setTimeout(() => { 
            if (activeTab !== "p1") document.getElementById("inputCustomUrl").focus(); 
            else document.getElementById("selectUAMode").focus();
        }, 100);
    }
}

function simpanPengaturan() {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    let modeUA = document.getElementById("selectUAMode").value;
    let customUAText = document.getElementById("inputCustomUA").value.trim();

    simpanDataStorage("ua_mode", modeUA);
    simpanDataStorage("custom_ua_text", customUAText);

    if (activeTab !== "p1") {
        let urlBaru = document.getElementById("inputCustomUrl").value.trim();
        if (urlBaru !== "") {
            hapusDataStorage(`localM3uContent_${activeTab}`);
            simpanDataStorage(`customPlaylistURL_${activeTab}`, urlBaru);
        }
    }

    simpanDataStorage("lastCategory", "Semua");
    toggleModal();
    muatDataTV();
    showToast("Pengaturan Berhasil Disimpan!");
}

function resetKeUtama() {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    
    if (activeTab === "p1") {
        hapusDataStorage("ua_mode");
        hapusDataStorage("custom_ua_text");
        showToast("User-Agent Playlist 1 di-reset");
    } else {
        hapusDataStorage(`customPlaylistURL_${activeTab}`);
        hapusDataStorage(`localM3uContent_${activeTab}`);
        showToast(`Slot ${activeTab.toUpperCase()} Berhasil Di-reset!`);
    }

    toggleModal();
    muatDataTV();
}

// --- FUNGSI PILIH & IMPOR FILE LOKAL TERINTEGRASI ---
function pilihFileInternal() {
    if (window.Android && typeof window.Android.openFileChooser === "function") {
        window.Android.openFileChooser(); // Memanggil File Picker bawaan Android
    } else {
        document.getElementById("filePicker").click(); // Fallback web biasa
    }
}

function terimaFileM3U(isiM3U) {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    if (activeTab === "p1") {
        showToast("Playlist 1 adalah bawaan, gunakan Playlist 2 atau 3!");
        return;
    }

    if (isiM3U && isiM3U.trim() !== "") {
        hapusDataStorage(`customPlaylistURL_${activeTab}`);
        simpanDataStorage(`localM3uContent_${activeTab}`, isiM3U);
        simpanDataStorage("lastCategory", "Semua");
        toggleModal();
        muatDataTV();
        showToast(`Playlist Lokal Tersimpan di ${activeTab.toUpperCase()}!`);
    }
}

function bacaFileWeb(e) {
    let file = e.target.files[0];
    if (!file) return;
    let reader = new FileReader();
    reader.onload = function(evt) { terimaFileM3U(evt.target.result); };
    reader.readAsText(file);
}

// --- PLAYER & PARSER M3U ---
function pilihDanPlay(index, url, userAgent, referer, drm, licenseKey, licenseUrl) {
    simpanDataStorage("lastFocusedIndex", index);
    simpanDataStorage("lastCategory", kategoriAktif);

    let finalUA = userAgent || ambilUserAgentAktif();
    playTv(url, finalUA, referer, drm, licenseKey, licenseUrl);
}

function playTv(url, userAgent, referer, drm, licenseKey, licenseUrl) {
    if (window.Android && typeof window.Android.playTv === "function") {
        window.Android.playTv(url, userAgent, referer, drm, licenseKey, licenseUrl);
    } else {
        showToast("Memutar URL...");
    }
}

function parseM3U(data) {
    let lines = data.split("\n");
    let result = [];
    let name = "", logo = "", group = "", userAgent = "", referer = "", drm = "", licenseKey = "", licenseUrl = "";

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith("#EXTVLCOPT:http-user-agent=")) {
            userAgent = line.replace("#EXTVLCOPT:http-user-agent=", "");
        } else if (line.startsWith("#EXTVLCOPT:http-referrer=")) {
            referer = line.replace("#EXTVLCOPT:http-referrer=", "");
        } else if (line.startsWith("#KODIPROP:inputstream.adaptive.license_type=")) {
            let type = line.replace("#KODIPROP:inputstream.adaptive.license_type=", "");
            drm = type.includes("clearkey") ? "clearkey" : type;
        } else if (line.startsWith("#KODIPROP:inputstream.adaptive.license_key=")) {
            let key = line.replace("#KODIPROP:inputstream.adaptive.license_key=", "");
            if (key.startsWith("http")) licenseUrl = key;
            else licenseKey = key;
        } else if (line.startsWith("#EXTINF")) {
            let comma = line.lastIndexOf(",");
            name = line.substring(comma + 1);
            let logoPos = line.indexOf('tvg-logo="');
            if (logoPos != -1) logo = line.substring(logoPos + 10, line.indexOf('"', logoPos + 10));
            let groupPos = line.indexOf('group-title="');
            if (groupPos != -1) group = line.substring(groupPos + 13, line.indexOf('"', groupPos + 13));
        } else if (line.startsWith("http")) {
            let url = line;
            if (line.includes("|")) {
                let parts = line.split("|");
                url = parts[0];
                let params = parts[1];
                if (params.includes("user-agent=")) userAgent = decodeURIComponent(params.split("user-agent=")[1].split("&")[0]);
                if (params.includes("referrer=")) referer = decodeURIComponent(params.split("referrer=")[1]);
            }
            result.push({ name: name || "Tanpa Nama", logo, group, url, userAgent, referer, drm, licenseKey, licenseUrl });
            name = ""; logo = ""; group = ""; userAgent = ""; referer = ""; drm = ""; licenseKey = ""; licenseUrl = "";
        }
    }
    return result;
}

function formatGambarOptimized(url) {
    if (!url || url.trim() === "") return 'https://via.placeholder.com/300x169?text=No+Logo';
    return `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=250&output=webp&q=75`;
}

function buatElemenHTMLTV(tv, index) {
    return `
    <div class="item" tabindex="0" id="item-${index}" 
         onclick="pilihDanPlay(${index}, '${tv.url}', '${tv.userAgent}', '${tv.referer}', '${tv.drm}', '${tv.licenseKey}', '${tv.licenseUrl}')">
        <img loading="lazy" decoding="async" src="${formatGambarOptimized(tv.logo)}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x169?text=No+Logo';">
        <p>${tv.name}</p>
    </div>
    `;
}

function tampilkanTV(data) {
    let html = "";
    data.forEach((tv, index) => html += buatElemenHTMLTV(tv, index));
    document.getElementById("tvList").innerHTML = html;
}

function buatKategori() {
    let grup = ["Semua"];
    semuaTV.forEach(tv => {
        if (tv.group && !grup.includes(tv.group)) grup.push(tv.group);
    });

    let html = "";
    grup.forEach((g, idx) => {
        let activeClass = (g === kategoriAktif) ? "active" : "";
        html += `<button tabindex="0" id="kat-${idx}" class="${activeClass}" onclick="pilihKategori('${g}', this)">${g}</button>`;
    });

    document.getElementById("kategori").innerHTML = html;
}

function pilihKategori(g, element) {
    kategoriAktif = g;
    simpanDataStorage("lastCategory", g);
    document.querySelectorAll("#kategori button").forEach(btn => btn.classList.remove("active"));
    if (element) element.classList.add("active");

    let data = (g === "Semua") ? semuaTV : semuaTV.filter(tv => tv.group === g);
    tampilkanTV(data);
}

function cariChannel() {
    let text = document.getElementById("search").value.toLowerCase();
    let data = semuaTV.filter(tv => tv.name.toLowerCase().includes(text));
    tampilkanTV(data);
}
</script>

</body>
</html>
