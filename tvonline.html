<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>TV Online Multi-Playlist</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            background: #121212;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0 12px 12px 12px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .app-container::-webkit-scrollbar { display: none; }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #121212;
            padding-top: 12px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 12px 0;
            gap: 6px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0;
            font-size: 0;
            display: flex;
            align-items: center;
            height: 30px;
        }

        h2::before {
            content: "";
            display: block;
            width: 130px;
            height: 30px;
            background-image: url('https://posterfilm.pages.dev/poster/film_lawas/logoputihmrzyb.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: left center;
        }

        .playlist-tabs { display: flex; gap: 4px; }
        .tab-btn {
            background: #252525;
            color: #aaa;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }
        .tab-btn.active { background: #e50914; color: #fff; }
        .tab-btn:focus { outline: 2px solid #2ed573; }

        .btn-fs {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }
        .btn-fs:focus { outline: 2px solid #2ed573; }

        #btnPengaturan {
            background: #252525;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            outline: none;
        }
        #btnPengaturan:focus { outline: 2px solid #2ed573; background: #e50914; }

        #modalPlaylist {
            display: none;
            background: #1c1c1c;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        #modalPlaylist input[type="text"], #modalPlaylist select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .modal-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .button-group-row { display: flex; gap: 6px; }
        .modal-buttons button {
            padding: 8px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        .btn-file { background: #2ed573; color: #000; width: 100%; }
        .btn-save { background: #e50914; color: #fff; flex: 1; }
        .btn-reset { background: #333; color: #fff; flex: 1; }

        #search {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #282828;
            font-size: 13px;
            outline: none;
            background: #1c1c1c;
            color: #fff;
            flex-shrink: 0;
        }
        #search:focus { border-color: #2ed573; background: #222; }

        #kategori {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 0px;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        #kategori::-webkit-scrollbar { display: none; }
        #kategori button {
            background: #1c1c1c;
            color: #aaa;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 600;
        }
        #kategori button.active { background: #e50914; color: #fff; }
        #kategori button:focus { outline: 2px solid #2ed573; }

        .grid { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; padding-bottom: 20px; }
        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            outline: none;
            background: #1c1c1c;
            border-radius: 8px;
            padding: 8px 12px;
            border: 2px solid transparent;
            transition: background 0.2s;
            min-height: 54px;
        }
        .item img {
            width: 60px;
            height: 36px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .item-info { display: flex; flex-direction: column; overflow: hidden; }
        .item-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }
        .item-sub {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item:focus, .item.active-poster { border-color: #2ed573; background: #282828; }

        #customToast {
            visibility: hidden;
            min-width: 200px;
            background-color: #222;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px 12px;
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            font-size: 13px;
            border: 1px solid #e50914;
            pointer-events: none;
        }
        #customToast.show { visibility: visible; }
    </style>
</head>

<body>

<div class="app-container">

    <div class="sticky-header">
        <div class="header-container">
            <h2>mrzyb.tv</h2>
            <div class="playlist-tabs">
                <button id="tab-p1" class="tab-btn active" tabindex="0" onclick="gantiPlaylistUtama('p1')">P1</button>
                <button id="tab-p2" class="tab-btn" tabindex="0" onclick="gantiPlaylistUtama('p2')">P2</button>
                <button id="tab-p3" class="tab-btn" tabindex="0" onclick="gantiPlaylistUtama('p3')">P3</button>
            </div>
            <button id="btnFsNative" class="btn-fs" tabindex="0" onclick="panggilFullscreenNative()">⚡ Fullscreen</button>
            <button id="btnPengaturan" tabindex="0" onclick="toggleModal()">⚙️</button>
        </div>

        <div id="modalPlaylist">
            <div class="form-group" id="containerCustomUrl">
                <label for="inputCustomUrl">URL Remote Playlist:</label>
                <input type="text" id="inputCustomUrl" tabindex="0" readonly placeholder="Tekan OK untuk mengetik..." onkeydown="handleInputKey(event, this)" onclick="aktifkanKeyboard(this)" onblur="nonaktifkanKeyboard(this)">
            </div>

            <div class="form-group">
                <label for="selectUAMode">Pilih User-Agent Mode:</label>
                <select id="selectUAMode" tabindex="0" onchange="gantiUAMode()">
                    <option value="default">Default / Bawaan</option>
                    <option value="lgadrm">LGADRM MPD Player</option>
                    <option value="tivimate_new">TiviMate 5.1.6</option>
                    <option value="ott_player">OTT Player 1.7.4.1</option>
                    <option value="mozilla_m3u">Mozilla m3u-ip.tv</option>
                    <option value="ott_nav">OTT Navigator 1.9.6.4</option>
                    <option value="tivimate">TiviMate 4.6.1</option>
                    <option value="vlc">VLC 3.0.18</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div class="form-group" id="containerCustomUA" style="display:none;">
                <label for="inputCustomUA">Teks User-Agent Custom:</label>
                <input type="text" id="inputCustomUA" tabindex="0" readonly placeholder="Tekan OK untuk mengetik..." onkeydown="handleInputKey(event, this)" onclick="aktifkanKeyboard(this)" onblur="nonaktifkanKeyboard(this)">
            </div>

            <div class="modal-buttons">
                <button id="btnFileM3u" class="btn-file" tabindex="0" onclick="pilihFileInternal()">📁 Impor Media Lokal (.m3u)</button>
                <div class="button-group-row">
                    <button id="btnSavePlaylist" class="btn-save" tabindex="0" onclick="simpanPengaturan()">SIMPAN</button>
                    <button id="btnResetPlaylist" class="btn-reset" tabindex="0" onclick="resetKeUtama()">RESET SLOT INI</button>
                </div>
            </div>
            <input type="file" id="filePicker" accept=".m3u,.m3u8,.txt" style="display:none;" onchange="bacaFileWeb(event)">
        </div>

        <input id="search" tabindex="0" type="text" readonly placeholder="Cari channel... (Tekan OK)" oninput="cariChannel()" onkeydown="handleSearchKey(event)" onclick="aktifkanKeyboard(this)" onblur="nonaktifkanKeyboard(this)">
        <div id="kategori"></div>
    </div>

    <div class="grid" id="tvList">Memuat TV...</div>
</div>

<div id="customToast">Notifikasi</div>

<script>
const _playlist1_Base64 = "aHR0cHM6Ly9tcnp5YnR2LWFwaS51a2llbGFraTg4LndvcmtlcnMuZGV2L2FwaS9wbGF5bGlzdA==";
const PLAYLIST_1 = atob(_playlist1_Base64);
let semuaTV = [];
let sudahAutoPlay = false;

let lastActiveIndex = null;
let lastActivePosterElement = null;

document.addEventListener('focusin', function(e) {
    if (e.target && e.target.classList && e.target.classList.contains('item')) {
        lastActivePosterElement = e.target;
    }
}, true);

function aktifkanKeyboard(elem) {
    elem.removeAttribute("readonly");
    elem.focus();
}

function nonaktifkanKeyboard(elem) {
    elem.setAttribute("readonly", "readonly");
}

function handleInputKey(event, elem) {
    if (event.key === "Enter") {
        if (elem.hasAttribute("readonly")) {
            event.preventDefault();
            aktifkanKeyboard(elem);
        }
    }
}

function simpanDataStorage(key, val) {
    if (window.Android && typeof window.Android.savePlaylistData === "function") {
        window.Android.savePlaylistData(key, val);
    }
    localStorage.setItem(key, val);
}

function ambilDataStorage(key) {
    if (window.Android && typeof window.Android.getPlaylistData === "function") {
        let val = window.Android.getPlaylistData(key);
        if (val && val !== "") return val;
    }
    return localStorage.getItem(key) || "";
}

function hapusDataStorage(key) {
    if (window.Android && typeof window.Android.savePlaylistData === "function") {
        window.Android.savePlaylistData(key, "");
    }
    localStorage.removeItem(key);
}

let kategoriAktif = ambilDataStorage("lastCategory") || "Semua";

const PRESET_UA = {
    lgadrm: "lgadrm.mpdplayer/v1;SM-M215F",
    tivimate_new: "TiviMate/5.1.6",
    ott_player: "OTT Player / 1.7.4.1 (Linux; Android 12; in; SM-M215F)",
    mozilla_m3u: "Mozilla/5.0 (m3u-ip.tv 3.0.0) Android",
    ott_nav: "OTT Navigator 1.9.6.4 (Android; TV)",
    tivimate: "TiviMate/4.6.1 (Android TV)",
    vlc: "VLC/3.0.18 (Linux; Android 10)"
};

function gantiUAMode() {
    let mode = document.getElementById("selectUAMode").value;
    document.getElementById("containerCustomUA").style.display = mode === "custom" ? "block" : "none";
}

function ambilUserAgentAktif() {
    let mode = ambilDataStorage("ua_mode") || "default";
    if (mode === "custom") return ambilDataStorage("custom_ua_text");
    if (PRESET_UA[mode]) return PRESET_UA[mode];
    return "";
}

function showToast(pesan) {
    let toast = document.getElementById("customToast");
    toast.innerText = pesan;
    toast.className = "show";
    setTimeout(() => { toast.className = ""; }, 2500);
}

function updateTabUI(activeTab) {
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    let btn = document.getElementById(`tab-${activeTab}`);
    if (btn) btn.classList.add("active");
}

function gantiPlaylistUtama(tipe) {
    simpanDataStorage("activeTabPlaylist", tipe);
    simpanDataStorage("lastCategory", "Semua");
    hapusDataStorage("lastFocusedIndex");
    updateTabUI(tipe);
    sudahAutoPlay = false;
    muatDataTV();
}

function muatDataTV() {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    updateTabUI(activeTab);

    if (activeTab === "p1") {
        muatDariURL(PLAYLIST_1);
        return;
    }

    let localData = ambilDataStorage(`localM3uContent_${activeTab}`);
    let customUrl = ambilDataStorage(`customPlaylistURL_${activeTab}`);

    if (localData && !customUrl) {
        let tvData = parseM3U(localData);
        if (tvData.length > 0) {
            semuaTV = tvData;
            prosesTampilan();
            return;
        }
    }

    if (customUrl) {
        muatDariURL(customUrl);
    } else {
        semuaTV = [];
        document.getElementById("tvList").innerHTML = "Slot ini masih kosong. Klik ⚙️ untuk menambah M3U.";
        buatKategori();
    }
}

function muatDariURL(targetURL) {
    document.getElementById("tvList").innerHTML = "Memuat TV...";

    if (window.Android && typeof window.Android.fetchUrl === "function") {
        setTimeout(() => {
            try {
                let activeUA = ambilUserAgentAktif();
                let responseData = window.Android.fetchUrl(targetURL, activeUA);

                if (responseData && !responseData.startsWith("ERROR:")) {
                    let tvData = parseM3U(responseData);
                    if (tvData.length > 0) {
                        semuaTV = tvData;
                        prosesTampilan();
                        return;
                    }
                }
                throw new Error("Gagal parsing");
            } catch (err) {
                document.getElementById("tvList").innerHTML = "Gagal membaca Playlist.";
            }
        }, 50);
        return;
    }

    let fetchURL = targetURL;
    if (targetURL.includes("bit.ly") || targetURL.includes("tinyurl.com") || targetURL.includes("s.id")) {
        fetchURL = "https://corsproxy.io/?" + encodeURIComponent(targetURL);
    }

    fetch(fetchURL)
        .then(res => res.text())
        .then(data => {
            semuaTV = parseM3U(data);
            prosesTampilan();
        })
        .catch(() => {
            document.getElementById("tvList").innerHTML = "Gagal membaca Playlist.";
        });
}

function prosesTampilan() {
    let savedKat = ambilDataStorage("lastCategory") || "Semua";
    kategoriAktif = savedKat;
    buatKategori();

    let dataToDisplay = semuaTV;
    if (savedKat !== "Semua") {
        dataToDisplay = semuaTV.filter(tv => tv.group === savedKat);
    }

    tampilkanTV(dataToDisplay);
    autoPlayChannelPertama(dataToDisplay);
}

function autoPlayChannelPertama(data) {
    if (sudahAutoPlay || !data || data.length === 0) return;
    if (!window.Android || typeof window.Android.playTv !== "function") return;

    sudahAutoPlay = true;
    lastActiveIndex = 0;
    let tv = data[0];

    let activeGlobalUA = ambilUserAgentAktif();
    let finalUA = (tv.userAgent && tv.userAgent.trim() !== "") ? tv.userAgent : activeGlobalUA;

    setTimeout(() => {
        try {
            window.Android.playTv(
                tv.url || "", finalUA, tv.referer || "", tv.drm || "", tv.licenseKey || "", tv.licenseUrl || ""
            );
        } catch (e) {
            sudahAutoPlay = false;
        }
    }, 300);
}

function formatGambarOptimized(url) {
    if (!url || url.trim() === "") return "https://via.placeholder.com/150x84?text=No+Logo";
    return "https://images.weserv.nl/?url=" + encodeURIComponent(url) + "&w=180&output=webp&q=60";
}

function buatElemenHTMLTV(tv, index) {
    let safeUrl = (tv.url || "").replace(/'/g, "\\'");
    let safeUA = (tv.userAgent || "").replace(/'/g, "\\'");
    let safeRef = (tv.referer || "").replace(/'/g, "\\'");
    let safeDrm = (tv.drm || "").replace(/'/g, "\\'");
    let safeKey = (tv.licenseKey || "").replace(/'/g, "\\'");
    let safeLicUrl = (tv.licenseUrl || "").replace(/'/g, "\\'");

    return `
        <div class="item"
             tabindex="0"
             id="item-${index}"
             onkeydown="handleItemKey(event, ${index})"
             onclick="pilihDanPlay(
                 ${index},
                 '${safeUrl}',
                 '${safeUA}',
                 '${safeRef}',
                 '${safeDrm}',
                 '${safeKey}',
                 '${safeLicUrl}'
             )">
            <img loading="lazy" decoding="async" src="${formatGambarOptimized(tv.logo)}" onerror="this.onerror=null;this.src='https://via.placeholder.com/150x84?text=No+Logo';">
            <div class="item-info">
                <div class="item-title">${tv.name}</div>
                <div class="item-sub">${tv.group || "Umum"}</div>
            </div>
        </div>
    `;
}

function tampilkanTV(data) {
    let html = "";
    data.forEach((tv, index) => { html += buatElemenHTMLTV(tv, index); });
    document.getElementById("tvList").innerHTML = html;
    pulihkanFokusSTB();
}

function tampilkanTVTanpaFokus(data) {
    let html = "";
    data.forEach((tv, index) => { html += buatElemenHTMLTV(tv, index); });
    document.getElementById("tvList").innerHTML = html;
}

function pulihkanFokusSTB() {
    setTimeout(() => {
        if (lastActivePosterElement && typeof lastActivePosterElement.focus === "function" && document.body.contains(lastActivePosterElement)) {
            lastActivePosterElement.focus();
            lastActivePosterElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        let targetIndex = lastActiveIndex !== null ? lastActiveIndex : ambilDataStorage("lastFocusedIndex");
        if (targetIndex !== null && targetIndex !== "" && targetIndex !== undefined) {
            let targetItem = document.getElementById(`item-${targetIndex}`);
            if (targetItem) {
                targetItem.focus();
                targetItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
        }

        let firstItem = document.getElementById("item-0");
        if (firstItem) firstItem.focus();
    }, 100);
}

function buatKategori() {
    let grup = ["Semua"];
    semuaTV.forEach(tv => {
        if (tv.group && !grup.includes(tv.group)) grup.push(tv.group);
    });

    let html = "";
    grup.forEach((g, idx) => {
        let activeClass = g === kategoriAktif ? "active" : "";
        html += `
            <button tabindex="0" id="kat-${idx}" class="${activeClass}"
                    onkeydown="handleCategoryKey(event, ${idx}, ${grup.length})"
                    onclick="pilihKategori('${g.replace(/'/g, "\\'")}', this)">
                ${g}
            </button>
        `;
    });
    document.getElementById("kategori").innerHTML = html;
}

function handleSearchKey(event) {
    let searchElem = document.getElementById("search");
    if (event.key === "Enter") {
        if (searchElem.hasAttribute("readonly")) {
            event.preventDefault();
            aktifkanKeyboard(searchElem);
        }
    } else if (event.key === "ArrowUp") {
        event.preventDefault();
        searchElem.blur();
        let activeTab = document.querySelector(".tab-btn.active") || document.getElementById("tab-p1");
        if (activeTab) activeTab.focus();
    } else if (event.key === "ArrowDown") {
        event.preventDefault();
        searchElem.blur();
        let activeCategoryBtn = document.querySelector("#kategori button.active") || document.getElementById("kat-0");
        if (activeCategoryBtn) activeCategoryBtn.focus();
    }
}

function handleCategoryKey(event, index, totalKat) {
    if (event.key === "ArrowUp") {
        event.preventDefault();
        document.getElementById("search").focus();
    } else if (event.key === "ArrowDown") {
        event.preventDefault();
        let targetItem = (lastActiveIndex !== null) ? document.getElementById(`item-${lastActiveIndex}`) : document.getElementById("item-0");
        if (targetItem) targetItem.focus();
    } else if (event.key === "ArrowRight" && index < totalKat - 1) {
        event.preventDefault();
        document.getElementById(`kat-${index + 1}`).focus();
    } else if (event.key === "ArrowLeft" && index > 0) {
        event.preventDefault();
        document.getElementById(`kat-${index - 1}`).focus();
    }
}

function handleItemKey(event, index) {
    if (event.key === "ArrowUp" && index === 0) {
        event.preventDefault();
        let activeCategoryBtn = document.querySelector("#kategori button.active") || document.getElementById("kat-0");
        if (activeCategoryBtn) activeCategoryBtn.focus();
    }
}

function pilihKategori(g, element) {
    kategoriAktif = g;
    simpanDataStorage("lastCategory", g);

    document.querySelectorAll("#kategori button").forEach(btn => btn.classList.remove("active"));
    if (element) {
        element.classList.add("active");
        element.focus();
    }

    let data = semuaTV;
    if (g !== "Semua") {
        data = semuaTV.filter(tv => tv.group === g);
    }

    tampilkanTVTanpaFokus(data);
}

function cariChannel() {
    let text = document.getElementById("search").value.toLowerCase();
    let data = semuaTV.filter(tv => tv.name.toLowerCase().includes(text));
    tampilkanTVTanpaFokus(data);
}

function pilihDanPlay(index, url, userAgent, referer, drm, licenseKey, licenseUrl) {
    lastActiveIndex = index;
    lastActivePosterElement = document.getElementById(`item-${index}`);
    simpanDataStorage("lastFocusedIndex", index);
    simpanDataStorage("lastCategory", kategoriAktif);

    let activeGlobalUA = ambilUserAgentAktif();
    let finalUA = (userAgent && userAgent.trim() !== "") ? userAgent : activeGlobalUA;

    if (window.Android && typeof window.Android.playTv === "function") {
        window.Android.playTv(url, finalUA, referer, drm, licenseKey, licenseUrl);
    }
}

function panggilFullscreenNative() {
    if (window.Android && typeof window.Android.openTvFullscreen === "function") {
        window.Android.openTvFullscreen();
    } else {
        showToast("Pilih channel terlebih dahulu.");
    }
}

function toggleModal() {
    let modal = document.getElementById("modalPlaylist");
    if (modal.style.display === "block") {
        modal.style.display = "none";
        document.getElementById("btnPengaturan").focus();
        return;
    }

    modal.style.display = "block";
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    let savedUrl = ambilDataStorage(`customPlaylistURL_${activeTab}`);
    let savedUAMode = ambilDataStorage("ua_mode") || "default";
    let savedUAText = ambilDataStorage("custom_ua_text");

    let containerUrl = document.getElementById("containerCustomUrl");
    let btnFile = document.getElementById("btnFileM3u");

    if (activeTab === "p1") {
        containerUrl.style.display = "none";
        btnFile.style.display = "none";
    } else {
        containerUrl.style.display = "block";
        btnFile.style.display = "block";
    }

    document.getElementById("inputCustomUrl").value = savedUrl;
    document.getElementById("selectUAMode").value = savedUAMode;
    document.getElementById("inputCustomUA").value = savedUAText;

    gantiUAMode();

    setTimeout(() => {
        if (activeTab !== "p1") {
            document.getElementById("inputCustomUrl").focus();
        } else {
            document.getElementById("selectUAMode").focus();
        }
    }, 50);
}

function simpanPengaturan() {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    let modeUA = document.getElementById("selectUAMode").value;
    let customUAText = document.getElementById("inputCustomUA").value.trim();

    simpanDataStorage("ua_mode", modeUA);
    simpanDataStorage("custom_ua_text", customUAText);

    if (activeTab !== "p1") {
        let urlBaru = document.getElementById("inputCustomUrl").value.trim();
        if (urlBaru !== "") {
            hapusDataStorage(`localM3uContent_${activeTab}`);
            simpanDataStorage(`customPlaylistURL_${activeTab}`, urlBaru);
        }
    }

    simpanDataStorage("lastCategory", "Semua");
    toggleModal();
    sudahAutoPlay = false;
    muatDataTV();
    showToast("Disimpan!");
}

function resetKeUtama() {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";

    if (activeTab === "p1") {
        hapusDataStorage("ua_mode");
        hapusDataStorage("custom_ua_text");
    } else {
        hapusDataStorage(`customPlaylistURL_${activeTab}`);
        hapusDataStorage(`localM3uContent_${activeTab}`);
    }

    toggleModal();
    sudahAutoPlay = false;
    muatDataTV();
    showToast("Di-reset!");
}

function pilihFileInternal() {
    if (window.Android && typeof window.Android.openFileChooser === "function") {
        window.Android.openFileChooser();
    } else {
        document.getElementById("filePicker").click();
    }
}

function terimaFileM3U(isiM3U) {
    let activeTab = ambilDataStorage("activeTabPlaylist") || "p1";
    if (activeTab === "p1") return;

    if (isiM3U && isiM3U.trim() !== "") {
        hapusDataStorage(`customPlaylistURL_${activeTab}`);
        simpanDataStorage(`localM3uContent_${activeTab}`, isiM3U);
        simpanDataStorage("lastCategory", "Semua");
        toggleModal();
        sudahAutoPlay = false;
        muatDataTV();
        showToast("File Tersimpan!");
    }
}

function bacaFileWeb(e) {
    let file = e.target.files[0];
    if (!file) return;

    let reader = new FileReader();
    reader.onload = function(evt) {
        terimaFileM3U(evt.target.result);
    };
    reader.readAsText(file);
}

function parseM3U(data) {
    let lines = data.split("\n");
    let result = [];

    let name = "", logo = "", group = "", userAgent = "", referer = "", drm = "", licenseKey = "", licenseUrl = "";

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith("#EXTVLCOPT:http-user-agent=")) {
            userAgent = line.replace("#EXTVLCOPT:http-user-agent=", "");
        } else if (line.startsWith("#EXTVLCOPT:http-referrer=")) {
            referer = line.replace("#EXTVLCOPT:http-referrer=", "");
        } else if (line.startsWith("#KODIPROP:inputstream.adaptive.license_type=")) {
            let type = line.replace("#KODIPROP:inputstream.adaptive.license_type=", "");
            drm = type.includes("clearkey") ? "clearkey" : type;
        } else if (line.startsWith("#KODIPROP:inputstream.adaptive.license_key=")) {
            let key = line.replace("#KODIPROP:inputstream.adaptive.license_key=", "");
            if (key.startsWith("http")) {
                licenseUrl = key;
            } else {
                licenseKey = key;
            }
        } else if (line.startsWith("#EXTINF")) {
            let comma = line.lastIndexOf(",");
            name = line.substring(comma + 1);

            let logoPos = line.indexOf('tvg-logo="');
            if (logoPos !== -1) {
                logo = line.substring(logoPos + 10, line.indexOf('"', logoPos + 10));
            }

            let groupPos = line.indexOf('group-title="');
            if (groupPos !== -1) {
                group = line.substring(groupPos + 13, line.indexOf('"', groupPos + 13));
            }
        } else if (line.startsWith("http")) {
            let url = line;
            if (line.includes("|")) {
                let parts = line.split("|");
                url = parts[0];
                let params = parts[1];
                if (params.includes("user-agent=")) {
                    userAgent = decodeURIComponent(params.split("user-agent=")[1].split("&")[0]);
                }
                if (params.includes("referrer=")) {
                    referer = decodeURIComponent(params.split("referrer=")[1]);
                }
            }

            result.push({
                name: name || "Tanpa Nama",
                logo: logo,
                group: group,
                url: url,
                userAgent: userAgent,
                referer: referer,
                drm: drm,
                licenseKey: licenseKey,
                licenseUrl: licenseUrl
            });

            name = ""; logo = ""; group = ""; userAgent = ""; referer = ""; drm = ""; licenseKey = ""; licenseUrl = "";
        }
    }
    return result;
}

muatDataTV();
