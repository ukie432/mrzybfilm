<!DOCTYPE html>
<html lang="id">
<head>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Online</title>
    <style>
    * { box-sizing: border-box; }
    /* WAJIB TRANSPARAN SUPAYA VIDEONYA KELIATAN */
    html, body { 
        margin: 0; 
        padding: 0;
        background-color: transparent !important; 
        color: #fff; 
        font-family: Arial, sans-serif;
        overflow: hidden; 
        height: 100vh; 
    }
    
    .main-container { display: flex; width: 100vw; height: 100vh; justify-content: flex-end; background: transparent !important; }
    .player-controls-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; pointer-events: none; }
    .player-overlay-info { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; align-self: flex-start; }
    
    /* Sidebar Kanan */
    .sidebar { width: 340px; background: rgba(15, 15, 15, 0.9); height: 100vh; display: flex; flex-direction: column; z-index: 10; }
    .header-container { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #111; border-bottom: 1px solid #333; }
    h2 { margin: 0; font-size: 16px; color: #fff; }

    .grid { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .item { cursor: pointer; background: rgba(255, 255, 255, 0.08); border-radius: 6px; display: flex; align-items: center; padding: 8px; gap: 10px; }
    .item:focus { border: 2px solid #e50914; background: rgba(229, 9, 20, 0.4); }
    .item img { width: 45px; height: 30px; object-fit: contain; background: #000; border-radius: 4px; }
    .item-title { font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="player-controls-container">
        <div class="player-overlay-info" id="channelInfo">Pilih Channel...</div>
    </div>

    <div class="sidebar">
        <div class="header-container">
            <h2>mrzyb.tv</h2>
        </div>
        <div class="grid" id="tvList">Memuat Channel...</div>
    </div>
</div>

<script>
const PLAYLIST_URL = "https://raw.githubusercontent.com/ukie432/mrzybfilm/refs/heads/main/Playlist.m3u";

function muatTV() {
    fetch(PLAYLIST_URL)
    .then(res => res.text())
    .then(data => {
        let lines = data.split("\n");
        let listHtml = "";
        let name = "", logo = "";

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith("#EXTINF")) {
                let comma = line.lastIndexOf(",");
                name = line.substring(comma + 1);
                let logoPos = line.indexOf('tvg-logo="');
                if (logoPos != -1) logo = line.substring(logoPos + 10, line.indexOf('"', logoPos + 10));
            } else if (line.startsWith("http")) {
                listHtml += `
                <div class="item" tabindex="0" onclick="putar('${line}', '${name}')">
                    <img src="${logo}" onerror="this.src='https://via.placeholder.com/150';">
                    <span class="item-title">${name}</span>
                </div>`;
                name = ""; logo = "";
            }
        });
        document.getElementById("tvList").innerHTML = listHtml;
    })
    .catch(() => {
        document.getElementById("tvList").innerHTML = "Gagal memuat playlist.";
    });
}

function putar(url, nama) {
    document.getElementById("channelInfo").innerText = "Memutar: " + nama;
    if (window.Android && typeof window.Android.playTv === "function") {
        window.Android.playTv(url, "", "", "", "", "");
    }
}

muatTV();
</script>
</body>
</html>
