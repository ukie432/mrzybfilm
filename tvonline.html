<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRZYBtv Streaming</title>
    <style>
        /* PENTING: Body dan Container harus transparan agar ExoPlayer di belakang WebView terlihat */
        body { margin: 0; background: transparent !important; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        
        .main-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Area Kiri: Transparan & Tidak menangkap klik (Klik tembus ke ExoPlayer) */
        .player-overlay { flex: 1; pointer-events: none; }
        
        /* Area Kanan: Sidebar (Hanya ini yang berwarna dan bisa diklik) */
        .sidebar { 
            width: 340px; 
            background: rgba(20, 20, 20, 0.98); 
            height: 100vh; 
            pointer-events: auto; 
            z-index: 10; 
            display: flex; 
            flex-direction: column;
            border-left: 1px solid #333;
        }

        /* Styling Sidebar Lainnya */
        .header { padding: 15px; background: #111; color: #fff; font-weight: bold; border-bottom: 1px solid #333; }
        .grid { flex: 1; overflow-y: auto; padding: 10px; }
        .item { padding: 12px; margin-bottom: 8px; background: #222; color: #fff; border-radius: 6px; cursor: pointer; }
        .item:focus { background: #e50914; outline: none; }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Area Kiri: Tembus Pandang ke ExoPlayer Native -->
    <div class="player-overlay"></div>

    <!-- Area Kanan: UI Daftar Channel -->
    <div class="sidebar">
        <div class="header">Daftar Channel</div>
        <div class="grid" id="tvList">
            <!-- Contoh Channel -->
            <div class="item" tabindex="0" onclick="pilihChannel('RTV', 'https://link-stream-rtv.m3u8')">RTV</div>
            <div class="item" tabindex="0" onclick="pilihChannel('Indosiar', 'https://link-stream-indosiar.m3u8')">Indosiar</div>
        </div>
    </div>
</div>

<script>
    // Fungsi Bridge untuk komunikasi ke Java Native
    function pilihChannel(name, url) {
        console.log("Memutar: " + name);
        
        // Memanggil fungsi playTv yang ada di WebAppInterface (Java)
        if (window.Android && typeof window.Android.playTv === "function") {
            window.Android.playTv(url, "", "", "", "", "");
        } else {
            alert("Bridge Android tidak ditemukan!");
        }
    }

    // Tambahkan loading data playlist dari GitHub kamu di sini jika perlu
</script>

</body>
</html>
