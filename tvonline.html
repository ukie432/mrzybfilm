<!DOCTYPE html>
<html lang="id">
<head>    
    <meta charset="utf-8">
    <meta content='width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' name='viewport'/>

    <title>TV Online</title>

    <style>
    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        color: #fff;
    }

    h2 {
        text-align: center;
        padding: 15px;
    }

    #search {
        width: 90%;
        margin: 10px auto;
        display: block;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        outline: none;
    }

    #search:focus {
        border: 2px solid #00bfff;
    }

    #kategori {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 10px;
        scroll-behavior: smooth;
    }

    #kategori button {
        background: #333;
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 20px;
        white-space: nowrap;
        cursor: pointer;
        outline: none;
        transition: .2s;
        flex-shrink: 0;
    }

    #kategori button:focus, #kategori button.active {
        background: #00bfff;
        color: #000;
        transform: scale(1.05);
        box-shadow: 0 0 10px #00bfff;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .item {
        cursor: pointer;
        outline: none;
        transition: .2s;
        content-visibility: auto;
        contain-intrinsic-size: 1px 120px;
        background: #1a1a1a;
        border-radius: 10px;
        overflow: hidden;
    }

    .item img {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: contain;
        background: #222;
        display: block;
    }

    .item p {
        text-align: center;
        margin: 8px 0;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 5px;
    }

    .item:focus {
        transform: scale(1.08);
    }

    .item:focus img {
        border: 3px solid #00bfff;
    }
    </style>
</head>
<body>

<h2>TV ONLINE</h2>

<input 
id="search"
type="text"
placeholder="Cari channel..."
oninput="cariChannel()"
onkeydown="handleSearchKey(event)">

<div id="kategori"></div>

<div class="grid" id="tvList">Memuat TV...</div>

<script>
const playlistURL = "https://mrzybtv-api.ukielaki88.workers.dev/api/playlist";

let semuaTV = [];
let kategoriAktif = "Semua";

function formatGambarOptimized(url) {
    if (!url || url.trim() === "") {
        return 'https://via.placeholder.com/300x169?text=No+Logo';
    }
    return `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=250&output=webp&q=75`;
}

// Membaca State dari URL Parameter Tanpa Membuat Riwayat Browser Baru
function bacaStateDariURL() {
    let params = new URLSearchParams(window.location.search);
    let kat = params.get("kat") || localStorage.getItem("activeCategory") || "Semua";
    let idx = params.get("idx") || localStorage.getItem("lastFocusedIndex");
    return { kat: kat, idx: idx };
}

function simpanState(kat, idx) {
    kategoriAktif = kat;
    try {
        localStorage.setItem("activeCategory", kat);
        if (idx !== null && idx !== undefined) {
            localStorage.setItem("lastFocusedIndex", idx);
        }
    } catch(e) {}

    // KUNCI UTAMA: replaceState TIDAK MENAMBAH RIWAYAT BACK BROWSER
    let newUrl = window.location.pathname + `?kat=${encodeURIComponent(kat)}&idx=${idx !== null ? idx : ''}`;
    window.history.replaceState(null, "", newUrl);
}

function muatDataPlaylist() {
    let state = bacaStateDariURL();
    kategoriAktif = state.kat;

    fetch(playlistURL)
    .then(response => response.text())
    .then(data => {
        let tvData = parseM3U(data);
        semuaTV = tvData;
        
        buatKategori();

        let filteredData = semuaTV;
        if (kategoriAktif !== "Semua") {
            filteredData = semuaTV.filter(tv => tv.group === kategoriAktif);
        }

        tampilkanTV(filteredData, state.idx);
    })
    .catch(error => {
        document.getElementById("tvList").innerHTML = "Gagal membaca Playlist.m3u";
    });
}

function buatElemenHTMLTV(tv, index) {
    const logoOptimized = formatGambarOptimized(tv.logo);
    
    return `
    <div class="item" tabindex="0" id="item-${index}" 
         onkeydown="handleItemKey(event, ${index})"
         onclick="pilihDanPlay(${index}, '${tv.url}', '${tv.userAgent}', '${tv.referer}', '${tv.drm}', '${tv.licenseKey}', '${tv.licenseUrl}')">
        <img loading="lazy" decoding="async" src="${logoOptimized}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x169?text=No+Logo';">
        <p>${tv.name}</p>
    </div>
    `;
}

function tampilkanTV(data, targetIndex) {
    let html = "";
    data.forEach((tv, index) => {
        html += buatElemenHTMLTV(tv, index);
    });
    document.getElementById("tvList").innerHTML = html;

    pulihkanFokusSTB(targetIndex);
}

function tampilkanTVTanpaFokus(data) {
    let html = "";
    data.forEach((tv, index) => {
        html += buatElemenHTMLTV(tv, index);
    });
    document.getElementById("tvList").innerHTML = html;
}

function pulihkanFokusSTB(targetIndex) {
    let state = bacaStateDariURL();
    let indexUntukFokus = (targetIndex !== null && targetIndex !== undefined) ? targetIndex : state.idx;

    let retries = 0;
    function eksekusiFokus() {
        let targetElem = null;

        if (indexUntukFokus !== null && indexUntukFokus !== undefined && indexUntukFokus !== '') {
            targetElem = document.getElementById(`item-${indexUntukFokus}`);
        }

        if (targetElem) {
            targetElem.focus();
            targetElem.scrollIntoView({ behavior: 'auto', block: 'center' });
        } else if (retries < 40) { 
            retries++;
            setTimeout(eksekusiFokus, 100);
        } else {
            let firstItem = document.getElementById("item-0");
            if (firstItem) {
                firstItem.focus();
                firstItem.scrollIntoView({ behavior: 'auto', block: 'center' });
            }
        }
    }

    setTimeout(eksekusiFokus, 200);
}

function buatKategori() {
    let grup = ["Semua"];

    semuaTV.forEach(tv => {
        if (tv.group && !grup.includes(tv.group)) {
            grup.push(tv.group);
        }
    });

    let html = "";
    grup.forEach((g, idx) => {
        let isSelected = (g === kategoriAktif) ? "active" : "";
        html += `
        <button tabindex="0" id="kat-${idx}" class="${isSelected}"
                onkeydown="handleCategoryKey(event, ${idx}, ${grup.length})"
                onclick="pilihKategori('${g}', this)">
            ${g}
        </button>
        `;
    });

    let containerKategori = document.getElementById("kategori");
    containerKategori.innerHTML = html;

    containerKategori.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("focus", () => {
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        });
    });
}

function handleSearchKey(event) {
    if (event.key === 'Enter' || event.key === 'ArrowDown') {
        event.preventDefault();
        document.getElementById('search').blur();
        let activeCategoryBtn = document.querySelector("#kategori button.active") || document.getElementById("kat-0");
        if (activeCategoryBtn) activeCategoryBtn.focus();
    }
}

function handleCategoryKey(event, index, totalKat) {
    if (event.key === 'ArrowUp') {
        event.preventDefault();
        let searchInput = document.getElementById('search');
        if (searchInput) searchInput.focus();
    } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        let firstItem = document.getElementById("item-0");
        if (firstItem) firstItem.focus();
    } else if (event.key === 'ArrowRight' && index < totalKat - 1) {
        event.preventDefault();
        let nextKat = document.getElementById(`kat-${index + 1}`);
        if (nextKat) nextKat.focus();
    } else if (event.key === 'ArrowLeft' && index > 0) {
        event.preventDefault();
        let prevKat = document.getElementById(`kat-${index - 1}`);
        if (prevKat) prevKat.focus();
    }
}

function handleItemKey(event, index) {
    let gridContainer = document.getElementById("tvList");
    let containerWidth = gridContainer ? gridContainer.clientWidth : 800;
    let columns = Math.max(1, Math.floor(containerWidth / 190));

    if (event.key === 'ArrowUp') {
        if (index < columns) {
            event.preventDefault();
            let activeCategoryBtn = document.querySelector("#kategori button.active") || document.getElementById("kat-0");
            if (activeCategoryBtn) activeCategoryBtn.focus();
        }
    }
}

function pilihKategori(g, element) {
    simpanState(g, 0);

    document.querySelectorAll("#kategori button").forEach(btn => btn.classList.remove("active"));
    if (element) element.classList.add("active");

    let data = semuaTV;
    if (g !== "Semua") {
        data = semuaTV.filter(tv => tv.group === g);
    }

    tampilkanTVTanpaFokus(data);

    if (element) {
        element.focus();
    }
}

function cariChannel() {
    let text = document.getElementById("search").value.toLowerCase();
    let data = semuaTV.filter(tv => tv.name.toLowerCase().includes(text));
    tampilkanTVTanpaFokus(data);
}

function pilihDanPlay(index, url, userAgent, referer, drm, licenseKey, licenseUrl) {
    // Simpan posisi tanpa membuat riwayat baru
    simpanState(kategoriAktif, index);

    playTv(url, userAgent, referer, drm, licenseKey, licenseUrl);
}

function parseM3U(data) {
    let lines = data.split("\n");
    let result = [];

    let name = "";
    let logo = "";
    let group = "";
    let userAgent = "";
    let referer = "";
    let drm = "";
    let licenseKey = "";
    let licenseUrl = "";

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith("#EXTVLCOPT:http-user-agent=")) {
            userAgent = line.replace("#EXTVLCOPT:http-user-agent=", "");
        } else if (line.startsWith("#EXTVLCOPT:http-referrer=")) {
            referer = line.replace("#EXTVLCOPT:http-referrer=", "");
        } else if (line.startsWith("#KODIPROP:inputstream.adaptive.license_type=")) {
            let type = line.replace("#KODIPROP:inputstream.adaptive.license_type=", "");
            drm = type.includes("clearkey") ? "clearkey" : type;
        } else if (line.startsWith("#KODIPROP:inputstream.adaptive.license_key=")) {
            let key = line.replace("#KODIPROP:inputstream.adaptive.license_key=", "");
            if (key.startsWith("http")) {
                licenseUrl = key;
            } else {
                licenseKey = key;
            }
        } else if (line.startsWith("#EXTINF")) {
            let comma = line.lastIndexOf(",");
            name = line.substring(comma + 1);

            let logoPos = line.indexOf('tvg-logo="');
            if (logoPos != -1) {
                logo = line.substring(logoPos + 10, line.indexOf('"', logoPos + 10));
            }

            let groupPos = line.indexOf('group-title="');
            if (groupPos != -1) {
                group = line.substring(groupPos + 13, line.indexOf('"', groupPos + 13));
            }
        } else if (line.startsWith("http")) {
            let url = line;

            if (line.includes("|")) {
                let parts = line.split("|");
                url = parts[0];
                let params = parts[1];

                if (params.includes("user-agent=")) {
                    userAgent = decodeURIComponent(params.split("user-agent=")[1].split("&")[0]);
                }
                if (params.includes("referrer=")) {
                    referer = decodeURIComponent(params.split("referrer=")[1]);
                }
            }

            result.push({
                name: name || "Tanpa Nama",
                logo: logo,
                group: group,
                url: url,
                userAgent: userAgent,
                referer: referer,
                drm: drm,
                licenseKey: licenseKey,
                licenseUrl: licenseUrl
            });

            name = "";
            logo = "";
            group = "";
            userAgent = "";
            referer = "";
            drm = "";
            licenseKey = "";
            licenseUrl = "";
        }
    }
    return result;
}

function playTv(url, userAgent, referer, drm, licenseKey, licenseUrl) {
    if (window.Android) {
        Android.playTv(url, userAgent, referer, drm, licenseKey, licenseUrl);
    } else {
        alert(url);
    }
}

// Handler khusus tombol Back Remote STB untuk keluar aplikasi
document.addEventListener("keydown", function(event) {
    // Keycode tombol Back pada berbagai merk Remote STB/Android TV
    if (event.keyCode === 4 || event.keyCode === 27 || event.keyCode === 10009 || event.key === "Backspace" || event.key === "GoBack") {
        let activeElem = document.activeElement;
        
        // Jika fokus sedang di Poster TV -> Pindahkan fokus ke tombol Kategori aktif dulu
        if (activeElem && activeElem.classList.contains("item")) {
            event.preventDefault();
            let activeCategoryBtn = document.querySelector("#kategori button.active") || document.getElementById("kat-0");
            if (activeCategoryBtn) {
                activeCategoryBtn.focus();
            }
        } 
        // Jika fokus sudah ada di Kategori/Search -> Tekan Back sekali lagi akan langsung KELUAR Aplikasi
        else if (window.Android && typeof Android.exitApp === "function") {
            event.preventDefault();
            Android.exitApp();
        }
    }
});

// Jalankan otomatis saat halaman dimuat
muatDataPlaylist();
</script>

</body>
</html>
