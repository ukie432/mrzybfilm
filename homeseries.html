<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="utf-8">
    <meta content='width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' name='viewport'/>

    <title>MRZYB TV - High Quality Background</title>

    <!-- PRELOAD GAMBAR UTAMA AGAR DILUAT SERENTAK SAAT PERTAMA KALI DIBUKA -->
    <link rel="https://iptv-posterku.pages.dev/poster/film_dubbing/Dubbing1.webp">
    <link rel="https://iptv-posterku.pages.dev/poster/film_dubbing/Indo%201.webp">
    <link rel="https://iptv-posterku.pages.dev/poster/film_dubbing/Anime1.webp">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #eee;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: pan-y; /* Mencegah bentrok dengan scroll bawaan HP */
        }

        /* === CONTAINER BACKGROUND === */
        .bg-container { 
            position: absolute; 
            inset: 0; 
            z-index: 1; 
            background-color: #000;
        }
        
        .bg-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: .7;
        }
        
        .overlay { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(to top, rgba(0,0,0,1) 5%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%); 
            z-index: 2; 
        }

        /* === BRANDING & CLOCK === */
        .brand-logo { position: absolute; top: 30px; left: 50px; z-index: 200; }
        .brand-logo img { height: 70px; width: auto; }
        
        #digital-clock { 
            position: absolute; top: 35px; right: 50px; z-index: 200; 
            font-size: 15px; font-weight: 900; color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        /* === CAROUSEL WRAPPER 3D === */
        .thumbnail-container {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 220px;
            z-index: 100;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .thumbnail { 
            position: relative; 
            display: flex; 
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
        }
        
        .item { 
            position: absolute;
            width: 260px; 
            height: 145px; 
            cursor: pointer;
            border: 3px solid rgba(255, 255, 255, 0.4); 
            border-radius: 12px; 
            background: #111;
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s, box-shadow 0.4s, opacity 0.4s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            -webkit-tap-highlight-color: transparent;
        }

        .item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border-radius: 9px; 
        }

        .label {
            position: absolute;
            bottom: -35px;
            width: 100%;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            text-shadow: 2px 2px 5px #000;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        /* POSISI 1: KIRI */
        .item.pos-left {
            transform: translateX(-220px) translateZ(-50px) rotateY(30deg) scale(0.85);
            z-index: 10;
            opacity: 0.7;
        }

        /* POSISI 2: TENGAH (AKTIF) */
        .item.pos-center {
            transform: translateX(0px) translateZ(50px) rotateY(0deg) scale(1.05);
            z-index: 100;
            opacity: 1;
            border-color: #ffffff !important;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 15px 30px rgba(0,0,0,0.9);
        }

        .item.pos-center .label {
            opacity: 1;
            color: #ffffff;
        }

        /* POSISI 3: KANAN */
        .item.pos-right {
            transform: translateX(220px) translateZ(-50px) rotateY(-30deg) scale(0.85);
            z-index: 10;
            opacity: 0.7;
        }

        .item:focus {
            outline: none;
        }

        .thumbnail a {
            text-decoration: none;
            color: inherit;
        }

        .thumbnail a:visited,
        .thumbnail a:link,
        .thumbnail a:active {
            color: #fff;
        }

        /* TAMPILAN RESPOSIF UNTUK HP (Layar Kecil) */
        @media (max-width: 600px) {
            .brand-logo { top: 15px; left: 20px; }
            .brand-logo img { height: 45px; }
            #digital-clock { top: 20px; right: 20px; font-size: 13px; }
            
            .item { width: 180px; height: 100px; }
            .item.pos-left { transform: translateX(-120px) translateZ(-30px) rotateY(25deg) scale(0.8); }
            .item.pos-right { transform: translateX(120px) translateZ(-30px) rotateY(-25deg) scale(0.8); }
            .label { font-size: 12px; bottom: -28px; }
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <img id="main-bg" src="https://iptv-posterku.pages.dev/poster/film_dubbing/ChatGPTImage23Jun2026,19.45.53_copy_800x308.png" width="800" height="308" fetchpriority="high">
    </div>
    <div class="overlay"></div>

    <div class="brand-logo">
        <img src="https://iptv-posterku.pages.dev/poster/film_indonesia/Logo%20_mrzybtv_%20dengan%20ikon%20Wi-Fi.png" width="150" height="70">
    </div>
    <div id="digital-clock">00:00:00</div>

    <div class="thumbnail-container" id="touch-area">
        <div class="thumbnail">
            <a href="https://mrzybtv-api.ukielaki88.workers.dev/app/seri_dubbing" class="item" data-id="p1" 
               data-bg="https://iptv-posterku.pages.dev/poster/film_dubbing/Dubbing2.webp" tabindex="0">
                <img src="https://iptv-posterku.pages.dev/poster/film_dubbing/Dubbing2.webp" width="240" height="135"> 
                <div class="label">Series Dubbing</div>
            </a>    

            <a href="https://mrzybtv-api.ukielaki88.workers.dev/app/seri_indo" class="item" data-id="p2" 
               data-bg="https://iptv-posterku.pages.dev/poster/film_dubbing/Indo2.webp" tabindex="0">
                <img src="https://iptv-posterku.pages.dev/poster/film_dubbing/Indo2.webp" width="240" height="135"> 
                <div class="label">Series Indo</div>
            </a>    

            <a href="https://mrzybtv-api.ukielaki88.workers.dev/app/seri_animasi" class="item" data-id="p3" 
               data-bg="https://iptv-posterku.pages.dev/poster/film_dubbing/Anime2.webp" tabindex="0">
                <img src="https://iptv-posterku.pages.dev/poster/film_dubbing/Anime2.webp" width="240" height="135">
                <div class="label">Series Animasi</div>
            </a>    
        </div>
    </div>

    <script>
        const bgImage = document.getElementById('main-bg');
        const soundClick = new Audio();
        soundClick.preload = "none";
        soundClick.src = "https://github.com/ukie432/mrzybfilm/raw/refs/heads/main/click.wav";

        const items = Array.from(document.querySelectorAll('.item'));
        const classes = ['pos-left', 'pos-center', 'pos-right'];

        // Mengatur posisi dan fokus
        function updatePositions() {
            items.forEach((item, index) => {
                item.className = 'item ' + classes[index];
            });

            // Fokuskan selalu pada poster TENGAH (Sangat penting untuk Remote TV STB)
            const centerItem = document.querySelector('.item.pos-center');
            if (centerItem) {
                centerItem.focus();
                const newBgUrl = centerItem.dataset.bg;
                if (newBgUrl && bgImage.src !== newBgUrl) {
                    bgImage.src = newBgUrl;
                }
                localStorage.setItem('lastFocusId', centerItem.dataset.id);
            }
        }

        // Putar Kanan (Poster Kiri masuk ke Tengah)
        function rotateRight() {
            classes.unshift(classes.pop());
            updatePositions();
            playSound();
        }

        // Putar Kiri (Poster Kanan masuk ke Tengah)
        function rotateLeft() {
            classes.push(classes.shift());
            updatePositions();
            playSound();
        }

        function playSound() {
            soundClick.currentTime = 0;
            soundClick.play().catch(() => {});
        }

        // === 1. FITUR REMOTE STB (Keyboard / D-Pad Remote) ===
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") {
                e.preventDefault();
                rotateLeft(); // Tombol Kanan memasukkan poster kanan ke tengah
            } else if (e.key === "ArrowLeft") {
                e.preventDefault();
                rotateRight(); // Tombol Kiri memasukkan poster kiri ke tengah
            }
        });

        // === 2. FITUR SENTUHAN HP (Touch Swipe) ===
        let touchStartX = 0;
        let touchEndX = 0;
        const touchArea = document.getElementById('touch-area');

        touchArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        touchArea.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeDistance = touchEndX - touchStartX;
            if (swipeDistance < -40) {
                // Swipe ke Kiri
                rotateLeft();
            } else if (swipeDistance > 40) {
                // Swipe ke Kanan
                rotateRight();
            }
        }

        // === 3. FITUR KLIK MOUSE / SENTUH POSTER SAMPING ===
        items.forEach(item => {
            item.addEventListener('click', (e) => {
                if (item.classList.contains('pos-left')) {
                    e.preventDefault();
                    rotateRight();
                } else if (item.classList.contains('pos-right')) {
                    e.preventDefault();
                    rotateLeft();
                }
                // Jika pos-center yang diklik, link href bawaan akan langsung terbuka (buka film)
            });
        });

        // Inisialisasi posisi awal
        window.addEventListener('load', () => {
            updatePositions();
        });

        // Jam Digital
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const clock = document.getElementById("digital-clock");
            if (clock) clock.textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
