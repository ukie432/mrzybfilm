<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="preconnect" href="https://posterfilm.pages.dev">
    <link rel="preconnect" href="https://iptv-posterku.pages.dev">
    <meta charset="UTF-8">
    <title>MRZYBtv Youtube</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/2.0.13/plyr.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #050505; color: #fff; height: 100vh; overflow: hidden; display: flex; padding: 8px; gap: 8px; }
        
        /* LAYOUT UTAMA: SPLIT SCREEN DUA SISI */
        .main-layout { display: flex; width: 100%; height: 100%; gap: 8px; }
        
        /* AREA KIRI: PLAYER & DISPLAY */
        .player-side { flex: 1.8; display: flex; flex-direction: column; gap: 6px; position: relative; background: #050505; }
        .header-title { color: #00ffff; font-weight: bold; font-size: 13px; text-shadow: 0 0 5px #00ffff; display: flex; align-items: center; gap: 6px; }
        
        /* FRAME BINGKAI NEON PLAYER (PEMUTAR INLINE) */
        .video-wrapper { position: relative; width: 100%; flex: 1; border: 2px solid #00ffff; border-radius: 8px; box-shadow: 0 0 12px rgba(0, 255, 255, 0.4); overflow: hidden; background: #000; }
        
        /* PENYESUAIAN PLYR AGAR PAS DI DALAM KOTAK KIRI */
        .video-wrapper .plyr { width: 100% !important; height: 100% !important; background: #000 !important; }
        .video-wrapper .plyr__video-wrapper, .video-wrapper .plyr__video-embed { width: 100% !important; height: 100% !important; padding-bottom: 0 !important; }
        .video-wrapper iframe { width: 100% !important; height: 100% !important; border: none; }

        /* AREA KANAN: NAVBAR & GRID POSTER */
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 6px; background: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 6px; }
        .navbar { padding: 0; background: transparent; }
        .search-container { position: relative; width: 100%; }
        .search-bar-wrapper { width: 100%; background: #1a1a1a; border-radius: 4px; border: 1px solid #333; display: flex; align-items: center; }
        .search-bar-wrapper:focus-within, .search-bar-wrapper:focus { border-color: #00ffff; outline: none; box-shadow: 0 0 8px #00ffff; }
        #search { width: 100%; padding: 8px 30px 8px 10px; border: none; outline: none; background: transparent; font-size: 12px; color: #fff; }
        .clear-search { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: #444; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 12; }
        .clear-search:focus { background: red; outline: none; }

        /* GRID POSTER DAFTAR HORIZONTAL/VERTIKAL */
        .grid { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; flex: 1; padding: 2px; }
        .poster { cursor: pointer; border: 1px solid #222; border-radius: 4px; overflow: hidden; background: #141414; display: flex; align-items: center; padding: 4px; gap: 8px; height: auto; }
        .poster:focus { outline: 2px solid #00ffff !important; background: #003333 !important; box-shadow: 0 0 10px #00ffff !important; }
        .poster img { width: 55px; height: 35px; aspect-ratio: auto; object-fit: cover; border-radius: 3px; }
        .poster-title { padding: 0; font-size: 11px; text-align: left; font-weight: bold; color: #fff; flex: 1; }
        .poster:focus .poster-title { color: #00ffff; }
        
        /* POPUP KATEGORI NEON */
        #popup { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; }
        .popup-content { background:#111; padding:20px; border-radius:8px; width:80%; max-width:450px; border:2px solid #00ffff; position: relative; box-shadow: 0 0 15px #00ffff; }
        .close-x { position: absolute; top: -12px; right: -12px; width: 35px; height: 35px; background: red; color: white; border-radius: 50%; border: 2px solid white; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 101; }
        .close-x:focus { outline: 2px solid #00ffff; transform: scale(1.1); }
        #eps-list { max-height: 250px; overflow-y: auto; margin-top: 12px; padding-right: 5px; }
        .eps-btn { display:block; width:100%; padding:8px 12px; margin:4px 0; background:#222; border:1px solid #333; border-radius:4px; color:white; text-align: left; font-size: 12px; font-weight: bold; cursor: pointer; }
        .eps-btn:focus { background:#00ffff; color:#000; outline: none; box-shadow: 0 0 8px #00ffff; }

        /* KONTROL PLAYER DI BAWAH BINGKAI KIRI */
        .custom-controls { display: flex; flex-direction: column; gap: 4px; background: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 6px; }
        .progress-container { display: flex; align-items: center; justify-content: center; width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 4px 10px; border-radius: 4px; }
        #seek-bar { flex: 1; margin: 0 10px; cursor: pointer; accent-color: #00ffff; height: 4px; }
        #seek-bar:focus { outline: 2px solid #00ffff; transform: scaleY(1.3); }
        #current-time, #total-time { font-size: 11px; font-weight: bold; font-family: monospace; color: #00ffff; }
        
        .buttons-container { display: flex; justify-content: center; gap: 6px; }
        .btn-ctrl { background: #111; color: #00ffff; border: 1px solid #00ffff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-ctrl:focus { background: #00ffff; color: #000; outline: 2px solid #fff; box-shadow: 0 0 10px #00ffff; }

        /* PENYESUAIAN TAMPILAN SAAT WADAH KIRI MENJADI FULLSCREEN */
        .player-side:fullscreen { padding: 12px; background: #000; }
        .player-side:-webkit-full-screen { padding: 12px; background: #000; }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- WADAH KIRI: PLAYER + KONTROL -->
        <div class="player-side" id="leftPanelContainer">
            <div class="header-title">
                📺 MRZYBtv STB PLAYER
            </div>
            
            <div class="video-wrapper">
                <div id="player-container" class="js-player" data-type="youtube" data-video-id=""></div>
            </div>

            <div class="custom-controls" id="controls">
                <div class="progress-container">
                    <span id="current-time">00:00</span>
                    <input type="range" id="seek-bar" min="0" max="100" value="0" step="1" tabindex="0">
                    <span id="total-time">00:00</span>
                </div>

                <div class="buttons-container">
                    <button class="btn-ctrl" onclick="putarKontenSampingnya(-1)">⏮</button>
                    <button class="btn-ctrl" id="btnPlayPause" onclick="togglePlay()">||</button>
                    <button class="btn-ctrl" onclick="putarKontenSampingnya(1)">⏭</button>
                    <button class="btn-ctrl" id="btnCC" onclick="toggleSubtitle()">CC</button>
                    <button class="btn-ctrl" id="btnFullscreen" onclick="toggleFullscreen()">⛶</button>
                </div>
            </div>
        </div>

        <!-- TAMPILAN KANAN (DAFTAR SONG & PENCARIAN) -->
        <div class="sidebar">
            <div class="navbar">
                <div class="search-container">
                    <div class="search-bar-wrapper">
                        <!-- Input diberi tabindex="0" langsung agar fokus memicu keyboard -->
                        <input type="text" id="search" placeholder="Cari Lagu (Tekan OK)..." tabindex="0">
                    </div>
                    <button id="clear-btn" class="clear-search" tabindex="-1">X</button>
                </div>
            </div>

            <div class="grid" id="grid"></div>
        </div>
    </div>

    <!-- POPUP EPISODE / KATEGORI -->
    <div id="popup">
        <div class="popup-content" onclick="event.stopPropagation()">
            <button class="close-x" onclick="closePopup()" tabindex="0">X</button>
            <h3 id="modal-title" style="margin-top:0; padding-right: 30px; color: #00ffff;"></h3>
            <div id="eps-list"></div>
        </div>
    </div>

<script src="https://cdn.plyr.io/2.0.13/plyr.js"></script>
<script>
    const pageTitle = document.title.replace(/\s+/g, '_').toLowerCase(); 
    const jsonUrl = "https://mrzybtv-api.ukielaki88.workers.dev/api/youtube"; 
    var currentEpisodes = [];
    var subtitleAktif = false;

    // Inisialisasi Player Utama
    var player = plyr.setup(".js-player", { 
        controls: [],
        youtube: {
            cc_load_policy: 0,
            cc_lang_pref: '',
            hl: 'id',
            iv_load_policy: 3,
            rel: 0,
            modestbranding: 1,
            playsinline: 1,
            controls: 0,
            disablekb: 1
        }
    })[0];
    
    let currentVideoUrl = "";

    player.on('ended', function () {
        putarKontenSampingnya(1);
    });
    
    window.tutupPopUpPoster = function(){
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            return;
        }
        if ($("#popup").is(":visible") && $("#popup").css("display") !== "none") {
            window.closePopup();
            return;
        }
    };

    // Deteksi Tombol Back Remote Fisik (4, 27, 10009)
    window.addEventListener('keydown', function(event) {
        if (event.keyCode === 4 || event.keyCode === 27 || event.keyCode === 10009) {
            if (document.fullscreenElement || document.webkitFullscreenElement || $("#popup").is(":visible")) {
                event.preventDefault();
                window.tutupPopUpPoster(); 
                return;
            }
        }
    }, true);

    // TOGGLE FULLSCREEN
    function toggleFullscreen() {
        const elem = document.getElementById("leftPanelContainer");
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;

        if (!isFS) {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    // LOGIKA PERBAIKAN PENCARIAN & POPUP KEYBOARD VIRTUAL
    $("#search").on('focus click', function() {
        // Panggil pemicu bawaan Android/STB saat elemen fokus
        if (typeof Android !== "undefined" && Android.showKeyboard) {
            Android.showKeyboard();
        }
    });

    $("#search").on('keydown', function(e) {
        // Jika menekan OK / Enter (13)
        if (e.keyCode === 13) {
            if (typeof Android !== "undefined" && Android.showKeyboard) {
                Android.showKeyboard();
            }
        } 
        // Jika menekan Panah Bawah (40), pindah fokus ke poster pertama
        else if (e.keyCode === 40) {
            e.preventDefault();
            $(".poster").first().focus();
        }
    });

    $("#clear-btn").on('click', function() {
        $("#search").val("");
        $(".poster").show();
        $(this).css("display", "none").attr("tabindex", "-1");
        $("#search").focus();
    });

    $("#search").on("input", function() {
        const keyword = $(this).val().toLowerCase();
        if (keyword.length > 0) {
            $("#clear-btn").css("display", "flex");
        } else {
            $("#clear-btn").css("display", "none").attr("tabindex", "-1");
        }
        $(".poster").each(function() {
            $(this).toggle($(this).data("title").toLowerCase().includes(keyword));
        });
    });

    // LOAD DATA JSON
    fetch(jsonUrl, { cache: "force-cache" })
        .then(response => response.json())
        .then(data => {
            data.forEach(item => {
                const epEncoded = encodeURIComponent(JSON.stringify(item.categories || []));
                $("#grid").append(`<div class="poster" tabindex="0" data-title="${item.title}" onclick='openModal("${item.title}", "${epEncoded}")'><img src="${item.poster}"><div class="poster-title">${item.title}</div></div>`);
            });
            setTimeout(() => {
                const popupElement = document.getElementById("popup");
                if (popupElement && window.getComputedStyle(popupElement).display !== "none") {
                    $(".poster").first().focus();
                }
            }, 600);
            checkLastSession();
        });

    function openModal(title, epsEncoded) {
        localStorage.setItem(pageTitle + "_status_popup", "open");
        localStorage.setItem(pageTitle + "_last_poster_title", title); 
        localStorage.setItem(pageTitle + "_judul_film", title);
        localStorage.setItem(pageTitle + "_eps_data", epsEncoded);

        if (typeof Android !== "undefined" && Android.setPopUpStatus) {
            Android.setPopUpStatus(true);
        }

        currentEpisodes = JSON.parse(decodeURIComponent(epsEncoded));
        $("#modal-title").text(title);
        $("#eps-list").empty();
        
        currentEpisodes.forEach((e, index) => {
            $("#eps-list").append(`<button class="eps-btn" tabindex="0" data-index="${index}" onclick="playFullscreen('${e.url}', ${index}, '${title.replace(/'/g, "\\'")}')">${e.ep}</button>`);
        });
        
        $("#popup").css({ "display": "flex", "z-index": "100", "pointer-events": "auto" });
        
        const lastIdx = localStorage.getItem(pageTitle + "_last_eps_" + title) || 0;
        setTimeout(() => { $(`.eps-btn[data-index="${lastIdx}"]`).focus(); }, 150);
    }

    // PEMUTARAN VIDEO
    function playFullscreen(url, index, title) {
        localStorage.setItem(pageTitle + "_last_eps_" + title, index);
        localStorage.setItem(pageTitle + "_index_sekarang", index);

        $("#popup").css({ "display": "none", "pointer-events": "none" }); 
        
        $("#seek-bar").val(0);
        $("#current-time").text("00:00");
        $("#total-time").text("00:00");

        if (currentVideoUrl !== url) {
            currentVideoUrl = url;
            player.pause();
            player.source({
                type: "video",
                sources: [{ src: url, type: "youtube" }],
                youtube: {
                    cc_load_policy: 0,
                    hl: 'id',
                    iv_load_policy: 3,
                    playsinline: 1,
                    rel: 0,
                    modestbranding: 1,
                    controls: 0,
                    disablekb: 1,
                    enablejsapi: 1,
                    origin: window.location.origin
                }
            });
        }
        
        setTimeout(() => {
            try {
                player.play();
                player.muted = false;
                player.setVolume(100);
            } catch(e) {
                console.log("Autoplay ditahan browser");
            }
            
            $("#btnPlayPause").focus(); 

            subtitleAktif = false;
            $("#btnCC").css("border", "1px solid #00ffff");
        }, 800); 
    }

    window.closePopup = function() { 
        player.pause();
        $("#popup").css("display", "none");
        
        const lastTitle = localStorage.getItem(pageTitle + "_last_poster_title");

        localStorage.removeItem(pageTitle + "_status_popup");
        localStorage.removeItem(pageTitle + "_judul_film");
        localStorage.removeItem(pageTitle + "_eps_data");
        localStorage.removeItem(pageTitle + "_index_sekarang");

        if (lastTitle) {
            setTimeout(() => {
                const targetPoster = $(`.poster[data-title="${lastTitle}"]`);
                if (targetPoster.length) {
                    targetPoster.focus();
                    targetPoster[0].scrollIntoView({ behavior: "auto", block: "center" });
                }
            }, 150);
        }

        if (typeof Android !== "undefined" && Android.setPopUpStatus) {
            Android.setPopUpStatus(false);
        }
    };

    function putarKontenSampingnya(arah) {
        let curIdx = parseInt(localStorage.getItem(pageTitle + "_index_sekarang") || 0);
        let nextIdx = curIdx + arah;

        if (nextIdx >= 0 && nextIdx < currentEpisodes.length) {
            const title = localStorage.getItem(pageTitle + "_judul_film");
            const nextVideo = currentEpisodes[nextIdx];
            player.pause();
            playFullscreen(nextVideo.url, nextIdx, title);
        }
    }

    function togglePlay() { player.togglePlay(); }
    
    function toggleSubtitle() {
        subtitleAktif = !subtitleAktif;
        const iframe = document.querySelector('.video-wrapper iframe');
        const funcCommand = subtitleAktif ? 'loadCaps' : 'unloadCaps';
        if (player && typeof player.toggleCaptions === "function") {
            player.toggleCaptions(subtitleAktif);
        }
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: funcCommand }), '*');
        }
        $("#btnCC").css("border", subtitleAktif ? "2px solid #00ffff" : "1px solid #00ffff");
    }

    function checkLastSession() {
        if (localStorage.getItem(pageTitle + "_status_popup") === "open") {
            const title = localStorage.getItem(pageTitle + "_judul_film");
            const eps = localStorage.getItem(pageTitle + "_eps_data");
            if(title && eps) openModal(title, eps);
        }
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        let mins = Math.floor(seconds / 60);
        let secs = Math.floor(seconds % 60);
        if (mins < 10) mins = "0" + mins;
        if (secs < 10) secs = "0" + secs;
        return mins + ":" + secs;
    }

    player.on('timeupdate', () => {
        if (!player.duration) return;
        const currentTime = player.getCurrentTime();
        const duration = player.getDuration();
        
        $("#current-time").text(formatTime(currentTime));
        $("#total-time").text(formatTime(duration));
        
        if (!$("#seek-bar").is(":focus")) {
            let value = (currentTime / duration) * 100;
            $("#seek-bar").val(value);
        }
    });

    $("#seek-bar").on('input change', function() {
        if (player.getDuration()) {
            let seekTo = player.getDuration() * ($(this).val() / 100);
            player.seek(seekTo);
        }
    });

    $("#seek-bar").on('keydown', function(e) {
        let duration = player.getDuration();
        if (!duration) return;

        let currentTime = player.getCurrentTime();
        let lompatDetik = 15;

        if (e.keyCode == 37) { 
            e.preventDefault();
            let targetMundur = Math.max(0, currentTime - lompatDetik);
            player.seek(targetMundur);
            $(this).val((targetMundur / duration) * 100);
        } 
        else if (e.keyCode == 39) { 
            e.preventDefault();
            let targetMaju = Math.min(duration, currentTime + lompatDetik);
            player.seek(targetMaju);
            $(this).val((targetMaju / duration) * 100);
        }
        else if (e.keyCode == 40) { 
            e.preventDefault();
            $("#btnPlayPause").focus();
        }
    });

    $("#btnPlayPause").on('keydown', function(e) {
        if (e.keyCode == 38) { 
            e.preventDefault();
            $("#seek-bar").focus();
        }
    });
</script>

<script>
    const soundClick = new Audio('https://github.com/ukie432/mrzybfilm/raw/refs/heads/main/click.wav');
    function playSound() { soundClick.currentTime = 0; soundClick.play().catch(e => console.log("Menunggu remote...")); }
    document.addEventListener('focus', function(e) {
        if ($(e.target).hasClass('poster') || $(e.target).hasClass('eps-btn') || $(e.target).hasClass('close-x') || $(e.target).hasClass('btn-ctrl') || e.target.id === 'clear-btn' || e.target.id === 'search' || e.target.id === 'seek-bar') {
            playSound();
        }
    }, true);
</script>
</body>
</html>
