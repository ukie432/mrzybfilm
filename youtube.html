<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="preconnect" href="https://posterfilm.pages.dev">
    <link rel="preconnect" href="https://iptv-posterku.pages.dev">
    <meta charset="UTF-8">
    <title>MRZYBtv Youtube</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/2.0.13/plyr.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #050505; color: #fff; height: 100vh; overflow: hidden; display: flex; padding: 8px; gap: 8px; }
        
        .main-layout { display: flex; width: 100%; height: 100%; gap: 8px; }
        
        /* CONTAINER PLAYER UTAMA */
        .player-side { flex: 1.8; display: flex; flex-direction: column; gap: 6px; position: relative; background: #050505; }
        
        /* HEADER LOGO GAMBAR (MENGGANTIKAN TEKS & EMOJI TV) */
        .header-title { 
            font-size: 0; /* Sembunyikan teks asli tanpa ubah HTML */
            display: flex; 
            align-items: center; 
            height: 35px;
        }
        .header-title::before {
            content: "";
            display: block;
            width: 130px;
            height: 30px;
            background-image: url('https://posterfilm.pages.dev/poster/film_lawas/logoputihmrzyb.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: left center;
        }
        
        .video-wrapper { position: relative; width: 100%; flex: 1; border: 2px solid #ffffff; border-radius: 8px; box-shadow: 0 0 12px rgba(255, 255, 255, 0.4); overflow: hidden; background: #000; pointer-events: none; }
        .video-wrapper .plyr { width: 100% !important; height: 100% !important; background: #000 !important; pointer-events: none !important; }
        .video-wrapper .plyr__video-wrapper, .video-wrapper .plyr__video-embed { width: 100% !important; height: 100% !important; padding-bottom: 0 !important; pointer-events: none !important; }
        .video-wrapper iframe { width: 100% !important; height: 100% !important; border: none; pointer-events: none !important; }

        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 6px; background: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 6px; }
        .navbar { padding: 0; background: transparent; }
        .search-container { position: relative; width: 100%; }
        .search-bar-wrapper { width: 100%; background: #1a1a1a; border-radius: 4px; border: 1px solid #333; display: flex; align-items: center; }
        
        #search { width: 100%; padding: 8px 30px 8px 10px; border: none; outline: none; background: transparent; font-size: 12px; color: #fff; }
        #search:focus { outline: 2px solid #ffffff; border-radius: 4px; background: #1a1a1a; }
        
        .clear-search { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: #444; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 12; }
        .clear-search:focus { background: red; outline: 2px solid #ffffff; color: #fff; transform: translateY(-50%) scale(1.1); }

        .grid { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; flex: 1; padding: 2px; }
        .poster { cursor: pointer; border: 1px solid #222; border-radius: 4px; overflow: hidden; background: #141414; display: flex; align-items: center; padding: 4px; gap: 8px; height: auto; }
        .poster:focus { outline: 2px solid #ffffff !important; background: #222222 !important; box-shadow: 0 0 10px #ffffff !important; }
        .poster img { width: 55px; height: 35px; aspect-ratio: auto; object-fit: cover; border-radius: 3px; }
        .poster-title { padding: 0; font-size: 11px; text-align: left; font-weight: bold; color: #fff; flex: 1; }
        .poster:focus .poster-title { color: #ffffff; }
        
        #popup { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; }
        .popup-content { background:#111; padding:20px; border-radius:8px; width:80%; max-width:450px; border:2px solid #ffffff; position: relative; box-shadow: 0 0 15px #ffffff; }
        .close-x { position: absolute; top: -12px; right: -12px; width: 35px; height: 35px; background: red; color: white; border-radius: 50%; border: 2px solid white; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 101; }
        .close-x:focus { outline: 2px solid #ffffff; transform: scale(1.1); }
        #eps-list { max-height: 250px; overflow-y: auto; margin-top: 12px; padding-right: 5px; }
        .eps-btn { display:block; width:100%; padding:8px 12px; margin:4px 0; background:#222; border:1px solid #333; border-radius:4px; color:white; text-align: left; font-size: 12px; font-weight: bold; cursor: pointer; }
        .eps-btn:focus { background:#ffffff; color:#000; outline: none; box-shadow: 0 0 8px #ffffff; }

        /* KONTROL PLAYER */
        .custom-controls { display: flex; flex-direction: column; gap: 4px; background: rgba(13, 13, 13, 0.85); border: 1px solid #222; border-radius: 8px; padding: 6px; transition: opacity 0.4s ease, visibility 0.4s ease; opacity: 1; visibility: visible; }
        .progress-container { display: flex; align-items: center; justify-content: center; width: 100%; background: rgba(26, 26, 26, 0.8); border: 1px solid #333; padding: 4px 10px; border-radius: 4px; }
        #seek-bar { flex: 1; margin: 0 10px; cursor: pointer; accent-color: #ffffff; height: 4px; }
        #seek-bar:focus { outline: 2px solid #ffffff; transform: scaleY(1.3); }
        #current-time, #total-time { font-size: 11px; font-weight: bold; font-family: monospace; color: #ffffff; }
        
        .buttons-container { display: flex; justify-content: center; gap: 6px; }
        .btn-ctrl { background: #111; color: #ffffff; border: 1px solid #ffffff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-ctrl:focus { background: #ffffff; color: #000; outline: 2px solid #fff; box-shadow: 0 0 10px #ffffff; }

        /* --- ATURAN FULLSCREEN --- */
        .player-side:fullscreen, .player-side:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
            background: #000 !important;
        }

        .player-side:fullscreen .header-title,
        .player-side:-webkit-full-screen .header-title {
            display: none !important;
        }

        .player-side:fullscreen .video-wrapper,
        .player-side:-webkit-full-screen .video-wrapper {
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        .player-side:fullscreen iframe,
        .player-side:-webkit-full-screen iframe {
            width: 100vw !important;
            height: 100vh !important;
            transform: scale(1.02);
            object-fit: cover !important;
        }

        .player-side:fullscreen .custom-controls,
        .player-side:-webkit-full-screen .custom-controls {
            position: absolute !important;
            bottom: 20px !important;
            left: 5% !important;
            right: 5% !important;
            z-index: 9999 !important;
            background: rgba(0, 0, 0, 0.75) !important;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
        }

        /* KELAS UNTUK HIDE CONTROLS OTOMATIS */
        .custom-controls.controls-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        
        .custom-controls.controls-hidden * {
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="player-side" id="leftPanelContainer">
            <div class="header-title">
                📺 MRZYBtv STB PLAYER
            </div>
            
            <div class="video-wrapper" tabindex="-1">
                <div id="player-container" class="js-player" data-type="youtube" data-video-id="szVLxiWZroI" tabindex="-1"></div>
            </div>

            <div class="custom-controls" id="controls">
                <div class="progress-container">
                    <span id="current-time">00:00</span>
                    <input type="range" id="seek-bar" min="0" max="100" value="0" step="1" tabindex="0">
                    <span id="total-time">00:00</span>
                </div>

                <div class="buttons-container">
                    <button class="btn-ctrl" id="btnPrev" tabindex="0" onclick="putarKontenSampingnya(-1)">⏮</button>
                    <button class="btn-ctrl" id="btnPlayPause" tabindex="0" onclick="togglePlay()">||</button>
                    <button class="btn-ctrl" id="btnNext" tabindex="0" onclick="putarKontenSampingnya(1)">⏭</button>
                    <button class="btn-ctrl" id="btnCC" tabindex="0" onclick="toggleSubtitle()">CC</button>
                    <button class="btn-ctrl" id="btnFullscreen" tabindex="0" onclick="toggleFullscreen()">⛶</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="navbar">
                <div class="search-container">
                    <div class="search-bar-wrapper">
                        <input type="text" id="search" placeholder="Cari Lagu (Tekan OK)..." tabindex="0" readonly>
                    </div>
                    <button id="clear-btn" class="clear-search" tabindex="0">X</button>
                </div>
            </div>

            <div class="grid" id="grid"></div>
        </div>
    </div>

    <div id="popup">
        <div class="popup-content" onclick="event.stopPropagation()">
            <button class="close-x" onclick="closePopup()" tabindex="0">X</button>
            <h3 id="modal-title" style="margin-top:0; padding-right: 30px; color: #ffffff;"></h3>
            <div id="eps-list"></div>
        </div>
    </div>

<script src="https://cdn.plyr.io/2.0.13/plyr.js"></script>
<script>
    const pageTitle = document.title.replace(/\s+/g, '_').toLowerCase(); 
    const jsonUrl = "https://mrzybtv-api.ukielaki88.workers.dev/api/youtube"; 
    var currentEpisodes = [];
    var subtitleAktif = false;
    
    var lastActivePoster = null;
    var controlsTimeout = null;

    function resetControlsTimer() {
        showControls();
        clearTimeout(controlsTimeout);
        controlsTimeout = setTimeout(function() {
            hideControls();
        }, 5000);
    }

    function showControls() {
        $("#controls").removeClass("controls-hidden");
    }

    function hideControls() {
        var activeEl = document.activeElement;
        if (activeEl && ($(activeEl).hasClass("btn-ctrl") || activeEl.id === "seek-bar")) {
            activeEl.blur();
        }
        $("#controls").addClass("controls-hidden");
    }

    window.addEventListener("keydown", function() { resetControlsTimer(); }, true);
    window.addEventListener("mousemove", function() { resetControlsTimer(); });
    window.addEventListener("touchstart", function() { resetControlsTimer(); });

    var player = plyr.setup(".js-player", { 
        controls: [],
        autoplay: true,
        youtube: {
            autoplay: 1,
            mute: 0,
            cc_load_policy: 0,
            cc_lang_pref: '',
            hl: 'id',
            iv_load_policy: 3,
            rel: 0,
            modestbranding: 1,
            playsinline: 1,
            controls: 0,
            disablekb: 1
        }
    })[0];
    
    let currentVideoUrl = "";

    function terapkanStatusSubtitle() {
        const iframe = document.querySelector('.video-wrapper iframe');
        if (iframe && iframe.contentWindow) {
            if (subtitleAktif) {
                iframe.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: 'loadModule',
                    args: ['captions']
                }), '*');
                iframe.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: 'setOption',
                    args: ['captions', 'track', { languageCode: 'id' }]
                }), '*');
            } else {
                iframe.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: 'unloadModule',
                    args: ['captions']
                }), '*');
            }
        }
    }

    player.on('ready', function() {
        $(".video-wrapper, .plyr, iframe").attr("tabindex", "-1");
        player.setVolume(100);
    });

    player.on('play', function() {
        resetControlsTimer();
        setTimeout(terapkanStatusSubtitle, 300);
    });

    player.on('pause', function() {
        showControls();
        clearTimeout(controlsTimeout);
    });

    player.on('ended', function () {
        putarKontenSampingnya(1);
    });
    
    window.tutupPopUpPoster = function(){
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            return;
        }
        if ($("#popup").is(":visible") && $("#popup").css("display") !== "none") {
            window.closePopup();
            return;
        }
    };

    window.addEventListener('keydown', function(event) {
        if (event.keyCode === 4 || event.keyCode === 27 || event.keyCode === 10009) {
            if (document.fullscreenElement || document.webkitFullscreenElement || $("#popup").is(":visible")) {
                event.preventDefault();
                window.tutupPopUpPoster(); 
                return;
            }
        }
    }, true);

    // FIX PERBAIKAN FULLSCREEN & NAVIGATION TRAP
    function toggleFullscreen() {
        const elem = document.getElementById("leftPanelContainer");
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;

        if (!isFS) {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
        resetControlsTimer();
    }

    // LISTENER DETEKSI KELUAR FULLSCREEN: LEPASKAN FOKUS & KEMBALIKAN KE SIDEBAR
    document.addEventListener("fullscreenchange", handleFullscreenExit);
    document.addEventListener("webkitfullscreenchange", handleFullscreenExit);

    function handleFullscreenExit() {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFS) {
            // Ketika keluar dari Fullscreen, alihkan fokus dari tombol Fullscreen ke Sidebar
            setTimeout(() => {
                kembalikeSidebar();
            }, 200);
        }
    }

    $("#search").on('blur', function() {
        $(this).attr('readonly', true);
    });

    function aktifkanKeyboard() {
        const input = $("#search");
        input.removeAttr('readonly');
        if (typeof Android !== "undefined" && Android.showKeyboard) {
            Android.showKeyboard();
        }
    }

    $("#search").on('click', function() {
        aktifkanKeyboard();
    });

    $("#search").on('keydown', function(e) {
        if (e.keyCode === 13) { 
            e.preventDefault();
            aktifkanKeyboard();
        } else if (e.keyCode === 39) { 
            if ($("#clear-btn").is(":visible")) {
                e.preventDefault();
                $(this).attr('readonly', true);
                $("#clear-btn").focus();
            }
        } else if (e.keyCode === 40) { 
            e.preventDefault();
            $(this).attr('readonly', true);
            $(this).blur();
            
            const firstPoster = $(".poster:visible").first();
            if (firstPoster.length > 0) {
                firstPoster.focus();
            }
        } else if (e.keyCode === 37) { 
            e.preventDefault();
            $(this).attr('readonly', true);
            $(this).blur();
            $("#btnFullscreen").focus();
        }
    });

    $("#clear-btn").on('keydown', function(e) {
        if (e.keyCode === 37) { 
            e.preventDefault();
            $("#search").focus();
        } else if (e.keyCode === 40) { 
            e.preventDefault();
            const firstPoster = $(".poster:visible").first();
            if (firstPoster.length > 0) {
                firstPoster.focus();
            }
        } else if (e.keyCode === 13) { 
            e.preventDefault();
            $(this).click();
        }
    });

    $("#clear-btn").on('click', function() {
        $("#search").val("");
        $(".poster").show();
        $(this).css("display", "none");
        $("#search").attr('readonly', true);
        $("#search").focus();
    });

    $("#search").on("input", function() {
        const keyword = $(this).val().toLowerCase();
        if (keyword.length > 0) {
            $("#clear-btn").css("display", "flex");
        } else {
            $("#clear-btn").css("display", "none");
        }
        
        $(".poster").each(function() {
            $(this).toggle($(this).data("title").toLowerCase().includes(keyword));
        });
    });

    function kembalikeSidebar() {
        if (lastActivePoster && $(lastActivePoster).is(":visible")) {
            $(lastActivePoster).focus();
            lastActivePoster.scrollIntoView({ behavior: "auto", block: "center" });
        } else {
            const firstPoster = $(".poster:visible").first();
            if (firstPoster.length > 0) {
                firstPoster.focus();
            } else {
                $("#search").focus();
            }
        }
    }

    $(".btn-ctrl").on('keydown', function(e) {
        if (e.keyCode === 38) { 
            e.preventDefault();
            $("#seek-bar").focus();
        } else if (e.keyCode === 39) { 
            if (this.id === "btnFullscreen") {
                e.preventDefault();
                kembalikeSidebar();
            }
        }
    });

    $("#seek-bar").on('keydown', function(e) {
        let duration = player.getDuration();
        if (!duration) return;

        let currentTime = player.getCurrentTime();
        let lompatDetik = 15;

        if (e.keyCode === 37) { 
            e.preventDefault();
            let targetMundur = Math.max(0, currentTime - lompatDetik);
            player.seek(targetMundur);
            $(this).val((targetMundur / duration) * 100);
            setTimeout(terapkanStatusSubtitle, 300);
        } else if (e.keyCode === 39) { 
            e.preventDefault();
            let targetMaju = Math.min(duration, currentTime + lompatDetik);
            player.seek(targetMaju);
            $(this).val((targetMaju / duration) * 100);
            setTimeout(terapkanStatusSubtitle, 300);
        } else if (e.keyCode === 40) { 
            e.preventDefault();
            $("#btnPlayPause").focus();
        } else if (e.keyCode === 38) { 
            e.preventDefault();
            $("#search").focus();
        }
    });

    $(document).on('focus', '.poster', function() {
        lastActivePoster = this;
    });

    $(document).on('keydown', '.poster', function(e) {
        if (e.keyCode === 37) { 
            e.preventDefault();
            $("#btnPlayPause").focus();
        } else if (e.keyCode === 38) { 
            e.preventDefault();
            const prevPoster = $(this).prevAll('.poster:visible').first();
            if (prevPoster.length > 0) {
                prevPoster.focus();
            } else {
                $("#search").focus();
            }
        } else if (e.keyCode === 40) { 
            e.preventDefault();
            const nextPoster = $(this).nextAll('.poster:visible').first();
            if (nextPoster.length > 0) {
                nextPoster.focus();
            }
        }
    });

    fetch(jsonUrl, { cache: "force-cache" })
        .then(response => response.json())
        .then(data => {
            data.forEach(item => {
                const epEncoded = encodeURIComponent(JSON.stringify(item.categories || []));
                $("#grid").append(`<div class="poster" tabindex="0" data-title="${item.title}" onclick='openModal("${item.title}", "${epEncoded}")'><img src="${item.poster}"><div class="poster-title">${item.title}</div></div>`);
            });
            setTimeout(() => {
                const popupElement = document.getElementById("popup");
                if (popupElement && window.getComputedStyle(popupElement).display !== "none") {
                    $(".poster").first().focus();
                }
            }, 600);
            checkLastSession();
        });

    function openModal(title, epsEncoded) {
        localStorage.setItem(pageTitle + "_status_popup", "open");
        localStorage.setItem(pageTitle + "_last_poster_title", title); 
        localStorage.setItem(pageTitle + "_judul_film", title);
        localStorage.setItem(pageTitle + "_eps_data", epsEncoded);

        if (typeof Android !== "undefined" && Android.setPopUpStatus) {
            Android.setPopUpStatus(true);
        }

        currentEpisodes = JSON.parse(decodeURIComponent(epsEncoded));
        $("#modal-title").text(title);
        $("#eps-list").empty();
        
        currentEpisodes.forEach((e, index) => {
            $("#eps-list").append(`<button class="eps-btn" tabindex="0" data-index="${index}" onclick="playFullscreen('${e.url}', ${index}, '${title.replace(/'/g, "\\'")}')">${e.ep}</button>`);
        });
        
        $("#popup").css({ "display": "flex", "z-index": "100", "pointer-events": "auto" });
        
        const lastIdx = localStorage.getItem(pageTitle + "_last_eps_" + title) || 0;
        setTimeout(() => { $(`.eps-btn[data-index="${lastIdx}"]`).focus(); }, 150);
    }

    function playFullscreen(url, index, title) {
        localStorage.setItem(pageTitle + "_last_eps_" + title, index);
        localStorage.setItem(pageTitle + "_index_sekarang", index);

        $("#popup").css({ "display": "none", "pointer-events": "none" }); 
        
        $("#seek-bar").val(0);
        $("#current-time").text("00:00");
        $("#total-time").text("00:00");

        if (currentVideoUrl !== url) {
            currentVideoUrl = url;
            player.pause();
            
            player.source({
                type: "video",
                sources: [{ src: url, type: "youtube" }],
                youtube: {
                    autoplay: 1,
                    mute: 0,
                    cc_load_policy: 0,
                    hl: 'id',
                    iv_load_policy: 3,
                    playsinline: 1,
                    rel: 0,
                    modestbranding: 1,
                    controls: 0,
                    disablekb: 1,
                    enablejsapi: 1,
                    origin: window.location.origin
                }
            });
        }
        
        setTimeout(() => {
            player.unMute();
            player.setVolume(100);
            
            var playPromise = player.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    player.unMute();
                    player.setVolume(100);
                }).catch(error => {
                    player.play();
                });
            }
            
            $("#btnPlayPause").focus(); 
            setTimeout(terapkanStatusSubtitle, 600);
            resetControlsTimer();
        }, 500); 
    }

    window.closePopup = function() { 
        player.pause();
        $("#popup").css("display", "none");
        
        const lastTitle = localStorage.getItem(pageTitle + "_last_poster_title");

        localStorage.removeItem(pageTitle + "_status_popup");
        localStorage.removeItem(pageTitle + "_judul_film");
        localStorage.removeItem(pageTitle + "_eps_data");
        localStorage.removeItem(pageTitle + "_index_sekarang");

        if (lastTitle) {
            setTimeout(() => {
                const targetPoster = $(`.poster[data-title="${lastTitle}"]`);
                if (targetPoster.length) {
                    targetPoster.focus();
                    targetPoster[0].scrollIntoView({ behavior: "auto", block: "center" });
                }
            }, 150);
        }

        if (typeof Android !== "undefined" && Android.setPopUpStatus) {
            Android.setPopUpStatus(false);
        }
    };

    function putarKontenSampingnya(arah) {
        let curIdx = parseInt(localStorage.getItem(pageTitle + "_index_sekarang") || 0);
        let nextIdx = curIdx + arah;

        if (nextIdx >= 0 && nextIdx < currentEpisodes.length) {
            const title = localStorage.getItem(pageTitle + "_judul_film");
            const nextVideo = currentEpisodes[nextIdx];
            player.pause();
            playFullscreen(nextVideo.url, nextIdx, title);
        }
    }

    function togglePlay() { 
        player.togglePlay(); 
        resetControlsTimer();
    }
    
    function toggleSubtitle() {
        subtitleAktif = !subtitleAktif;
        terapkanStatusSubtitle();
        $("#btnCC").css("border", subtitleAktif ? "2px solid #ffffff" : "1px solid #ffffff");
        resetControlsTimer();
    }

    function checkLastSession() {
        if (localStorage.getItem(pageTitle + "_status_popup") === "open") {
            const title = localStorage.getItem(pageTitle + "_judul_film");
            const eps = localStorage.getItem(pageTitle + "_eps_data");
            if(title && eps) openModal(title, eps);
        }
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        let mins = Math.floor(seconds / 60);
        let secs = Math.floor(seconds % 60);
        if (mins < 10) mins = "0" + mins;
        if (secs < 10) secs = "0" + secs;
        return mins + ":" + secs;
    }

    player.on('timeupdate', () => {
        if (!player.duration) return;
        const currentTime = player.getCurrentTime();
        const duration = player.getDuration();
        
        $("#current-time").text(formatTime(currentTime));
        $("#total-time").text(formatTime(duration));
        
        if (!$("#seek-bar").is(":focus")) {
            let value = (currentTime / duration) * 100;
            $("#seek-bar").val(value);
        }
    });

    $("#seek-bar").on('input change', function() {
        if (player.getDuration()) {
            let seekTo = player.getDuration() * ($(this).val() / 100);
            player.seek(seekTo);
            setTimeout(terapkanStatusSubtitle, 300);
        }
        resetControlsTimer();
    });
</script>

<script>
    const soundClick = new Audio('https://github.com/ukie432/mrzybfilm/raw/refs/heads/main/click.wav');
    function playSound() { soundClick.currentTime = 0; soundClick.play().catch(e => console.log("Menunggu remote...")); }
    document.addEventListener('focus', function(e) {
        if ($(e.target).hasClass('poster') || $(e.target).hasClass('eps-btn') || $(e.target).hasClass('close-x') || $(e.target).hasClass('btn-ctrl') || e.target.id === 'clear-btn' || e.target.id === 'search' || e.target.id === 'seek-bar') {
            playSound();
        }
    }, true);
</script>
</body>
</html>
