<script>
document.addEventListener("DOMContentLoaded", function () {

    const wrapper = document.querySelector(".wrapper");

    document.querySelectorAll(".siderbar_menu li").forEach(li => {
        li.addEventListener("click", function () {
            document.querySelectorAll(".siderbar_menu li").forEach(item => {
                item.classList.remove("active");
            });
            this.classList.add("active");
        });
    });

    document.querySelector(".hamburger").addEventListener("click", () => {
        wrapper.classList.add("active");
    });

    document.querySelector(".close").addEventListener("click", () => {
        wrapper.classList.remove("active");
    });

    document.querySelector(".bg_shadow").addEventListener("click", () => {
        wrapper.classList.remove("active");
    });

});

    <div id="popupBox">
        <img id="popupImg" alt="Movie Poster">
        <div id="popupContent">
            <h2 id="popupTitle">Judul Film</h2>
            <p id="popupText">Sinopsis</p>
            <div id="popupButtons">
                <button class="playBtn" onclick="popupPlay()">▶ Play</button>
                <button class="trailerBtn" onclick="popupTrailer()">🎬 Trailer</button>
                <button class="closeBtn" onclick="popupClose()">✖ Close</button>
            </div>
        </div>
    </div>

<script>
let slideIndex = 0;
const slides = document.getElementsByClassName("mySlides");
const dots = document.getElementsByClassName("dot");

function showSlides() {
    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }
    for (let i = 0; i < dots.length; i++) {
        dots[i].classList.remove("active");
    }
    slideIndex++;
    if (slideIndex > slides.length) {
        slideIndex = 1;
    }
    slides[slideIndex - 1].style.display = "block";
    dots[slideIndex - 1].classList.add("active");
}

showSlides();
setInterval(showSlides, 5000);
</script>

<script>
(function(){
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    
    const posters = document.querySelectorAll(".force-5 a");
    const overlay = document.getElementById("popupOverlay");
    const img = document.getElementById("popupImg");
    const title = document.getElementById("popupTitle");
    const text = document.getElementById("popupText");
    const content = document.getElementById("popupContent");
    const trailerBtn = document.querySelector(".trailerBtn");
    let playLink = "", trailerLink = "", lastFocus = null;

    window.popupPlay = function(){
        if(typeof Android !== "undefined" && Android.playVideo) Android.playVideo(playLink);
        else window.open(playLink, "_blank");
    };
    
    window.popupTrailer = function(){
        if (trailerLink) {
            if(typeof Android !== "undefined" && Android.playVideo) {
                Android.playVideo(trailerLink);
            } else {
                window.open(trailerLink, "_blank");
            }
        } else {
            alert("Trailer tidak tersedia.");
        }
    };

    window.popupClose = function(){
        overlay.classList.remove("show");
        const media = overlay.querySelector('iframe, video');
        if(media) media.remove();
        
        img.style.display = ""; 
        if(trailerBtn) trailerBtn.style.display = "inline-block";
        
        if(lastFocus) { setTimeout(() => lastFocus.focus(), 150); }
        
        if (typeof Android !== "undefined") {
            Android.setPopUpStatus(false);
        }
    };

    window.tutupPopUpPoster = function(){
        window.popupClose();
    };

    window.addEventListener('keydown', function(event) {
        if (event.keyCode === 27 || event.keyCode === 10009) {
            const overlay = document.getElementById("popupOverlay");
            if (overlay && overlay.classList.contains("show")) {
                event.preventDefault();
                window.tutupPopUpPoster();
                return;
            }

            const wrapper = document.querySelector(".wrapper");
            if (wrapper && wrapper.classList.contains("active")) {
                event.preventDefault();
                wrapper.classList.remove("active");
                const hamburger = document.querySelector(".hamburger");
                if (hamburger) hamburger.focus();
                return;
            }
        }
    }, true);

    document.addEventListener("click", function(e){
        const a = e.target.closest('.force-5 a');
        if(!a) return;
        localStorage.setItem("lastHomePoster", Array.from(document.querySelectorAll('.force-5 a')).indexOf(a));

        if(a.dataset.popup === "true") {
            e.preventDefault();
            lastFocus = a;
            img.src = a.querySelector("img").src;
            title.textContent = a.dataset.title;
            text.textContent = a.dataset.sinopsis;
            playLink = a.href;
            trailerLink = a.dataset.trailer;
            overlay.classList.add("show");
            if (typeof Android !== "undefined" && Android.setPopUpStatus) Android.setPopUpStatus(true);
        }
    });

    window.addEventListener("load", function(){
        const lastPosterIndex = localStorage.getItem("lastHomePoster");
        setTimeout(() => {
            if(lastPosterIndex !== null) {
                const all = posters;
                if(all[parseInt(lastPosterIndex)]) {
                    all[parseInt(lastPosterIndex)].focus();
                    localStorage.removeItem("lastHomePoster");
                }
            }
        }, 300);
    });
})();
</script>

<script>
window.addEventListener("load", function(){
    const sidebarOpen = localStorage.getItem("sidebarOpen");
    const lastMenu = localStorage.getItem("lastMenu");

    document.querySelectorAll(".siderbar_menu li").forEach(li=>{
        li.classList.remove("active");
    });

    if (sidebarOpen === "true") {
        document.querySelector(".wrapper").classList.add("active");
        localStorage.removeItem("sidebarOpen");

        if (lastMenu) {
            const activeMenu = document.querySelector('[data-menu="' + lastMenu + '"]');
            if (activeMenu) {
                activeMenu.closest('li').classList.add("active");
                setTimeout(() => {
                    activeMenu.focus();
                }, 300);
                localStorage.removeItem("lastMenu");
                return;
            }
        }
    }

    const firstMenu = document.querySelector(".siderbar_menu a");
    if(firstMenu){
        firstMenu.closest('li').classList.add("active");
        firstMenu.focus();
    }
});
</script>

<script>
document.addEventListener('keydown', function(e) {
    if (e.keyCode === 38) {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.closest('.force-5')) {
            const allPosters = Array.from(document.querySelectorAll('.force-5 a'));
            const currentIndex = allPosters.indexOf(activeEl);
            if (currentIndex >= 0 && currentIndex < 5) {
                const banner = document.querySelector('.slideshow-container'); 
                if (banner) {
                    e.preventDefault();
                    banner.focus();
                }
            }
        }
    }
});
</script>
