<!DOCTYPE html>
<html lang="id">
<head>

<title>Pengumuman</title>
<style>

    background:#111;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}
.box{
    max-width:500px;
    background:#1c1c1c;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(255,255,255,.1);
}
h1{
    color:#ff4444;
    margin-bottom:15px;
}
p{
    font-size:18px;
    line-height:1.6;
}
a{
    display:inline-block;
    margin-top:20px;
    padding:12px 24px;
    background:#229ED9;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}
a:hover{
    background:#1b8cc4;
}
small{
    display:block;
    margin-top:20px;
    color:#aaa;
}
</style>
</head>
<body>

<div class="box">
    <h1>📢 Pengumuman</h1>

    <p>
        Aplikasi <strong>MRZYB TV</strong> telah <strong>berpindah server</strong>.

    </p>

    <p>
        Untuk mendapatkan aplikasi versi terbaru, silakan bergabung ke grup Telegram kami.
    </p>

    <a href="https://t.me/mrzybstream" target="_blank">

</html>
