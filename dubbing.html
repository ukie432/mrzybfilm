<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta content='width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' name='viewport'/>

    <title>MRZYB TV - Koleksi Film dubbing</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
        font-family: 'PT Sans', sans-serif; 
        background-color: #0b0c0f; 
        color: #ffffff; 
        overflow-x: hidden; 
        padding-bottom: 50px; 
        position: relative;
    }

    /* BACKGROUND POSTER TAJAM (TANPA BLUR) */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: var(--bg-poster, none);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: brightness(0.35); 
        opacity: 0;
        transition: opacity 0.4s ease-in-out, background-image 0.3s ease;
        z-index: -1;
        pointer-events: none;
    }

    body.has-bg-focus::before {
        opacity: 1;
    }

    /* HEADER STYLE MOVIEBOX */
    .header-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 40px;
        position: relative;
        z-index: 10;
    }

    .header-logo { 
        height: 40px; 
        width: auto; 
        object-fit: contain; 
        flex-shrink: 0;
    }

    .search-wrapper { 
        display: flex; 
        align-items: center; 
        width: 300px;
        position: relative; 
    }

    .search-box { 
        width: 100%; 
        padding: 10px 40px 10px 15px; 
        font-size: 14px; 
        border: 1px solid #333; 
        border-radius: 20px; 
        background-color: rgba(20, 20, 20, 0.8); 
        color: #fff; 
        outline: none; 
        transition: all 0.3s ease;
    }
    .search-box:focus { border-color: #E50914; background-color: #141414; }
    .btn-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center; width: 24px; height: 24px; }

    /* FEATURED HERO BANNER (STYLE MOVIEBOX TOP SLIDER) */
    .hero-banner-container {
        position: relative;
        margin: 0 40px 30px 40px;
        height: 280px;
        border-radius: 12px;
        overflow: hidden;
        background-color: #181818;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        display: flex;
        align-items: flex-end;
    }

    .hero-bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
    }

    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to top, rgba(11, 12, 15, 1) 0%, rgba(11, 12, 15, 0.4) 50%, rgba(0,0,0,0.1) 100%);
        z-index: 2;
    }

    .hero-content {
        position: relative;
        z-index: 3;
        padding: 25px 30px;
        max-width: 600px;
    }

    .hero-tag {
        background-color: #E50914;
        color: #fff;
        font-size: 11px;
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 8px;
        text-transform: uppercase;
    }

    .hero-title-text {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #fff;
    }

    .hero-desc {
        font-size: 13px;
        color: #ccc;
    }

    /* SECTION TITLE STYLE MOVIEBOX */
    .section-title { 
        font-size: 18px; 
        font-weight: 700; 
        margin: 20px 40px 12px 40px; 
        color: #fff; 
        display: none; 
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    #continueSectionTitle { color: #E50914; }

    /* LAYOUT HORIZONTAL CAROUSEL (BARIS ROW SCRIPT MOVIEBOX) */
    .container-film {
        display: flex !important;
        flex-direction: row !important;
        gap: 16px !important;
        padding: 10px 40px 20px 40px !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
        scroll-behavior: smooth;
    }

    /* SEMBUNYIKAN SCROLLBAR SUPAYA RAPI DI TV */
    .container-film::-webkit-scrollbar { display: none; }
    .container-film { -ms-overflow-style: none; scrollbar-width: none; }

    /* CARD FILM MOVIEBOX LANDSCAPE */
    .card-film {
        min-width: 220px !important;
        width: 220px !important;
        flex-shrink: 0 !important;
        background-color: #16181c;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .poster-wrapper { 
        width: 100%; 
        aspect-ratio: 16 / 9 !important; 
        position: relative; 
        background-color: #2a2a2a; 
        overflow: hidden;
    }

    .poster-wrapper img { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
        position: absolute; 
        top: 0; 
        left: 0; 
    }

    .time-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        background-color: rgba(0, 0, 0, 0.85);
        color: #fff;
        font-size: 9px;
        font-weight: bold;
        padding: 3px 6px;
        border-radius: 4px;
        z-index: 5;
        border: 1px solid rgba(229, 9, 20, 0.6);
    }

    /* PROGRESS BAR GARIS MERAH */
    .progress-container {
        width: 100%;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.25);
        position: absolute;
        bottom: 0;
        left: 0;
        z-index: 6;
    }

    .progress-bar-red {
        height: 100%;
        background-color: #E50914;
        width: 0%;
        box-shadow: 0 0 4px #E50914;
    }

    .btn-fav { 
        width: 100%; 
        padding: 4px 0 !important; 
        background-color: #121316; 
        color: #bbb; 
        border: none; 
        font-size: 9px !important; 
        font-weight: 700; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 4px; 
        border-top: 1px solid #222; 
        outline: none; 
    }

    .film-title { 
        padding: 8px !important; 
        font-size: 11px !important; 
        text-align: center !important; 
        font-weight: 700; 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        background-color: #16181c;
        color: #fff; 
        direction: ltr;
    }

    .btn-fav:focus { background-color: #ffffff; color: #E50914; }
    .btn-fav.active { color: #ffcc00; }
    .btn-fav span { font-size: 10px; }
    #noResultsText { text-align: center; font-size: 18px; color: #aaa; margin-top: 40px; display: none; width: 100%; }

    .play-link:focus {
        outline: 3px solid #ffffff !important;
        outline-offset: 2px;
    }

    /* FOCUS HIGHLIGHT STB/TV (MOVIEBOX ANIMATION) */
    .card-film:focus-within {
        transform: scale(1.08);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.4);
        z-index: 20;
    }
    </style>
</head>
<body>

<!-- HEADER LAYOUT MOVIEBOX -->
<div class="header-container">
    <img src="https://posterfilm.pages.dev/poster/film_lawas/logoputihmrzyb.webp" alt="MRZYB TV Logo" class="header-logo">
    <div class="search-wrapper">
        <input type="text" id="searchBox" class="search-box" placeholder="Cari film dubbing..." tabindex="0" readonly>
        <button id="btnClear" class="btn-clear">&times;</button>
    </div>
</div>

<!-- TOP HERO BANNER SLIDER -->
<div class="hero-banner-container">
    <img id="heroImage" src="https://via.placeholder.com/1280x720?text=MRZYB+TV" class="hero-bg-img" alt="Hero Featured">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <div class="hero-tag">Sorotan Utama</div>
        <div id="heroTitle" class="hero-title-text">MRZYB TV Dubbing</div>
        <div class="hero-desc">Pilih film favorit Anda dari koleksi dubbing Indonesia terlengkap.</div>
    </div>
</div>

<!-- SECTION LANJUTKAN MENONTON -->
<div class="section-title" id="continueSectionTitle">LANJUTKAN MENONTON</div>
<div class="container-film" id="containerContinue"></div>

<!-- SECTION FAVORIT -->
<div class="section-title" id="favSectionTitle">FAVORIT SAYA</div>
<div class="container-film" id="containerFav"></div>

<!-- SECTION UTAMA -->
<div class="section-title" id="utamaSectionTitle" style="display: block;">SEMUA FILM DUBBING</div>
<div class="container-film" id="containerUtama"></div>

<div id="noResultsText">Film tidak ditemukan...</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const searchBox = document.getElementById('searchBox');
    const btnClear = document.getElementById('btnClear');
    const noResultsText = document.getElementById('noResultsText');
    const containerUtama = document.getElementById('containerUtama');
    const containerFav = document.getElementById('containerFav');
    const favSectionTitle = document.getElementById('favSectionTitle');
    
    // VARIABEL UNTUK BANNER LANJUTKAN MENONTON
    const containerContinue = document.getElementById('containerContinue');
    const continueSectionTitle = document.getElementById('continueSectionTitle');

    let listFavorit = JSON.parse(localStorage.getItem('dubbing_favorit')) || [];

    let semuaFilm = [];
    let dataAktif = [];
    let currentIndex = 0;
    
    const PER_PAGE = 16; 
    let searchTimer;

    // FUNGSI KUNCI: BUAT ID UNIK BERDASARKAN URL STREAM & JUDUL FILM
    function generateUniqueId(str) {
        let hash = 0;
        if (!str || str.length === 0) return "film_0";
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash |= 0;
        }
        return "film_" + Math.abs(hash);
    }

    function getOptimizedImg(originalUrl) {
        if (!originalUrl || originalUrl.includes('placeholder.com')) {
            return 'https://via.placeholder.com/400x225?text=No+Image';
        }
        return `https://images.weserv.nl/?url=${encodeURIComponent(originalUrl)}&w=1280&output=webp&q=80`;
    }

    // FUNGSI FORMAT MILIDETIK KE MENIT:DETIK
    function formatTime(ms) {
        if (!ms || ms <= 0) return "00:00";
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    /* FUNGSI GENERATE HTML GARIS MERAH DARI SHAREDPFERENCES ANDROID */
    function getProgressBarHtml(filmId) {
        const nativeAndroid = (typeof AndroidInterface !== "undefined") ? AndroidInterface : ((typeof Android !== "undefined") ? Android : null);
        if (nativeAndroid && nativeAndroid.getProgressVideo && filmId) {
            try {
                const dataData = JSON.parse(nativeAndroid.getProgressVideo(filmId));
                if (dataData && dataData.durasi > 0) {
                    const persentase = (dataData.posisi / dataData.durasi) * 100;
                    if (persentase > 1 && persentase < 95) {
                        return `<div class="progress-container"><div class="progress-bar-red" style="width: ${persentase.toFixed(1)}%"></div></div>`;
                    }
                }
            } catch(e){}
        }
        return "";
    }

    /* FUNGSI UNTUK MERENDER BARIS LANJUTKAN MENONTON */
    function updateTampilanLanjutkanMenonton() {
        containerContinue.innerHTML = "";
        const nativeAndroid = (typeof AndroidInterface !== "undefined") ? AndroidInterface : ((typeof Android !== "undefined") ? Android : null);
        
        if (!nativeAndroid || !nativeAndroid.getProgressVideo) {
            continueSectionTitle.style.display = "none";
            containerContinue.style.display = "none";
            return;
        }

        let adaVideoLanjut = false;

        semuaFilm.forEach(film => {
            try {
                const dataData = JSON.parse(nativeAndroid.getProgressVideo(film.id));
                if (dataData && dataData.durasi > 0) {
                    const persentase = (dataData.posisi / dataData.durasi) * 100;

                    if (persentase > 1 && persentase < 95) {
                        adaVideoLanjut = true;
                        const optimizedImg = getOptimizedImg(film.img);
                        const progressBarHtml = `<div class="progress-container"><div class="progress-bar-red" style="width: ${persentase.toFixed(1)}%"></div></div>`;
                        const posisiMenit = formatTime(dataData.posisi);

                        containerContinue.insertAdjacentHTML("beforeend", `
                            <div class="card-film" data-id="${film.id}" id="continue-${film.id}">
                                <a tabindex="0" class="play-link" href="${film.url}" data-title="${film.title.toLowerCase()}">
                                    <div class="poster-wrapper">
                                        <span class="time-badge">Lanjut ${posisiMenit}</span>
                                        <img src="${optimizedImg}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x225?text=No+Image';">
                                        ${progressBarHtml}
                                    </div>
                                </a>
                                <button class="btn-fav" tabindex="0" data-target="${film.id}">
                                    <span>☆</span> Favorit
                                </button>
                                <div class="film-title">${film.title}</div>
                            </div>
                        `);
                    }
                }
            } catch (e) {}
        });

        if (adaVideoLanjut) {
            continueSectionTitle.style.display = "block";
            continueSectionTitle.style.borderLeft = "4px solid #E50914";
            containerContinue.style.display = "flex";
        } else {
            continueSectionTitle.style.display = "none";
            containerContinue.style.display = "none";
        }

        perbaruiStatusTombolBintang();
    }

    window.addEventListener("keydown", function(e) {
        if (e.key === "Escape" || e.key === "Back" || e.keyCode === 4) { 
            const nativeAndroid = (typeof AndroidInterface !== "undefined") ? AndroidInterface : ((typeof Android !== "undefined") ? Android : null);
            if (nativeAndroid && nativeAndroid.exitApp) {
                e.preventDefault();
                nativeAndroid.exitApp(); 
            }
        }
    });

    function aktifkanKeyboard() {
        if (searchBox.hasAttribute("readonly")) {
            searchBox.removeAttribute("readonly");
            searchBox.focus();
        }
    }

    searchBox.addEventListener("click", aktifkanKeyboard);
    searchBox.addEventListener("touchstart", aktifkanKeyboard);

    searchBox.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.keyCode === 13) {
            aktifkanKeyboard();
        }
    });

    searchBox.addEventListener("blur", function() {
        this.setAttribute("readonly", "true");
    });

    function updateTampilanFavorit() {
        containerFav.innerHTML = "";
        if (listFavorit.length === 0) {
            favSectionTitle.style.display = "none";
            containerFav.style.display = "none";
        } else {
            favSectionTitle.style.display = "block";
            containerFav.style.display = "flex";
            listFavorit.forEach(idFilm => {
                const film = semuaFilm.find(f => f.id === idFilm);
                if(!film) return;

                const optimizedImg = getOptimizedImg(film.img);
                const progressBarHtml = getProgressBarHtml(film.id);

                containerFav.insertAdjacentHTML("beforeend", `
                    <div class="card-film" data-id="${film.id}" id="fav-${film.id}">
                        <a tabindex="0" class="play-link" href="${film.url}" data-title="${film.title.toLowerCase()}">
                            <div class="poster-wrapper">
                                <img src="${optimizedImg}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x225?text=No+Image';">
                                ${progressBarHtml}
                            </div>
                        </a>
                        <button class="btn-fav" tabindex="0" data-target="${film.id}">
                            <span>★</span> Favorit
                        </button>
                        <div class="film-title">${film.title}</div>
                    </div>
                `);
            });
        }
        pasangEventAksi();
        perbaruiStatusTombolBintang();
    }

    function perbaruiStatusTombolBintang() {
        document.querySelectorAll('.btn-fav').forEach(btn => {
            const idTarget = btn.getAttribute('data-target');
            if (listFavorit.includes(idTarget)) {
                btn.classList.add('active');
                btn.innerHTML = "<span>★</span> Favorit";
            } else {
                btn.classList.remove('active');
                btn.innerHTML = "<span>☆</span> Favorit";
            }
        });
    }

    function renderNext(){
        const html = dataAktif
            .slice(currentIndex, currentIndex + PER_PAGE)
            .map(film => {
                const optimizedImg = getOptimizedImg(film.img);
                const progressBarHtml = getProgressBarHtml(film.id);
                return `
                <div class="card-film" data-id="${film.id}" id="utama-${film.id}">
                    <a tabindex="0" class="play-link" href="${film.url}" data-title="${film.title.toLowerCase()}">
                        <div class="poster-wrapper">
                            <img src="${optimizedImg}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x225?text=No+Image';">
                            ${progressBarHtml}
                        </div>
                    </a>
                    <button class="btn-fav" tabindex="0" data-target="${film.id}">
                        <span>☆</span> Favorit
                    </button>
                    <div class="film-title">${film.title}</div>
                </div>
            `}).join("");

        containerUtama.insertAdjacentHTML("beforeend", html);
        currentIndex += PER_PAGE;
        perbaruiStatusTombolBintang();
    }

    function pasangEventAksi() {}

    /* FUNGSI KLIK PEMUTARAN BERSIH TERHUBUNG KE HOME SCREEN TV & TERUSKAN JUDUL FILM */
    document.addEventListener("click", function(e){
        const play = e.target.closest(".play-link");
        if(play){
            e.preventDefault();
            const card = play.closest(".card-film");
            
            const filmId = card ? (card.getAttribute("data-id") || "") : "";
            const cardElementId = card ? card.id : "";

            // Ambil Judul dan Gambar Poster dari Elemen Kartu Film
            const filmTitle = card ? (card.querySelector(".film-title")?.innerText || "Film MRZYB TV") : "Film MRZYB TV";
            const filmImg = card ? (card.querySelector(".poster-wrapper img")?.src || "") : "";

            localStorage.setItem("dubbing_idPosterTerakhir", cardElementId);
            localStorage.setItem("dubbing_sedangNontonVideoSTB", "ya");

            const videoUrl = play.getAttribute("href") || play.href;

            // DETEKSI INTERFACE ANDROID (AndroidInterface atau Android)
            const nativeAndroid = (typeof AndroidInterface !== "undefined") ? AndroidInterface : ((typeof Android !== "undefined") ? Android : null);

            // 1. KIRIM DATA FILM KE HOME SCREEN CHANNEL ANDROID TV
            if (nativeAndroid && typeof nativeAndroid.kirimFilmKeHomeScreen === "function") {
                nativeAndroid.kirimFilmKeHomeScreen(
                    filmTitle,
                    "Diputar dari MRZYB TV",
                    filmImg,
                    videoUrl
                );
            }

            // 2. BUKA PLAYER VIDEO DENGAN MENGIRIM JUDUL FILM KE JAVA
            if (nativeAndroid) {
                if (typeof nativeAndroid.playVideoWithTitle === "function") {
                    nativeAndroid.playVideoWithTitle(videoUrl, filmId, filmTitle);
                } else if (typeof nativeAndroid.playVideoWithId === "function") {
                    nativeAndroid.playVideoWithId(videoUrl, filmId);
                } else if (typeof nativeAndroid.playVideo === "function") {
                    nativeAndroid.playVideo(videoUrl);
                }
            } else {
                window.location.href = videoUrl;
            }
            return;
        }

        const fav = e.target.closest(".btn-fav");
        if(fav){
            e.preventDefault();
            const id = fav.dataset.target;
            if(listFavorit.includes(id)){
                listFavorit = listFavorit.filter(x => x !== id);
            }else{
                listFavorit.push(id);
            }
            localStorage.setItem("dubbing_favorit", JSON.stringify(listFavorit));
            updateTampilanFavorit();
        }
    });

    document.addEventListener("keydown", function(e){
        if(e.key !== "Enter" && e.keyCode !== 13) return;
        const play = e.target.closest(".play-link");
        if(play){
            e.preventDefault();
            play.click();
            return;
        }
        const fav = e.target.closest(".btn-fav");
        if(fav){
            e.preventDefault();
            fav.click();
        }
    });

    // EVENT DETEKSI FOKUS UNTUK UBAH BACKGROUND & BANNER HERO MOVIEBOX
    document.addEventListener("focusin", function(e) {
        const card = e.target.closest(".card-film");
        if (card) {
            const img = card.querySelector(".poster-wrapper img");
            const title = card.querySelector(".film-title");
            
            if (img && img.src) {
                document.body.style.setProperty('--bg-poster', `url('${img.src}')`);
                document.body.classList.add('has-bg-focus');

                // UPDATE FEATURED BANNER SESUAI ITEM YANG DIFOKUS
                document.getElementById('heroImage').src = img.src;
                if(title) {
                    document.getElementById('heroTitle').innerText = title.innerText;
                }
            }
        } else {
            document.body.classList.remove('has-bg-focus');
        }
    });

    function saringFilm(keyword){
        currentIndex = 0;
        containerUtama.innerHTML = "";
        if(keyword === ""){
            dataAktif = semuaFilm;
            renderNext();
            noResultsText.style.display = "none";
            return;
        }
        dataAktif = semuaFilm.filter(film => film.title.toLowerCase().includes(keyword));
        if(dataAktif.length){
            renderNext();
            noResultsText.style.display = "none";
        }else{
            noResultsText.style.display = "block";
        }
    }

    searchBox.addEventListener("input", function(){
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            const filterText = searchBox.value.toLowerCase().trim();
            btnClear.style.display = searchBox.value.length > 0 ? "flex" : "none";
            saringFilm(filterText);
        }, 200);
    });

    btnClear.addEventListener('click', function() {
        searchBox.value = "";
        btnClear.style.display = "none";
        saringFilm("");
        searchBox.focus();
    });

    // PARSER M3U BERSIH
    function parseM3U(m3uText) {
        const lines = m3uText.split('\n');
        const listFilm = [];
        let currentTitle = '';
        let currentImg = '';

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF')) {
                const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                currentImg = logoMatch ? logoMatch[1] : '';

                const commaIndex = line.lastIndexOf(',');
                if (commaIndex !== -1) {
                    currentTitle = line.substring(commaIndex + 1).trim();
                }
            } else if (line && !line.startsWith('#')) {
                const cleanUrl = line.trim();
                if (currentTitle && cleanUrl) {
                    const uniqueId = generateUniqueId(cleanUrl + currentTitle);
                    listFilm.push({
                        id: uniqueId,
                        title: currentTitle,
                        url: cleanUrl,
                        img: currentImg || 'https://via.placeholder.com/400x225?text=No+Image'
                    });
                }
                currentTitle = '';
                currentImg = '';
            }
        }
        return listFilm;
    }

    fetch('https://mrzybtv-api.ukielaki88.workers.dev/api/dubbing')
        .then(response => response.text())
        .then(m3uText => {
            const data = parseM3U(m3uText);
            semuaFilm = data;
            dataAktif = data;

            // SET HERO INITIAL
            if(data.length > 0) {
                document.getElementById('heroImage').src = getOptimizedImg(data[0].img);
                document.getElementById('heroTitle').innerText = data[0].title;
            }

            renderNext();
            updateTampilanFavorit();
            updateTampilanLanjutkanMenonton();
            
            containerUtama.addEventListener("focusin", function(e){
                const card = e.target.closest(".card-film");
                if(!card) return;
                const cards = containerUtama.querySelectorAll(".card-film");
                const index = Array.from(cards).indexOf(card);
                if(index >= currentIndex - 6 && currentIndex < dataAktif.length){
                    renderNext();
                }
            });

            window.addEventListener("scroll", function() {
                if ((window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 500)) {
                    if (currentIndex < dataAktif.length) {
                        renderNext();
                    }
                }
            });

            setTimeout(() => {
                const statusNontonSTB = localStorage.getItem("dubbing_sedangNontonVideoSTB");
                const idPosterTerakhir = localStorage.getItem("dubbing_idPosterTerakhir");
                if (statusNontonSTB === "ya" && idPosterTerakhir) {
                    let targetPoster = document.getElementById(idPosterTerakhir);

                    while (!targetPoster && currentIndex < dataAktif.length) {
                        renderNext();
                        targetPoster = document.getElementById(idPosterTerakhir);
                    }

                    if (targetPoster) {
                        const tombolPlay = targetPoster.querySelector('.play-link');
                        if (tombolPlay) {
                            tombolPlay.focus();
                            targetPoster.scrollIntoView({ behavior: "auto", block: "center" });
                            localStorage.removeItem("dubbing_sedangNontonVideoSTB");
                            localStorage.removeItem("dubbing_idPosterTerakhir");
                            return;
                        }
                    }
                }
                
                const firstPoster = document.querySelector("#containerContinue .play-link") || 
                                    document.querySelector("#containerFav .play-link") || 
                                    document.querySelector("#containerUtama .play-link");
                if (firstPoster) {
                    firstPoster.focus();
                }
            }, 180);
        })
        .catch(err => {
            console.error("Gagal load playlist M3U:", err);
            const firstPoster = document.querySelector("#containerUtama .play-link");
            if (firstPoster) {
                firstPoster.focus();
            }
        });
});
</script>
</body>
</html>
