<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Digital - Fokus Per Kotak Ayat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
        }
        h1 {
            text-align: center;
            color: #81c784;
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #444;
            border-radius: 8px;
            margin-bottom: 25px;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }
        
        /* Gaya saat Dropdown aktif/difokuskan remote */
        select:focus {
            border: 3px solid #ff9800 !important;
            background-color: #332b22 !important;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .ayat-card {
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            background-color: #1a1a1a;
            transition: all 0.2s ease;
            outline: none; /* Hilangkan garis bawaan browser */
        }

        /* Gaya SANGAT JELAS saat Kotak Ayat sedang difokuskan oleh Remote */
        .ayat-card:focus {
            border: 4px solid #4caf50 !important; /* Border hijau terang */
            background-color: #1b3022 !important;  /* Latar belakang sedikit kehijauan */
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.6); /* Efek cahaya/glow */
            transform: scale(1.02); /* Sedikit memperbesar kotak yang aktif */
        }

        .nomor-ayat {
            display: inline-block;
            background-color: #2e7d32;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .teks-arab {
            font-size: 32px;
            text-align: right;
            direction: rtl;
            line-height: 2.2;
            margin: 15px 0;
            color: #ffffff;
        }
        .arti {
            font-size: 16px;
            color: #b0bec5;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Al-Qur'an Digital</h1>
    
    <!-- Select Surat -->
    <select id="select-surat" tabindex="1" onchange="loadAyat(this.value)">
        <option value="">-- Loading Surat... --</option>
    </select>

    <div id="konten-ayat"></div>
</div>

<script>
    const apiBase = 'https://equran.id/api/v2';
    let focusedAyatIndex = -1;

    // 1. Ambil daftar surat
    async function loadSurat() {
        try {
            const res = await fetch(`${apiBase}/surat`);
            const data = await res.json();
            const select = document.getElementById('select-surat');
            select.innerHTML = '<option value="">-- Pilih Surat (Tekan Enter/OK) --</option>';

            data.data.forEach(surat => {
                const opt = document.createElement('option');
                opt.value = surat.nomor;
                opt.textContent = `${surat.nomor}. ${surat.namaLatin} (${surat.nama})`;
                select.appendChild(opt);
            });
            select.focus();
        } catch (err) {
            console.error(err);
        }
    }

    // 2. Ambil isi ayat
    async function loadAyat(nomorSurat) {
        if (!nomorSurat) return;
        const container = document.getElementById('konten-ayat');
        container.innerHTML = '<p style="text-align:center;">Memuat ayat...</p>';
        focusedAyatIndex = -1;

        try {
            const res = await fetch(`${apiBase}/surat/${nomorSurat}`);
            const data = await res.json();
            
            let html = '';
            data.data.ayat.forEach((ayat, idx) => {
                html += `
                    <div class="ayat-card" tabindex="0" data-index="${idx}">
                        <span class="nomor-ayat">Ayat ${ayat.nomorAyat}</span>
                        <div class="teks-arab">${ayat.teksArab}</div>
                        <div class="arti">${ayat.teksIndonesia}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = '<p style="color:red; text-align:center;">Gagal memuat ayat.</p>';
        }
    }

    // 3. Logika Navigasi Tombol Remote / Keyboard Per Kotak Ayat
    document.addEventListener('keydown', function(e) {
        const cards = document.querySelectorAll('.ayat-card');
        const selectSurat = document.getElementById('select-surat');

        switch(e.key) {
            case 'ArrowDown': // Tombol Bawah
                if (document.activeElement === selectSurat && cards.length > 0) {
                    focusedAyatIndex = 0;
                    cards[0].focus();
                    cards[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (focusedAyatIndex < cards.length - 1) {
                    focusedAyatIndex++;
                    cards[focusedAyatIndex].focus();
                    cards[focusedAyatIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                e.preventDefault();
                break;

            case 'ArrowUp': // Tombol Atas
                if (focusedAyatIndex > 0) {
                    focusedAyatIndex--;
                    cards[focusedAyatIndex].focus();
                    cards[focusedAyatIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (focusedAyatIndex === 0) {
                    focusedAyatIndex = -1;
                    selectSurat.focus();
                    selectSurat.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                e.preventDefault();
                break;

            case 'Backspace': // Tombol Kembali / Back
            case 'Escape':
                selectSurat.focus();
                selectSurat.scrollIntoView({ behavior: 'smooth', block: 'center' });
                focusedAyatIndex = -1;
                e.preventDefault();
                break;
        }
    });

    loadSurat();
</script>

</body>
</html>
