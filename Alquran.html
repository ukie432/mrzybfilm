<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Digital - TV & STB Ready</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #81c784;
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #444;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }
        
        select:focus {
            border: 4px solid #ff9800 !important;
            background-color: #332b22 !important;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.8);
        }

        /* Kunci utama: Buat tinggi kartu tepat 100% viewport minus margin */
        .ayat-card {
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #1a1a1a;
            outline: none;
            
            /* Mengunci ukuran agar pas 1 layar TV */
            height: calc(100vh - 120px); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden; /* Mencegah scrollbar di dalam kotak */
        }

        .ayat-card:focus {
            border: 4px solid #4caf50 !important;
            background-color: #1b3022 !important;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
            transform: scale(1.01);
        }

        .header-ayat {
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        
        .nomor-ayat {
            display: inline-block;
            background-color: #2e7d32;
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        /* Container fleksibel untuk menampung teks */
        .content-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .teks-arab {
            font-size: 36px; /* Font awal (akan mengecil otomatis jika panjang) */
            text-align: right;
            direction: rtl;
            line-height: 1.8;
            color: #ffffff;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .arti {
            font-size: 18px; /* Font awal (akan mengecil otomatis jika panjang) */
            color: #b0bec5;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #2e7d32;
            color: white;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            outline: none;
        }

        .floating-btn:focus {
            border: 4px solid #ff9800 !important;
            background-color: #e65100 !important;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.9);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Al-Qur'an Digital</h1>
    
    <select id="select-surat" tabindex="1" onchange="loadAyat(this.value)">
        <option value="">-- Loading Surat... --</option>
    </select>

    <div id="konten-ayat"></div>
</div>

<button id="btn-floating" class="floating-btn" tabindex="0" onclick="resetFocusToSearch()" title="Kembali ke Menu Utama">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
</button>

<script>
    const apiBase = 'https://equran.id/api/v2';
    let focusedAyatIndex = -1;

    function resetFocusToSearch() {
        const selectSurat = document.getElementById('select-surat');
        selectSurat.focus();
        selectSurat.scrollIntoView({ behavior: 'smooth', block: 'center' });
        focusedAyatIndex = -1;
    }

    function focusFloatingButton() {
        const btnFloating = document.getElementById('btn-floating');
        btnFloating.focus();
    }

    async function loadSurat() {
        try {
            const res = await fetch(`${apiBase}/surat`);
            const data = await res.json();
            const select = document.getElementById('select-surat');
            select.innerHTML = '<option value="">-- Pilih Surat (Tekan Enter/OK) --</option>';

            data.data.forEach(surat => {
                const opt = document.createElement('option');
                opt.value = surat.nomor;
                opt.textContent = `${surat.nomor}. ${surat.namaLatin} (${surat.nama})`;
                select.appendChild(opt);
            });
            select.focus();
        } catch (err) {
            console.error(err);
        }
    }

    async function loadAyat(nomorSurat) {
        if (!nomorSurat) return;
        const container = document.getElementById('konten-ayat');
        container.innerHTML = '<p style="text-align:center;">Memuat ayat...</p>';
        focusedAyatIndex = -1;

        try {
            const res = await fetch(`${apiBase}/surat/${nomorSurat}`);
            const data = await res.json();
            
            let html = '';
            data.data.ayat.forEach((ayat, idx) => {
                html += `
                    <div class="ayat-card" tabindex="0" data-index="${idx}">
                        <div class="header-ayat">
                            <span class="nomor-ayat">Ayat ${ayat.nomorAyat}</span>
                        </div>
                        <div class="content-box">
                            <div class="teks-arab">${ayat.teksArab}</div>
                            <div class="arti">${ayat.teksIndonesia}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // Panggil fungsi penyesuaian font otomatis setelah HTML dirender
            adjustFontSize();

        } catch (err) {
            container.innerHTML = '<p style="color:red; text-align:center;">Gagal memuat ayat.</p>';
        }
    }

    // Fungsi otomatis untuk mengecilkan ukuran font jika teks meluap dari kotak
    function adjustFontSize() {
        const cards = document.querySelectorAll('.ayat-card');
        
        cards.forEach(card => {
            const contentBox = card.querySelector('.content-box');
            const teksArab = card.querySelector('.teks-arab');
            const arti = card.querySelector('.arti');

            let arabSize = 36; // Ukuran dasar font Arab
            let artiSize = 18; // Ukuran dasar font Arti

            // Turunkan ukuran font secara bertahap jika tinggi konten melebihi batas wadah
            while (contentBox.scrollHeight > contentBox.clientHeight && arabSize > 18) {
                arabSize -= 1.5;
                artiSize -= 0.8;
                teksArab.style.fontSize = arabSize + 'px';
                arti.style.fontSize = artiSize + 'px';
            }
        });
    }

    // Navigasi Remote STB
    document.addEventListener('keydown', function(e) {
        const cards = document.querySelectorAll('.ayat-card');
        const selectSurat = document.getElementById('select-surat');
        const btnFloating = document.getElementById('btn-floating');

        switch(e.key) {
            case 'ArrowDown':
                if (document.activeElement === selectSurat && cards.length > 0) {
                    focusedAyatIndex = 0;
                    cards[0].focus();
                    cards[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (focusedAyatIndex < cards.length - 1) {
                    focusedAyatIndex++;
                    cards[focusedAyatIndex].focus();
                    cards[focusedAyatIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                e.preventDefault();
                break;

            case 'ArrowUp':
                if (document.activeElement === btnFloating && cards.length > 0) {
                    focusedAyatIndex = cards.length - 1;
                    cards[focusedAyatIndex].focus();
                    cards[focusedAyatIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (focusedAyatIndex > 0) {
                    focusedAyatIndex--;
                    cards[focusedAyatIndex].focus();
                    cards[focusedAyatIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (focusedAyatIndex === 0) {
                    resetFocusToSearch();
                }
                e.preventDefault();
                break;

            case 'Backspace':
            case 'Escape':
                resetFocusToSearch();
                e.preventDefault();
                break;
        }
    });

    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        focusFloatingButton();
    });

    loadSurat();
</script>

</body>
</html>
