<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>MRZYBceramah - Audio Player TV</title>
    
    <!-- PRECONNECT DOMAIN UTAMA UNTUK MEMPERCEPAT LOAD ASSET/GAMBAR -->
    <link rel="preconnect" href="https://mrzybtv-api.ukielaki88.workers.dev" crossorigin>
    <link rel="preconnect" href="https://use.fontawesome.com" crossorigin>
    
    <!-- FontAwesome untuk Icon Navigasi -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
    
    <style>
        /* --- RESET & LAYOUT UTAMA --- */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0a0c10;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
            overflow: hidden;
        }

        /* CONTAINER UTAMA: LEBAR PENUH */
        .music-app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(10, 12, 16, 0.95);
        }

        /* --- HEAD PLAYER --- */
        .neon-player {
            position: relative;
            display: flex;
            align-items: center;
            padding: 30px 40px;
            background: #06080b;
            border-bottom: 1px solid #141923;
            flex: 0 0 auto;
            overflow: hidden;
        }

        #spectrum-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }

        .now-playing-cover, .track-info, .player-right-wrapper {
            position: relative;
            z-index: 2;
        }

        .now-playing-cover {
            width: 90px;
            height: 90px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #00cc66;
            margin-right: 25px;
            background-color: #141923; /* Placeholder visual saat loading */
        }

        .track-info {
            flex-grow: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .time-display {
            font-size: 14px;
            color: #777;
            font-family: monospace;
        }

        .player-right-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
        }

        .app-brand-logo {
            font-size: 14px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 3px;
            text-transform: uppercase;
            user-select: none;
            border-right: 3px solid #00cc66;
            padding-right: 8px;
            line-height: 1;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-control {
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            outline: none;
        }

        .btn-control:focus, .btn-control:hover {
            color: #00cc66;
            transform: scale(1.1);
        }

        .btn-control.active-mode {
            color: #00cc66;
        }

        .btn-play-pause {
            font-size: 46px;
            color: #e0e0e0;
        }
        .btn-play-pause:focus, .btn-play-pause:hover {
            color: #00cc66;
        }

        /* BAR PROGRES */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #141923;
            cursor: pointer;
            flex: 0 0 auto;
            outline: none;
            position: relative;
            z-index: 3;
        }

        .progress-container:focus {
            background: #1a2230;
            height: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00cc66;
        }

        /* --- PLAYLIST DAFTAR LAGU --- */
        .modern-playlist {
            flex: 1 1 auto;
            overflow-y: auto;
            background: #0a0c10;
            padding: 20px 40px 40px 40px;
        }

        .modern-playlist::-webkit-scrollbar {
            width: 6px;
        }
        .modern-playlist::-webkit-scrollbar-thumb {
            background: #141923;
            border-radius: 3px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            margin-bottom: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.01);
            cursor: pointer;
            outline: none;
            border: 1px solid transparent;
        }

        .playlist-item:hover {
            background: #10141d;
        }

        .playlist-item:focus {
            background: #141a26 !important; 
            border-color: #00cc66 !important;
        }

        .playlist-item.active {
            background: rgba(0, 204, 102, 0.06);
            border-left: 4px solid #00cc66;
        }

        .item-cover {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            margin-right: 20px;
            background-color: #141923;
        }

        .item-title {
            font-size: 18px;
            color: #b0b5c0;
        }

        .playlist-item.active .item-title, .playlist-item:focus .item-title {
            color: #fff;
            font-weight: bold;
        }

        .no-result {
            text-align: center;
            padding: 50px 20px;
            color: #444;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- CORE AUDIO ELEMENT -->
    <audio id="main-audio" src=""></audio>

    <div class="music-app-container">
        
        <!-- ELEMENT BOX PLAYER (ZONA ATAS) -->
        <div class="neon-player">
            <canvas id="spectrum-canvas"></canvas>

            <img id="player-cover" class="now-playing-cover" src="" alt="Cover" fetchpriority="high" decoding="async">
            
            <div class="track-info">
                <div id="player-title" class="track-title">Memuat data audio...</div>
                <div id="player-time" class="time-display">00:00 / 00:00</div>
            </div>

            <div class="player-right-wrapper">
                <div class="app-brand-logo">MRZYB.Ceramah</div>
                
                <div class="player-controls">
                    <button class="btn-control" id="shuffle-btn" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
                    <button class="btn-control" onclick="playPrev()"><i class="fas fa-backward"></i></button>
                    <button class="btn-control btn-play-pause" id="play-btn" tabindex="0" onclick="togglePlay()"><i class="fas fa-play-circle"></i></button>
                    <button class="btn-control" onclick="playNext()"><i class="fas fa-forward"></i></button>
                    <button class="btn-control" id="repeat-btn" onclick="toggleRepeat()"><i class="fas fa-redo"></i></button>
                </div>
            </div>
        </div>

        <!-- PROGRESS BAR -->
        <div class="progress-container" id="progress-container" tabindex="0" onclick="setProgress(event)">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- ELEMENT PLAYLIST DAFTAR AUDIO -->
        <div class="modern-playlist" id="playlist-container"></div>

    </div>

    <!-- --- JAVASCRIPT ENGINE --- -->
    <script>
        let tracks = []; 
        let currentTrackIndex = 0;
        let isShuffle = false;
        let isRepeat = false;

        let canvas, ctx;
        let totalBars = 45; 
        let barHeights = Array(totalBars).fill(0); 
        let targetHeights = Array(totalBars).fill(0);

        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-btn');
        const playerCover = document.getElementById('player-cover');
        const playerTitle = document.getElementById('player-title');
        const playerTime = document.getElementById('player-time');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const playlistContainer = document.getElementById('playlist-container');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');

        // --- SISTEM AUDIO WATCHDOG (LEBIH SABAR & RAMAH JARINGAN) ---
        let lastPlayTime = -1;
        let stuckCounter = 0;
        let isBuffering = false;
        const MAX_STUCK_TOLERANCE = 8; // Toleransi 8 detik untuk jaringan lambat

        function startAudioWatchdog() {
            setInterval(() => {
                if (!audio.paused && audio.src) {
                    if (audio.currentTime === lastPlayTime) {
                        stuckCounter++;
                        // Hanya melakukan pemulihan jika macet melebihi 8 detik DAN BUKAN karena buffering normal
                        if (stuckCounter >= MAX_STUCK_TOLERANCE && !isBuffering) {
                            console.warn("Audio benar-benar macet. Memulai pemulihan...");
                            recoverStuckAudio();
                            stuckCounter = 0;
                        }
                    } else {
                        // Reset counter saat audio berjalan normal
                        lastPlayTime = audio.currentTime;
                        stuckCounter = 0;
                        isBuffering = false;
                    }
                }
            }, 1000);
        }

        function recoverStuckAudio() {
            if (!audio.src) return;
            const currentPos = audio.currentTime;
            audio.pause();
            
            // Jeda 1 detik untuk menyambung ulang koneksi stream tanpa langsung loncat lagu
            setTimeout(() => {
                audio.load();
                audio.currentTime = currentPos;
                audio.play().catch(err => {
                    console.error("Recovery gagal, pindah ke lagu berikutnya:", err);
                    playNext();
                });
            }, 1000);
        }

        // Handling event buffering dari HTML5 Media Element
        audio.addEventListener('waiting', () => {
            isBuffering = true;
            playerTitle.innerText = "Buffering... Mohon tunggu";
        });

        audio.addEventListener('playing', () => {
            isBuffering = false;
            stuckCounter = 0;
            if (tracks[currentTrackIndex]) {
                playerTitle.innerText = tracks[currentTrackIndex].title;
            }
        });

        audio.addEventListener('stalled', () => {
            isBuffering = true;
        });

        // FITUR PRELOADER GANDA: Mempercepat loading cover
        function preloadCoverImages(trackList) {
            trackList.forEach(track => {
                if (track.cover) {
                    const img = new Image();
                    img.src = track.cover;
                }
            });
        }

        async function fetchPlaylistData() {
            try {
                const response = await fetch('https://mrzybtv-api.ukielaki88.workers.dev/api/ceramah');
                if (!response.ok) {
                    throw new Error("Gagal mengambil data. Periksa file JSON Anda.");
                }
                tracks = await response.json();
                
                // Mulai caching gambar di latar belakang
                preloadCoverImages(tracks);

                loadPlaylistView();
                if(tracks.length > 0) {
                    loadTrack(0);
                }
            } catch (error) {
                console.error("Error:", error);
                playerTitle.innerText = "Gagal memuat data audio";
                playlistContainer.innerHTML = `<div class="no-result" style="color: #00cc66;">${error.message}</div>`;
            }
        }

        function initVirtualSpectrum() {
            canvas = document.getElementById('spectrum-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            animateSpectrum();
        }

        function animateSpectrum() {
            requestAnimationFrame(animateSpectrum);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let barWidth = canvas.width / totalBars;
            for (let i = 0; i < totalBars; i++) {
                if (!audio.paused) {
                    if (Math.random() > 0.88) {
                        targetHeights[i] = Math.random() * (canvas.height - 10) + 3;
                    }
                } else {
                    targetHeights[i] = 0;
                }
                barHeights[i] += (targetHeights[i] - barHeights[i]) * 0.15;
                ctx.fillStyle = `rgba(0, 204, 102, ${barHeights[i] / (canvas.height * 1.5) + 0.15})`;
                ctx.fillRect(i * barWidth, canvas.height - barHeights[i], barWidth - 4, barHeights[i]);
            }
        }

        function loadPlaylistView() {
            playlistContainer.innerHTML = "";
            if (tracks.length === 0) {
                playlistContainer.innerHTML = `<div class="no-result">Daftar lagu tidak ditemukan...</div>`;
                return;
            }
            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
                item.setAttribute('id', `track-item-${index}`);
                item.setAttribute('tabindex', '0'); 
                item.setAttribute('onclick', `selectTrack(${index})`);
                
                // D-Pad Remote Control STB handler
                item.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        selectTrack(index);
                    } else if (e.key === 'ArrowUp' && index === 0) {
                        e.preventDefault();
                        progressContainer.focus();
                    }
                });

                item.innerHTML = `
                    <img class="item-cover" src="${track.cover}" decoding="async" ${index < 6 ? 'fetchpriority="high"' : ''}>
                    <div class="item-title">${track.title}</div>
                `;
                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index) {
            if(tracks.length === 0) return;
            currentTrackIndex = index;
            audio.src = tracks[index].url;
            playerTitle.innerText = tracks[index].title;
            playerCover.src = tracks[index].cover;
            progressBar.style.width = "0%";
            playerTime.innerText = "00:00 / 00:00";
            
            const items = playlistContainer.querySelectorAll('.playlist-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === index);
            });

            // Auto-scroll ke lagu yang sedang aktif
            const activeItem = document.getElementById(`track-item-${index}`);
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(e => console.log(e));
                playBtn.innerHTML = '<i class="fas fa-pause-circle"></i>';
                playBtn.style.color = '#00cc66';
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play-circle"></i>';
                playBtn.style.color = '#e0e0e0';
            }
        }

        function selectTrack(index) {
            loadTrack(index);
            audio.play().catch(e => console.log(e));
            playBtn.innerHTML = '<i class="fas fa-pause-circle"></i>';
            playBtn.style.color = '#00cc66';
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active-mode', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active-mode', isRepeat);
        }

        function playNext() {
            if (tracks.length === 0) return;
            if (isShuffle) {
                let randomIndex = Math.floor(Math.random() * tracks.length);
                selectTrack(randomIndex);
            } else {
                let nextIndex = currentTrackIndex + 1;
                if (nextIndex >= tracks.length) nextIndex = 0;
                selectTrack(nextIndex);
            }
        }

        function playPrev() {
            if (tracks.length === 0) return;
            let prevIndex = currentTrackIndex - 1;
            if (prevIndex < 0) prevIndex = tracks.length - 1;
            selectTrack(prevIndex);
        }

        function formatTime(secs) {
            if (isNaN(secs) || secs === Infinity) return "00:00";
            let min = Math.floor(secs / 60);
            let sec = Math.floor(secs % 60);
            if (min < 10) min = "0" + min;
            if (sec < 10) sec = "0" + sec;
            return min + ":" + sec;
        }

        audio.addEventListener('loadedmetadata', () => {
            playerTime.innerText = `00:00 / ${formatTime(audio.duration)}`;
        });

        audio.addEventListener('timeupdate', () => {
            const { duration, currentTime } = audio;
            if (duration && !isNaN(duration)) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                playerTime.innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
            }
        });

        function setProgress(e) {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if(duration) audio.currentTime = (clickX / width) * duration;
        }

        progressContainer.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (!audio.duration || isNaN(audio.duration)) return;
                let newTime = audio.currentTime + 10;
                if (newTime > audio.duration) newTime = audio.duration;
                audio.currentTime = newTime;
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (!audio.duration || isNaN(audio.duration)) return;
                let newTime = audio.currentTime - 10;
                if (newTime < 0) newTime = 0;
                audio.currentTime = newTime;
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                const activeItem = playlistContainer.querySelector(`.playlist-item.active`) || playlistContainer.querySelector('.playlist-item');
                if (activeItem) activeItem.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                document.getElementById('play-btn').focus();
            }
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log(e));
            } else {
                playNext();
            }
        });

        window.addEventListener('resize', () => {
            if (canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
        });

        window.onload = async () => {
            await fetchPlaylistData();
            initVirtualSpectrum(); 
            startAudioWatchdog(); // Jalankan watchdog pemantau audio
            
            const firstItem = playlistContainer.querySelector('.playlist-item');
            if (firstItem) firstItem.focus();
        };

        // --- WATCHDOG FOCUS REMOTE STB (Pencegah Kursor Hilang) ---
        setInterval(function() {
            const active = document.activeElement;
            const isFocusable = active && (
                active.classList.contains('btn-control') ||
                active.classList.contains('playlist-item') ||
                active.classList.contains('progress-container')
            );

            if (!isFocusable || active === document.body) {
                const activeItem = document.querySelector('.playlist-item.active');
                if (activeItem) {
                    activeItem.focus();
                } else {
                    const firstItem = document.querySelector('.playlist-item');
                    if (firstItem) {
                        firstItem.focus();
                    } else {
                        const playBtn = document.getElementById('play-btn');
                        if (playBtn) playBtn.focus();
                    }
                }
            }
        }, 2000);
    </script>
</body>
</html>
