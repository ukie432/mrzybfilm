<!DOCTYPE html>
<html lang="id">
<head>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public">
    <link rel="preconnect" href="https://posterfilm.pages.dev">
    <link rel="preconnect" href="https://iptv-posterku.pages.dev">

    <meta charset="UTF-8">
    <title>MRZYBtv Series Dubbing</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; }
        
        /* Layout Navbar Flexbox */
        .navbar { 
            padding: 20px; 
            background: #111; 
            position: relative; 
            z-index: 10; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .navbar::after {
            content: "";
            display: block;
            width: 120px;
            height: 40px;
            background-image: url('https://posterfilm.pages.dev/poster/film_lawas/logoputihmrzyb.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center left;
        }

        .search-container { position: relative; display: inline-block; width: 80%; max-width: 400px; }
        
        .search-bar-wrapper { 
            width: 100%; 
            background: #fff; 
            border-radius: 20px; 
            border: 3px solid transparent; 
            box-sizing: border-box; 
            display: flex; 
            align-items: center; 
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-bar-wrapper:focus-within,
        .search-bar-wrapper:focus { 
            border-color: #ffffff; 
            outline: none; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); 
        }
        
        #search { 
            width: 100%; 
            padding: 12px 40px 12px 15px; 
            border: none; 
            outline: none; 
            background: transparent; 
            font-size: 16px; 
            color: #000; 
            box-sizing: border-box; 
        }
        
        .clear-search { 
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
            background: #444; color: #fff; border: none; border-radius: 50%; 
            width: 22px; height: 22px; font-size: 12px; font-weight: bold; 
            cursor: pointer; display: none; align-items: center; justify-content: center; 
            z-index: 12;
        }
        .clear-search:focus { background: red; outline: none; }

        /* Judul Section */
        .section-title { 
            font-size: 16px; 
            font-weight: 700; 
            margin: 20px 20px 10px 20px; 
            color: #E50914; 
            border-left: 4px solid #E50914; 
            padding-left: 10px; 
            display: none; 
        }

        /* Container Lanjutkan Menonton & Grid Utama */
        .container-continue { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
        }

        .poster { 
            cursor: pointer; 
            border: 3px solid #333; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #111; 
            position: relative; 
        }
        .poster:focus { transform: scale(1.05); border-color: #ffffff; outline: none; }
        
        .poster img { 
            width: 100%; 
            aspect-ratio: 3 / 4; 
            object-fit: cover; 
            display: block; 
        }
        
        .poster-title { 
            padding: 8px; 
            font-size: 14px; 
            text-align: center; 
            font-weight: bold; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            color: #fff; 
        }
        .poster:focus .poster-title { color: #ffffff; }

        /* Indicator Progress Bar Red */
        .progress-container { 
            width: 100%; 
            height: 4px; 
            background-color: rgba(255, 255, 255, 0.25); 
            position: absolute; 
            bottom: 30px; 
            left: 0; 
        }
        .progress-bar-red { 
            height: 100%; 
            background-color: #E50914; 
            width: 0%; 
            box-shadow: 0 0 4px #E50914; 
        }
        .time-badge { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(0,0,0,0.8); 
            color: #fff;
            font-size: 11px; 
            padding: 3px 6px; 
            border-radius: 4px; 
            font-weight: bold;
        }

        /* Indicator Progress Bar Mini di Daftar Episode Popup */
        .eps-progress-bg {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.2);
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .eps-progress-fill {
            height: 100%;
            background: #E50914;
            width: 0%;
        }
        
        /* Popup */
        #popup { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:100; justify-content:center; align-items:center; }
        .popup-content { background:#1a1a1a; padding:25px; border-radius:15px; width:80%; max-width:500px; border:2px solid #ffffff; position: relative; }
        .close-x { position: absolute; top: -15px; right: -15px; width: 45px; height: 45px; background: red; color: white; border-radius: 50%; border: 3px solid white; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 101; }
        .close-x:focus { outline: 3px solid #ffffff; transform: scale(1.1); }
        #eps-list { max-height: 300px; overflow-y: auto; margin-top: 15px; padding-right: 10px; }
        .eps-btn { display:block; width:100%; padding:10px; margin:5px 0; background:#333; border:none; color:white; text-align: left; border-radius: 5px; box-sizing: border-box; }
        .eps-btn:focus { background:#ffffff; color:black; outline: none; }
        .eps-btn:focus .eps-progress-fill { background: #E50914; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="search-container">
            <div class="search-bar-wrapper" id="search-box" tabindex="0">
              <input type="text" id="search" placeholder="Cari...">
            </div>
            <button id="clear-btn" class="clear-search" tabindex="-1">X</button>
        </div>
    </div>

    <!-- LANJUTKAN MENONTON SECTION -->
    <div class="section-title" id="continueTitle">LANJUTKAN MENONTON</div>
    <div class="container-continue" id="containerContinue"></div>

    <!-- SEMUA SERIES SECTION -->
    <div class="section-title" style="display: block;">SEMUA SERIES</div>
    <div class="grid" id="grid"></div>

    <div id="popup">
        <div class="popup-content" onclick="event.stopPropagation()">
            <button class="close-x" onclick="closePopup()" tabindex="0">X</button>
            <h2 id="modal-title" style="margin-top:0; padding-right: 30px;"></h2>
            <div id="eps-list"></div>
        </div>
    </div>

<script>
    const pageTitle = document.title.replace(/\s+/g, '_').toLowerCase(); 
    
    // ========================================================
    // LINK PLAYLIST M3U
    // ========================================================
    const playlistUrl = "https://raw.githubusercontent.com/ukie432/mrzybfilm/refs/heads/main/seri_animasi.m3u"; 

    let allData = [];
    let loaded = 0;
    const LOAD_SIZE = 40;

    // ========================================================
    // LOGIKA PENYELARASAN NATIVE & KEYBOARD
    // ========================================================
    window.tutupPopUpPoster = function(){
        window.closePopup();
    };

    window.addEventListener('keydown', function(event) {
        if (event.keyCode === 4 || event.keyCode === 27 || event.keyCode === 10009) {
            const popupElement = document.getElementById("popup");
            if (popupElement && window.getComputedStyle(popupElement).display !== "none") {
                event.preventDefault();
                window.tutupPopUpPoster(); 
                return;
            }
        }
    }, true); 

    $(document).on('keydown', function(e) {
        const activeEl = document.activeElement;
        
        if (e.keyCode == 13 && $(document.activeElement).hasClass("poster")) {
            e.preventDefault();
            const index = Number(document.activeElement.dataset.index);
            if (!isNaN(index)) {
                openModal(index);
            }
            return false;
        }

        if (e.keyCode == 38 && $(activeEl).hasClass('poster')) {
            const index = $('.grid .poster, .container-continue .poster').index(activeEl);
            if (index < 5) {
                e.preventDefault();
                document.getElementById("search-box").focus();
                return false;
            }
        }

        if (e.keyCode == 39 && $(activeEl).hasClass('eps-btn')) {
            document.querySelector(".close-x")?.focus();
        } else if (e.keyCode == 37 && $(activeEl).hasClass('close-x')) {
            const currentTitle = $("#modal-title").text();
            const lastIdx = localStorage.getItem(pageTitle + "_last_eps_" + currentTitle) || 0;
            $(`.eps-btn[data-index="${lastIdx}"]`).focus();
        }
        
        setTimeout(() => {
            const index = Number(document.activeElement.dataset.pos);
            if (!isNaN(index) && index >= loaded - 10 && loaded < allData.length) {
                loadMore();
            }
        }, 50);
    });

    $("#search-box").on("keydown click touchstart", function(e) {
        if (e.type === "click" || e.type === "touchstart") {
            $("#search").focus();
            return;
        }
        if (e.keyCode == 13) {
            e.preventDefault();
            $("#search").focus();
            return false;
        }
        if (e.keyCode == 40) {
            e.preventDefault();
            document.querySelector(".poster")?.focus();
            return false;
        }
        if (e.keyCode == 39 && $("#search").val().length > 0) {
            $("#clear-btn").attr("tabindex", "0").focus();
        }
    });

    $("#search").on("keydown", function(e) {
        if (e.keyCode == 40) {
            e.preventDefault();
            document.getElementById("search-box").focus();
            document.querySelector(".poster")?.focus();
        }
        if (e.keyCode == 13) {
            e.preventDefault();
        }
    });

    $("#clear-btn").on('keydown', function(e) {
        if (e.keyCode == 37) {
            document.getElementById("search-box").focus();
        }
        else if (e.keyCode == 40) {
            $(this).attr("tabindex", "-1");
            document.querySelector(".poster")?.focus();
        }
    });

    $("#clear-btn").on('click', function() {
        $("#search").val("");
        document.getElementById("grid").replaceChildren();
        loaded = 0;
        loadMore();
        $(this).hide().attr("tabindex","-1");
        document.getElementById("search-box").focus();
    });

    let searchTimer;
    $("#search").on("input", function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            const keyword = $("#search").val().trim().toLowerCase();
            if (keyword.length > 0) {
                $("#clear-btn").css("display", "flex");
            } else {
                $("#clear-btn").css("display", "none").attr("tabindex", "-1");
                loaded = 0;
                document.getElementById("grid").replaceChildren();
                loadMore();
                return;
            }

            document.getElementById("grid").replaceChildren();
            const fragment = document.createDocumentFragment();

            allData
                .filter(item => item.title.toLowerCase().includes(keyword))
                .forEach((item, index) => {
                    const div = document.createElement("div");
                    div.className = "poster";
                    div.tabIndex = 0;
                    div.dataset.index = allData.indexOf(item);
                    div.dataset.title = item.title;
                    div.innerHTML = `
                        <img src="${item.poster}" loading="lazy" decoding="async">
                        <div class="poster-title">${item.title}</div>
                    `;
                    fragment.appendChild(div);
                });

            document.getElementById("grid").appendChild(fragment);
        }, 200);
    });

    // ========================================================
    // RENDER LANJUTKAN MENONTON (SERIES)
    // ========================================================
    function renderContinueWatching() {
        const container = $("#containerContinue");
        container.empty();
        let adaData = false;

        allData.forEach((series, seriesIndex) => {
            series.episodes.forEach((ep, epIndex) => {
                // Generate Film ID Unik: JudulSeries_Episode
                const uniqueId = series.title + "_" + ep.ep;
                
                if (typeof Android !== "undefined" && Android.getProgressVideo) {
                    try {
                        const dataStr = Android.getProgressVideo(uniqueId);
                        if (dataStr) {
                            const dataData = JSON.parse(dataStr);
                            if (dataData && dataData.durasi > 0) {
                                const persentase = (dataData.posisi / dataData.durasi) * 100;
                                
                                // Jika ditonton antara 1% sampai 95%
                                if (persentase > 1 && persentase < 95) {
                                    adaData = true;
                                    const barWidth = persentase.toFixed(1) + "%";
                                    
                                    const card = $(`
                                        <div class="poster" tabindex="0" data-title="${series.title}">
                                            <img src="${series.poster}" loading="lazy">
                                            <span class="time-badge">${ep.ep}</span>
                                            <div class="progress-container">
                                                <div class="progress-bar-red" style="width: ${barWidth}"></div>
                                            </div>
                                            <div class="poster-title">${series.title}</div>
                                        </div>
                                    `);

                                    card.on('click', function() {
                                        playAndSave(ep.url, epIndex, series.title, ep.ep);
                                    });

                                    container.append(card);
                                }
                            }
                        }
                    } catch(e) {}
                }
            });
        });

        if (adaData) { 
            $("#continueTitle").show(); 
        } else { 
            $("#continueTitle").hide(); 
        }
    }

    // ========================================================
    // PARSER PINTAR: HAPUS TITIK PADA JUDUL & AUTO-SORT EPISODE
    // ========================================================
    function parseM3U(text) {
        const lines = text.split('\n');
        const seriesMap = new Map();

        let currentPoster = "";
        let currentTitle = "";
        let currentEpName = "";

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();

            if (line.startsWith("#EXTINF")) {
                const logoMatch = line.match(/tvg-logo=["']([^"']+)["']/);
                currentPoster = logoMatch ? logoMatch[1] : "";

                const groupMatch = line.match(/group-title=["']([^"']+)["']/);
                const groupName = groupMatch ? groupMatch[1].trim() : "";

                const commaIndex = line.lastIndexOf(',');
                let rawTitle = commaIndex > -1 ? line.substring(commaIndex + 1).trim() : "Unknown Title";

                if (!groupName || groupName.toLowerCase() === "film" || groupName.toLowerCase() === "series") {
                    const seasonEpRegex = /(S\d+E\d+|S\d+\s*E\d+|E\d+|Episode\s*\d+)/i;
                    const match = rawTitle.match(seasonEpRegex);

                    if (match) {
                        const splitIndex = match.index;
                        currentTitle = rawTitle.substring(0, splitIndex).trim();
                        currentEpName = match[0].toUpperCase();
                    } else if (rawTitle.includes("-")) {
                        let parts = rawTitle.split("-");
                        currentTitle = parts[0].trim();
                        currentEpName = parts.slice(1).join("-").trim();
                    } else {
                        currentTitle = rawTitle.trim();
                        currentEpName = "Play";
                    }

                } else {
                    currentTitle = groupName;
                    currentEpName = rawTitle;
                }

                currentTitle = currentTitle.replace(/\./g, ' ').replace(/\s+/g, ' ').trim();
            }
            else if (line.startsWith("http")) { 
                const fallbackPoster = "https://via.placeholder.com/300x400?text=No+Poster";
                
                if (!seriesMap.has(currentTitle)) {
                    seriesMap.set(currentTitle, {
                        title: currentTitle,
                        poster: currentPoster || fallbackPoster,
                        episodes: []
                    });
                } else {
                    let existing = seriesMap.get(currentTitle);
                    if ((!existing.poster || existing.poster === fallbackPoster) && currentPoster) {
                        existing.poster = currentPoster;
                    }
                }
                
                seriesMap.get(currentTitle).episodes.push({
                    ep: currentEpName,
                    url: line
                });
            }
        }
        
        const result = Array.from(seriesMap.values());
        result.forEach(item => {
            item.episodes.sort((a, b) => {
                let numA = a.ep.match(/\d+/g);
                let numB = b.ep.match(/\d+/g);
                if (numA && numB) {
                    let lastA = parseInt(numA[numA.length - 1], 10);
                    let lastB = parseInt(numB[numB.length - 1], 10);
                    return lastA - lastB;
                }
                return a.ep.localeCompare(b.ep, undefined, { numeric: true, sensitivity: 'base' });
            });
        });

        return result;
    }

    // ========================================================
    // FETCH M3U DATA
    // ========================================================
    fetch(playlistUrl)
    .then(response => response.text()) 
    .then(text => {

        allData = parseM3U(text); 

        loadMore();
        renderContinueWatching();
        
        document.getElementById("grid").addEventListener("click", function(e){
            const poster = e.target.closest(".poster");
            if(!poster) return;
            openModal(Number(poster.dataset.index));
        });
        
        setTimeout(() => {
            const popupElement = document.getElementById("popup");
            if (popupElement && window.getComputedStyle(popupElement).display === "none") {
                document.querySelector(".poster")?.focus();
            }
        }, 600);

        checkLastSession();
    });

    function loadMore(){
        const fragment = document.createDocumentFragment();
        const end = Math.min(loaded + LOAD_SIZE, allData.length);

        for(let i = loaded; i < end; i++){
            const item = allData[i];
            const div = document.createElement("div");
            div.className = "poster";
            div.tabIndex = 0;
            div.dataset.title = item.title;
            div.dataset.index = i;
            div.dataset.pos = i;
            div.innerHTML = `
                <img src="${item.poster}" loading="lazy" decoding="async">
                <div class="poster-title">${item.title}</div>
            `;
            fragment.appendChild(div);
        }
        document.getElementById("grid").appendChild(fragment);
        loaded = end;
    }    
       
    window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
            if (loaded < allData.length) {
                loadMore();
            }
        }
    });

    document.addEventListener("focusin", () => {
        const posters = document.querySelectorAll(".poster");
        const index = Array.from(posters).indexOf(document.activeElement);
        if (index >= loaded - 10 && loaded < allData.length) {
            loadMore();
        }
    }); 
        
    function openModal(index) {
        const item = allData[index];
        if (!item) return;

        const title = item.title;
        const eps = item.episodes;
        
        localStorage.setItem(pageTitle + "_status_popup", "open");
        localStorage.setItem(pageTitle + "_last_poster_title", title);
        localStorage.setItem(pageTitle + "_judul_film", title);
        
        if (typeof Android !== "undefined" && Android.setPopUpStatus) {
            Android.setPopUpStatus(true);
        }
        
        $("#modal-title").text(title);
        
        const epsListContainer = document.getElementById("eps-list");
        epsListContainer.replaceChildren();

        eps.forEach((e, epIndex) => {
            const btn = document.createElement("button");
            btn.className = "eps-btn";
            btn.tabIndex = 0;
            btn.dataset.index = epIndex;
            
            // Hitung Progres Mini Per-Episode
            const uniqueId = title + "_" + e.ep;
            let barHtml = "";
            
            if (typeof Android !== "undefined" && Android.getProgressVideo) {
                try {
                    const dataStr = Android.getProgressVideo(uniqueId);
                    if (dataStr) {
                        const dataData = JSON.parse(dataStr);
                        if (dataData && dataData.durasi > 0) {
                            const p = Math.min(100, Math.max(0, (dataData.posisi / dataData.durasi) * 100));
                            if (p > 1) {
                                barHtml = `<div class="eps-progress-bg"><div class="eps-progress-fill" style="width:${p.toFixed(1)}%"></div></div>`;
                            }
                        }
                    }
                } catch(err) {}
            }

            btn.innerHTML = `<div>${e.ep}</div>${barHtml}`;

            btn.onclick = function() {
                playAndSave(e.url, epIndex, title, e.ep);
            };

            epsListContainer.appendChild(btn);
        });
        
        $("#popup").css("display", "flex");
        
        const lastIdx = localStorage.getItem(pageTitle + "_last_eps_" + title) || 0;
        setTimeout(() => { $(`.eps-btn[data-index="${lastIdx}"]`).focus(); }, 150);
    }

    // ========================================================
    // PERBAIKAN: AKTIFKAN FITUR PLAYLIST NEXT & PREVIOUS
    // ========================================================
    function playAndSave(url, index, title, epName = "") {
        localStorage.setItem(pageTitle + "_last_eps_" + title, index);
        
        // Cari data series yang sedang dibuka
        const currentSeries = allData.find(item => item.title === title);

        if (currentSeries && currentSeries.episodes && currentSeries.episodes.length > 0) {
            // Gabungkan seluruh URL episode dengan pembatas titik koma (;)
            const allUrls = currentSeries.episodes.map(e => e.url).join(";");
            
            // Gabungkan seluruh ID episode dengan pembatas titik koma (;)
            const allIds = currentSeries.episodes.map(e => title + "_" + e.ep).join(";");

            // Panggil interface Android untuk Playlist Series
            if (typeof Android !== "undefined" && Android.playSeriesPlaylist) {
                Android.playSeriesPlaylist(
                    allUrls, // Seluruh URL episode
                    allIds,  // Seluruh ID episode
                    index,   // Urutan episode yang diklik
                    "", "", "", "", ""
                );
                return;
            }
        }

        // Fallback jika tidak menggunakan playlist
        const filmId = title + "_" + (epName || "Eps" + (index + 1));
        if (typeof Android !== "undefined" && Android.playVideoWithId) {
            Android.playVideoWithId(url, filmId);
        } else if (typeof Android !== "undefined" && Android.playVideo) {
            Android.playVideo(url);
        } else {
            window.open(url, "_blank");
        }
    }

    window.closePopup = function() { 
        $("#popup").css("display", "none"); 
        
        localStorage.removeItem(pageTitle + "_status_popup");
        localStorage.removeItem(pageTitle + "_judul_film");
        localStorage.removeItem(pageTitle + "_eps_data");

        const lastTitle = localStorage.getItem(pageTitle + "_last_poster_title");
        if (lastTitle) {
            setTimeout(() => {
                $(`.poster[data-title="${lastTitle}"]`).focus();
            }, 150);
        }

        if (typeof Android !== "undefined" && Android.setPopUpStatus) {
            Android.setPopUpStatus(false);
        }

        // Refresh section Lanjutkan Menonton saat popup ditutup
        renderContinueWatching();
    };

    function checkLastSession() {
        if (localStorage.getItem(pageTitle + "_status_popup") !== "open") return;
        const title = localStorage.getItem(pageTitle + "_judul_film");
        if (!title) return;
        const index = allData.findIndex(item => item.title === title);
        if (index !== -1) {
            openModal(index);
        }
    }
</script>

<script>
    const soundClick = new Audio('https://github.com/ukie432/mrzybfilm/raw/refs/heads/main/click.wav'); 

    function playSound() {
        soundClick.currentTime = 0;
        soundClick.play().catch(e => console.log("Menunggu interaksi remote..."));
    }

    document.addEventListener('focus', function(e) {
        if ($(e.target).hasClass('poster') || $(e.target).hasClass('eps-btn') || $(e.target).hasClass('close-x') || e.target.id === 'clear-btn' || e.target.id === 'search-box') {
            playSound();
        }
    }, true);
</script>
</body>
</html>
