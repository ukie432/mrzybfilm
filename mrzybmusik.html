<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Musik</title>
  <style>
    :root {
      --accent-color: #1ed760; /* Warna default */
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    .accent-bg {
      background-color: var(--accent-color);
    }

    .accent-text {
      color: var(--accent-color);
    }

    /* Progress Bar */
    #bottomBar, #drawerBar {
      height: 4px;
      background-color: var(--accent-color);
      width: 0%;
      transition: width 0.2s ease;
    }

    /* Pilihan Warna Tema */
    .theme-picker {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .color-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Pemilih Tema Warna -->
  <div class="theme-picker">
    <div class="color-btn" style="background: #1ed760;" onclick="changeTheme('#1ed760')"></div>
    <div class="color-btn" style="background: #ff4757;" onclick="changeTheme('#ff4757')"></div>
    <div class="color-btn" style="background: #1e90ff;" onclick="changeTheme('#1e90ff')"></div>
    <div class="color-btn" style="background: #ffa500;" onclick="changeTheme('#ffa500')"></div>
    <div class="color-btn" style="background: #9b59b6;" onclick="changeTheme('#9b59b6')"></div>
  </div>

  <h2 class="accent-text">Pemutar Musik</h2>
  <div id="progressTimeDuration">00:00 / 00:00</div>
  
  <div style="background: #333; height: 4px; width: 100%; margin-top: 10px;">
    <div id="bottomBar"></div>
  </div>

  <audio id="media-player" preload="auto"></audio>

  <script>
    var mediaPlayer;
    var activeSongsList = [];
    var currentIndex = 0;
    var isPlaying = false;
    var repeatMode = 0;
    var watchdogTimer = null;

    // 1. FUNGSI GANTI TEMA & SIMPAN KE LOCALSTORAGE
    function changeTheme(color) {
      document.documentElement.style.setProperty("--accent-color", color);
      try {
        localStorage.setItem("saved_accent_color", color);
      } catch (e) {
        console.error("Gagal menyimpan tema:", e);
      }
    }

    // 2. WATCHDOG RECOVERY
    function startAudioWatchdog() {
      stopAudioWatchdog();
      watchdogTimer = setInterval(function() {
        if (isPlaying && mediaPlayer && mediaPlayer.paused) {
          console.warn("Watchdog: Audio macet/stuck. Memulihkan koneksi...");
          mediaPlayer.load();
          mediaPlayer.play().catch(function(e) { console.error(e); });
        }
      }, 5000);
    }

    function stopAudioWatchdog() {
      if (watchdogTimer) {
        clearInterval(watchdogTimer);
        watchdogTimer = null;
      }
    }

    // 3. BUFFER CLEANUP
    function cleanAudioBuffer() {
      if (mediaPlayer) {
        mediaPlayer.pause();
        mediaPlayer.removeAttribute('src');
        mediaPlayer.load();
      }
    }

    function playSong(index) {
      if (activeSongsList.length === 0 || !activeSongsList[index]) return;
      
      cleanAudioBuffer(); // Bersihkan RAM sebelum memuat lagu baru
      
      currentIndex = index;
      mediaPlayer.src = activeSongsList[currentIndex].url;
      mediaPlayer.play().then(function() {
        isPlaying = true;
        startAudioWatchdog();
      }).catch(function(e) {
        console.error("Gagal pemutaran:", e);
      });
    }

    function nextSong() {
      if (activeSongsList.length === 0) return;
      var nextIdx = (currentIndex + 1) % activeSongsList.length;
      playSong(nextIdx);
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      var m = Math.floor(seconds / 60);
      var s = Math.floor(seconds % 60);
      return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }

    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', function() { mediaPlayer.play(); isPlaying = true; });
        navigator.mediaSession.setActionHandler('pause', function() { mediaPlayer.pause(); isPlaying = false; stopAudioWatchdog(); });
        navigator.mediaSession.setActionHandler('nexttrack', function() { nextSong(); });
      }
    }

    function loadM3UPlaylist() {
      // Fungsi memuat playlist M3U Anda
    }

    // 4. MEMUAT TEMA SAAT APLIKASI DIBUKA (WINDOW.ONLOAD)
    window.onload = function() {
      mediaPlayer = document.getElementById("media-player");

      // --- MUAT TEMA TERAKHIR YANG TERSIMPAN ---
      try {
        var savedColor = localStorage.getItem("saved_accent_color");
        if (savedColor) {
          document.documentElement.style.setProperty("--accent-color", savedColor);
        }
      } catch (e) {
        console.error("Gagal membaca tema:", e);
      }

      setupMediaSession();
      loadM3UPlaylist();

      // Autoplay Unlocker pada interaksi pertama (Remote / Klik)
      document.body.addEventListener('click', function unlock() {
        if (mediaPlayer) {
          mediaPlayer.play().then(function() { mediaPlayer.pause(); }).catch(function(){});
        }
        document.body.removeEventListener('click', unlock);
      }, { once: true });

      // Event listener audio
      mediaPlayer.addEventListener("error", function() {
        stopAudioWatchdog();
        setTimeout(function() {
          if (activeSongsList.length > 0) nextSong();
        }, 1000);
      });

      mediaPlayer.addEventListener("ended", function() {
        isPlaying = false;
        stopAudioWatchdog();
        if (repeatMode === 2) {
          playSong(currentIndex);
        } else {
          nextSong();
        }
      });

      mediaPlayer.addEventListener("timeupdate", function() {
        if (mediaPlayer.duration) {
          let pct = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
          document.getElementById("bottomBar").style.width = pct + "%";
          
          const drawerBar = document.getElementById("drawerBar");
          if(drawerBar) drawerBar.style.width = pct + "%";
          
          let curStr = formatTime(mediaPlayer.currentTime);
          let durStr = formatTime(mediaPlayer.duration);

          document.getElementById("progressTimeDuration").innerText = `${curStr} / ${durStr}`;
          
          const dCur = document.getElementById("drawerCurrentTime");
          const dDur = document.getElementById("drawerSongDuration");
          if(dCur) dCur.innerText = curStr;
          if(dDur) dDur.innerText = durStr;
        }
      });
    };
  </script>
</body>
</html>
