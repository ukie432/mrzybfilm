<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Musik STB & Android</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <style>
    :root {
      --accent-color: #ff4b66;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    .focusable:focus {
      outline: 3px solid var(--accent-color) !important;
      border-radius: 8px;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .cards-holder {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 15px;
    }
    .card {
      min-width: 140px;
      height: 180px;
      background: var(--card-bg);
      border-radius: 15px;
      padding: 10px;
      cursor: pointer;
      position: relative;
    }
    .card.active-album {
      border: 2px solid var(--accent-color);
    }
    .card__song-info {
      margin-top: 8px;
      font-size: 12px;
    }
    .song-list-container {
      height: calc(100vh - 320px);
      overflow-y: auto;
      padding: 0 15px;
    }
    .song-list {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--card-bg);
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .song-list__info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .song-list__info img {
      width: 40px;
      height: 40px;
      border-radius: 5px;
      object-fit: cover;
    }
    .song-list__singer {
      font-size: 12px;
      color: #aaa;
    }
    .bottom-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-top: 1px solid #222;
    }
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #333;
      cursor: pointer;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
    }
    .left-pannel__category {
      padding: 10px 15px;
      cursor: pointer;
      display: inline-block;
    }
    .left-pannel__category.active {
      color: var(--accent-color);
      font-weight: bold;
    }
    .bottom-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      z-index: 1000;
      display: none;
    }
    .nav-container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      z-index: 1001;
      display: none;
    }
  </style>
</head>
<body>

  <div id="loading">Memuat Playlist...</div>

  <!-- Audio Element -->
  <audio id="media-player" preload="auto"></audio>

  <!-- Top Navigation / Category -->
  <div style="padding: 10px; background: #181818; display: flex; align-items: center; gap: 10px;">
    <button id="btnMenu" class="focusable" onclick="navHandler()"><i class="material-icons">menu</i></button>
    <div id="catIndonesia" class="left-pannel__category active focusable" onclick="switchCategory('indonesia')">Indonesia</div>
    <div id="catEnglish" class="left-pannel__category focusable" onclick="switchCategory('english')">English</div>
    <div id="catMalaysia" class="left-pannel__category focusable" onclick="switchCategory('malaysia')">Malaysia</div>
    <div id="catHindi" class="left-pannel__category focusable" onclick="switchCategory('hindi')">Hindi</div>
    <div id="catDangdut" class="left-pannel__category focusable" onclick="switchCategory('dangdut')">Dangdut</div>
    
    <div id="searchBoxContainer" style="margin-left: auto;">
      <input type="text" id="searchInput" placeholder="Cari lagu..." onkeyup="filterSongs()" style="padding: 5px 10px; border-radius: 5px; border: none;">
    </div>
  </div>

  <!-- Cards / Album Holder -->
  <div class="cards-holder" id="cardsHolder"></div>

  <!-- Songs List -->
  <div class="song-list-container" id="listView"></div>

  <!-- Bottom Player Controls -->
  <div class="bottom-player">
    <div class="progress-bar-container focusable" id="bottomProgress" tabindex="0" onclick="seekByClick(event, this)">
      <div class="progress-bar" id="bottomBar"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="btnOpenDrawer" class="focusable" onclick="drawerHandler()"><i class="material-icons">keyboard_arrow_up</i></button>
      <div>
        <div id="bottomSongName" style="font-weight: bold; font-size: 14px;">Pilih Lagu</div>
        <div id="bottomSingerName" style="font-size: 12px; color: #aaa;">-</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 15px;">
      <span id="progressTimeDuration" style="font-size: 12px; color: #aaa;">00:00 / 00:00</span>
      <button id="btnShuffle" class="focusable" onclick="toggleShuffle()" style="color:#888;"><i class="material-icons">shuffle</i></button>
      <button class="focusable" onclick="prevSong()"><i class="material-icons">skip_previous</i></button>
      <button id="playBtn" class="focusable" onclick="playPause()"><i class="material-icons">play_arrow</i></button>
      <button class="focusable" onclick="nextSong()"><i class="material-icons">skip_next</i></button>
      <button id="btnRepeat" class="focusable" onclick="toggleRepeat()" style="color:#888;"><i class="material-icons">repeat</i></button>
    </div>
  </div>

  <!-- Bottom Drawer Player View -->
  <div class="bottom-drawer">
    <div class="drawer-holder" style="padding: 20px; height: 100%;">
      <button id="btnCloseDrawer" class="focusable" onclick="drawerHandler()"><i class="material-icons">keyboard_arrow_down</i></button>
      <div style="text-align: center; margin-top: 20px;">
        <div id="songAlbumArt" style="width: 180px; height: 180px; margin: 0 auto; background-size: cover; border-radius: 15px;"></div>
        <h2 id="drawerSongName" style="margin: 15px 0 5px 0;">-</h2>
        <p id="drawerSingerName" style="color: #aaa; margin: 0;">-</p>
      </div>

      <canvas id="visualizerCanvas" style="width: 100%; height: 60px; margin-top: 20px;"></canvas>

      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-top: 10px;">
        <span id="drawerCurrentTime">00:00</span>
        <span id="drawerSongDuration">00:00</span>
      </div>
      <div class="progress-bar-container focusable" style="position:relative; height:6px; margin-top:5px;" onclick="seekByClick(event, this)">
        <div class="progress-bar" id="drawerBar"></div>
      </div>

      <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px;">
        <button class="focusable" onclick="prevSong()"><i class="material-icons" style="font-size: 36px;">skip_previous</i></button>
        <button id="drawerPlay" class="focusable" onclick="playPause()"><i class="material-icons" style="font-size: 48px;">play_arrow</i></button>
        <button class="focusable" onclick="nextSong()"><i class="material-icons" style="font-size: 36px;">skip_next</i></button>
      </div>
    </div>
  </div>

  <!-- Side Navigation Drawer -->
  <div class="nav-container">
    <div class="nav" style="padding: 20px; width: 0vw; background: #222; height: 100%;">
      <h3>Tema Warna</h3>
      <div class="themes" style="display:none; gap:10px;">
        <div class="theme focusable" style="width:30px; height:30px; background:#ff4b66; border-radius:50%;" onclick="changeTheme('#ff4b66')"></div>
        <div class="theme focusable" style="width:30px; height:30px; background:#00bcd4; border-radius:50%;" onclick="changeTheme('#00bcd4')"></div>
        <div class="theme focusable" style="width:30px; height:30px; background:#4caf50; border-radius:50%;" onclick="changeTheme('#4caf50')"></div>
      </div>
    </div>
  </div>

  <!-- SCRIPT UTAMA PERBAIKAN -->
  <script>
    var mediaPlayer;
    var isPlaying = false;
    var isShuffle = false;
    var repeatMode = 0; 
    var retryCount = 0;
    
    // Watchdog Timer Variable
    var watchdogTimer = null;
    var lastCurrentTime = -1;

    var musicData = { indonesia: [], english: [], malaysia: [], hindi: [], dangdut: [] };
    var albumsList = [];        
    var currentAlbumIndex = 0;  
    var activeSongsList = [];   
    var currentIndex = 0;       
    var currentCategory = 'indonesia';
    
    var isNavOpen = false;
    var isDrawerOpen = false;
    var animationId;

    // --- WATCHDOG SYSTEM (MEMAKSA KONTINUITAS AUDIO) ---
    function startWatchdog() {
      stopWatchdog();
      watchdogTimer = setInterval(function() {
        if (isPlaying && mediaPlayer) {
          // Jika status isPlaying = true tetapi player ter-pause ATAU currentTime tidak berjalan (stuck)
          if (mediaPlayer.paused || mediaPlayer.currentTime === lastCurrentTime) {
            console.log("Watchdog: Playback macet/berhenti. Memaksa pindah lagu...");
            stopWatchdog();
            nextSong();
          } else {
            lastCurrentTime = mediaPlayer.currentTime;
          }
        }
      }, 3500); // Evaluasi setiap 3.5 detik
    }

    function stopWatchdog() {
      if (watchdogTimer) {
        clearInterval(watchdogTimer);
        watchdogTimer = null;
      }
      lastCurrentTime = -1;
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const btn = document.getElementById("btnShuffle");
      btn.style.color = isShuffle ? "var(--accent-color)" : "#888";
    }

    function toggleRepeat() {
      repeatMode = (repeatMode + 1) % 3;
      const btn = document.getElementById("btnRepeat");
      if (repeatMode === 0) {
        btn.innerText = "repeat";
        btn.style.color = "#888"; 
      } else if (repeatMode === 1) {
        btn.innerText = "repeat";
        btn.style.color = "var(--accent-color)"; 
      } else if (repeatMode === 2) {
        btn.innerText = "repeat_one";
        btn.style.color = "var(--accent-color)"; 
      }
    }

    window.tutupPopUpPoster = function() {
        if (isDrawerOpen) { drawerHandler(); return true; } 
        else if (isNavOpen) { navHandler(); return true; }
        return false;
    };

    function updateAndroidGembok() {
        if (typeof Android !== "undefined" && Android.setPopUpStatus) {
            Android.setPopUpStatus(isDrawerOpen || isNavOpen);
        }
    }

    window.addEventListener('keydown', function(event) {
        const code = event.keyCode || event.which;
        if (code === 4 || code === 27 || code === 10009 || event.key === "Backspace" || event.key === "GoBack") {
            if (isDrawerOpen || isNavOpen) {
                event.preventDefault();
                event.stopPropagation();
                window.tutupPopUpPoster();
                return false;
            }
        }
    }, true);

    function getVisibleFocusables() {
      return Array.from(document.querySelectorAll('.focusable')).filter(el => {
        const style = window.getComputedStyle(el);
        const rect = el.getBoundingClientRect();
        if (isDrawerOpen && !el.closest('.bottom-drawer')) return false;
        if (isNavOpen && !el.closest('.nav-container')) return false;
        return rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden' && style.display !== 'none';
      });
    }

    function navigateSpatial(direction) {
      const focusables = getVisibleFocusables();
      const current = document.activeElement;

      if (!current || !focusables.includes(current)) {
        if (focusables.length > 0) focusables[0].focus();
        return;
      }

      if (!isDrawerOpen) {
        if (current.id === 'btnOpenDrawer' && direction === 'right') {
          const bProgress = document.getElementById('bottomProgress');
          if (bProgress) { bProgress.focus(); return; }
        }
        if (current.id === 'bottomProgress') {
          if (direction === 'right') {
            const pBtn = document.getElementById('playBtn');
            if (pBtn) { pBtn.focus(); return; }
          } else if (direction === 'left') {
            const btnOpen = document.getElementById('btnOpenDrawer');
            if (btnOpen) { btnOpen.focus(); return; }
          }
        }
        if (current.id === 'playBtn' && direction === 'left') {
          const bProgress = document.getElementById('bottomProgress');
          if (bProgress) { bProgress.focus(); return; }
        }
      }

      if (isDrawerOpen && current.classList.contains('progress-bar-container')) {
        if (direction === 'left') { seekRelative(-5); return; } 
        else if (direction === 'right') { seekRelative(5); return; }
      }

      if (direction === 'down' && current.classList.contains('card')) {
        const firstSong = document.querySelector('#listView .song-list.focusable');
        if (firstSong) {
          firstSong.focus();
          firstSong.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          return;
        }
      }

      if (direction === 'up' && current.classList.contains('song-list')) {
        const songItems = Array.from(document.querySelectorAll('#listView .song-list.focusable'));
        if (songItems.indexOf(current) === 0) {
          const activeCard = document.querySelector('.card.active-album.focusable') || document.querySelector('.card.focusable');
          if (activeCard) {
            activeCard.focus();
            activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            return;
          }
        }
      }

      const cRect = current.getBoundingClientRect();
      const cCenter = { x: cRect.left + cRect.width / 2, y: cRect.top + cRect.height / 2 };

      let bestCandidate = null;
      let minDistance = Infinity;

      focusables.forEach(el => {
        if (el === current) return;
        const eRect = el.getBoundingClientRect();
        const eCenter = { x: eRect.left + eRect.width / 2, y: eRect.top + eRect.height / 2 };

        let isValid = false;
        if (direction === 'left' && eCenter.x < cCenter.x - 5) isValid = true;
        if (direction === 'right' && eCenter.x > cCenter.x + 5) isValid = true;
        if (direction === 'up' && eCenter.y < cCenter.y - 5) isValid = true;
        if (direction === 'down' && eCenter.y > cCenter.y + 5) isValid = true;

        if (isValid) {
          const dx = eCenter.x - cCenter.x;
          const dy = eCenter.y - cCenter.y;
          let dist = (direction === 'left' || direction === 'right') 
            ? Math.abs(dx) + Math.abs(dy) * 2 
            : Math.abs(dy) + Math.abs(dx) * 4;

          if (dist < minDistance) {
            minDistance = dist;
            bestCandidate = el;
          }
        }
      });

      if (bestCandidate) {
        bestCandidate.focus();
        if (bestCandidate.id === "searchBoxContainer") {
          document.getElementById("searchInput").focus();
        }
        bestCandidate.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }
    }

    document.addEventListener("keydown", function(e) {
      const code = e.keyCode || e.which;
      if (code === 4 || code === 27 || code === 10009 || e.key === "Backspace") return;

      switch(e.key) {
        case "ArrowRight":
          if (document.activeElement.id !== "searchInput") { e.preventDefault(); navigateSpatial('right'); }
          break;
        case "ArrowLeft":
          if (document.activeElement.id !== "searchInput") { e.preventDefault(); navigateSpatial('left'); }
          break;
        case "ArrowDown":
          e.preventDefault(); navigateSpatial('down');
          break;
        case "ArrowUp":
          e.preventDefault(); navigateSpatial('up');
          break;
        case "Enter":
        case "OK":
          if (document.activeElement && document.activeElement.classList.contains('focusable')) {
            document.activeElement.click();
          }
          break;
      }
    });

    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', function() { playPause(); });
        navigator.mediaSession.setActionHandler('pause', function() { playPause(); });
        navigator.mediaSession.setActionHandler('previoustrack', function() { prevSong(); });
        navigator.mediaSession.setActionHandler('nexttrack', function() { nextSong(); });
      }
    }

    function updateMediaSessionInfo(song) {
      if ('mediaSession' in navigator && song) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.name || 'Musik',
          artist: song.singer || 'Unknown Artist',
          artwork: [{ src: song.albumArt || 'https://via.placeholder.com/300', sizes: '300x300', type: 'image/png' }]
        });
      }
    }

    var numBars = 20;
    var barPhases = Array.from({length: numBars}, () => Math.random() * Math.PI * 2);

    function renderVisualizer() {
      if (animationId) cancelAnimationFrame(animationId);
      if (!isDrawerOpen) return;

      const canvas = document.getElementById("visualizerCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      function draw() {
        if (!isDrawerOpen) return;
        animationId = requestAnimationFrame(draw);
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / numBars) * 0.65;
        const gap = (canvas.width / numBars) * 0.35;
        const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim() || '#ff4b66';

        for (let i = 0; i < numBars; i++) {
          let heightPct = 0.15;
          if (isPlaying) {
            barPhases[i] += 0.08 + (i % 3) * 0.02;
            heightPct = 0.2 + (Math.sin(barPhases[i]) * 0.35 + Math.cos(barPhases[i] * 1.5) * 0.35 + 0.35);
          }
          let barHeight = heightPct * canvas.height;
          let x = i * (barWidth + gap) + gap / 2;

          ctx.fillStyle = accentColor;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(x, canvas.height - barHeight, barWidth, barHeight, [4, 4, 0, 0]);
          } else {
            ctx.rect(x, canvas.height - barHeight, barWidth, barHeight);
          }
          ctx.fill();
        }
      }
      draw();
    }

    function parseM3U(m3uContent) {
      const lines = m3uContent.split(/\r?\n/);
      let currentSong = null;

      musicData = { indonesia: [], english: [], malaysia: [], hindi: [], dangdut: [] };

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          currentSong = {};
          
          const catMatch = line.match(/group-title="([^"]+)"/i);
          currentSong.category = catMatch ? catMatch[1].toLowerCase() : 'indonesia';

          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          currentSong.albumArt = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/300';

          const commaIndex = line.indexOf(',');
          if (commaIndex !== -1) {
            const rawTitle = line.substring(commaIndex + 1).trim();
            if (rawTitle.includes('-')) {
              const parts = rawTitle.split('-');
              currentSong.singer = parts[0].trim();
              currentSong.name = parts.slice(1).join('-').trim();
            } else {
              currentSong.singer = "Berbagai Artis";
              currentSong.name = rawTitle;
            }
          } else {
            currentSong.singer = "Berbagai Artis";
            currentSong.name = "Tanpa Judul";
          }
        } 
        else if (line.length > 0 && !line.startsWith('#')) {
          if (currentSong) {
            currentSong.url = line;
            const cat = currentSong.category;
            if (musicData[cat]) {
              musicData[cat].push(currentSong);
            } else {
              musicData.indonesia.push(currentSong);
            }
            currentSong = null;
          }
        }
      });
    }

    function loadM3UPlaylist() {
      fetch('https://raw.githubusercontent.com/ukie432/mrzybfilm/refs/heads/main/musikku.m3u')
        .then(res => {
          if (!res.ok) throw new Error("File M3U8 tidak ditemukan");
          return res.text();
        })
        .then(textData => {
          parseM3U(textData);
          switchCategory('indonesia');
          document.getElementById("loading").style.display = "none";

          setTimeout(() => {
            const firstCard = document.querySelector('.card.focusable');
            if(firstCard) firstCard.focus();
          }, 300);
        })
        .catch(err => {
          document.getElementById("loading").innerHTML = "<p style='padding:20px;'>Gagal memuat playlist.m3u!<br>Pastikan koneksi internet tersedia.</p>";
        });
    }

    function groupSongsIntoAlbums(rawSongs) {
      let albumMap = {};

      rawSongs.forEach(song => {
        let artistName = song.singer || "Berbagai Artis";
        
        if (!albumMap[artistName]) {
          albumMap[artistName] = {
            title: artistName,
            singer: artistName,
            albumArt: song.albumArt, 
            songs: []
          };
        }
        albumMap[artistName].songs.push(song);
      });

      return Object.values(albumMap);
    }

    function switchCategory(catKey) {
      currentCategory = catKey;
      let rawSongs = musicData[catKey] || [];
      document.getElementById("searchInput").value = "";

      albumsList = groupSongsIntoAlbums(rawSongs);
      renderAlbums();

      if (albumsList.length > 0) {
        selectAlbum(0);
      } else {
        activeSongsList = [];
        renderSongList();
      }

      $('.left-pannel__category').removeClass('active');
      const catMap = {
        'indonesia': '#catIndonesia',
        'english': '#catEnglish',
        'malaysia': '#catMalaysia',
        'hindi': '#catHindi',
        'dangdut': '#catDangdut'
      };
      if(catMap[catKey]) $(catMap[catKey]).addClass('active');
    }

    function renderAlbums() {
      let cardsHtml = "";

      if(albumsList.length === 0) {
        cardsHtml = "<div style='padding:20px; color:#aaa;'>Tidak ada album.</div>";
      } else {
        albumsList.forEach((album, i) => {
          let activeClass = (i === currentAlbumIndex) ? "active-album" : "";
          cardsHtml += `
            <div class="card focusable ${activeClass}" id="albumCard_${i}" tabindex="0" onclick="selectAlbum(${i});">
              <img src="${album.albumArt}" style="width:100%; height:100%; object-fit:cover; border-radius:15px;" />
              <div class="card__song-info">
                <div class="card__song-info__name">${album.title}</div>
                <div class="card__song-info__singer">${album.songs.length} Lagu</div>
              </div>
            </div>`;
        });
      }

      document.getElementById("cardsHolder").innerHTML = cardsHtml;
    }

    function selectAlbum(index) {
      currentAlbumIndex = index;

      $('.card').removeClass('active-album');
      $(`#albumCard_${index}`).addClass('active-album');

      if (albumsList[index]) {
        activeSongsList = albumsList[index].songs;
      } else {
        activeSongsList = [];
      }

      renderSongList();
    }

    function renderSongList() {
      let listHtml = "";

      if(activeSongsList.length === 0) {
        listHtml = "<div style='padding:20px; color:#aaa;'>Lagu tidak ditemukan.</div>";
      } else {
        activeSongsList.forEach((song, i) => {
          listHtml += `
            <div class="song-list focusable" tabindex="0" onclick="playSong(${i});">
              <div class="song-list__info">
                <img src="${song.albumArt}">
                <div>
                  <div><b>${song.name}</b></div>
                  <div class="song-list__singer">${song.singer}</div>
                </div>
              </div>
              <i class="material-icons" style="color:rgba(255,255,255,0.4);">play_circle_outline</i>
            </div>`;
        });
      }

      document.getElementById("listView").innerHTML = listHtml;
    }

    function filterSongs() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      let rawSongs = musicData[currentCategory] || [];
      
      if (!query) {
        albumsList = groupSongsIntoAlbums(rawSongs);
      } else {
        let allSongs = [].concat(
          musicData.indonesia || [],
          musicData.english || [],
          musicData.malaysia || [],
          musicData.hindi || [],
          musicData.dangdut || []
        );

        let filtered = allSongs.filter(song => 
          song.name.toLowerCase().includes(query) || 
          song.singer.toLowerCase().includes(query)
        );

        albumsList = groupSongsIntoAlbums(filtered);
      }
      
      renderAlbums();
      if (albumsList.length > 0) {
        selectAlbum(0);
      } else {
        activeSongsList = [];
        renderSongList();
      }
    }

    function seekRelative(seconds) {
      if (mediaPlayer && mediaPlayer.duration) {
        let newTime = mediaPlayer.currentTime + seconds;
        if (newTime < 0) newTime = 0;
        if (newTime > mediaPlayer.duration) newTime = mediaPlayer.duration;
        mediaPlayer.currentTime = newTime;
      }
    }

    function seekByClick(event, element) {
      if (mediaPlayer && mediaPlayer.duration) {
        const rect = element.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const width = rect.width;
        let targetTime = (clickX / width) * mediaPlayer.duration;
        mediaPlayer.currentTime = targetTime;
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === Infinity) return "00:00";
      let m = Math.floor(seconds / 60);
      let s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function playSong(index) {
      currentIndex = index;
      const song = activeSongsList[currentIndex];
      if(!song) return;

      stopWatchdog();

      // Clear/Flush Buffer Audio untuk cegah Memory Leak
      mediaPlayer.pause();
      mediaPlayer.removeAttribute('src');
      mediaPlayer.load();

      mediaPlayer.src = song.url;

      document.getElementById("bottomSongName").innerText = song.name;
      document.getElementById("bottomSingerName").innerText = song.singer;
      $("#drawerSongName").text(song.name);
      $("#drawerSingerName").text(song.singer);
      $("#songAlbumArt").css("background-image", "url(" + song.albumArt + ")");

      var playPromise = mediaPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(_ => {
          isPlaying = true;
          document.getElementById("playBtn").innerText = "pause";
          $("#drawerPlay").text("pause");
          updateMediaSessionInfo(song);
          startWatchdog(); // Jalankan watchdog
        }).catch(error => {
          // Jika Autoplay diblokir OS / WebView Android, paksa ke lagu berikutnya secara otomatis
          isPlaying = false;
          console.log("Autoplay diblokir:", error);
          setTimeout(function() {
            nextSong();
          }, 1200);
        });
      }
    }

    function playPause() {
      if(!mediaPlayer.src && activeSongsList.length > 0) {
        playSong(0);
        return;
      }
      if (isPlaying) {
        stopWatchdog();
        mediaPlayer.pause();
        document.getElementById("playBtn").innerText = "play_arrow";
        $("#drawerPlay").text("play_arrow");
        isPlaying = false;
      } else {
        mediaPlayer.play().then(_ => {
          isPlaying = true;
          document.getElementById("playBtn").innerText = "pause";
          $("#drawerPlay").text("pause");
          startWatchdog();
        }).catch(err => {});
      }
    }

    function nextSong() {
      if(activeSongsList.length === 0) return;
      
      if (isShuffle) {
        let randomIndex = Math.floor(Math.random() * activeSongsList.length);
        playSong(randomIndex);
      } else {
        let nextIndex = (currentIndex + 1) % activeSongsList.length;
        playSong(nextIndex);
      }
    }

    function prevSong() {
      if(activeSongsList.length === 0) return;
      let prevIndex = (currentIndex - 1 + activeSongsList.length) % activeSongsList.length;
      playSong(prevIndex);
    }

    function drawerHandler() {
      if (isDrawerOpen) {
        if (animationId) cancelAnimationFrame(animationId);
        $(".bottom-drawer").animate({ height: "0" }, 300, function () {
          isDrawerOpen = false;
          $(".bottom-drawer").hide();
          updateAndroidGembok();
          document.getElementById("btnOpenDrawer").focus();
        });
      } else {
        openDrawer();
      }
    }

    function openDrawer() {
      $(".bottom-drawer").show();
      const song = activeSongsList[currentIndex] || { name: "Pilih Lagu", singer: "-", albumArt: "" };
      $("#drawerSongName").text(song.name);
      $("#drawerSingerName").text(song.singer);
      $("#songAlbumArt").css("background-image", "url(" + song.albumArt + ")");
      
      $(".bottom-drawer").animate({ height: "80vh" }, 300, function () {
        isDrawerOpen = true;
        updateAndroidGembok();
        renderVisualizer();
        document.getElementById("btnCloseDrawer").focus();
      });
    }

    function navHandler() {
      if (isNavOpen) {
        $(".nav-container").animate({ width: "0vw" }, 300, function () {
          $(".nav-container").hide();
          $(".themes").hide();
          isNavOpen = false;
          updateAndroidGembok();
          document.getElementById("btnMenu").focus();
        });
      } else {
        $(".nav-container").show();
        $(".nav-container").animate({ width: "50vw" }, 300, function () {
          $(".themes").css("display", "flex");
          isNavOpen = true;
          updateAndroidGembok();
          const firstTheme = document.querySelector('.theme.focusable');
          if(firstTheme) firstTheme.focus();
        });
      }
    }

    function changeTheme(color) {
      document.documentElement.style.setProperty("--accent-color", color);
    }

    window.onload = function() {
      mediaPlayer = document.getElementById("media-player");

      setupMediaSession();
      loadM3UPlaylist();

      // Handlers saat terjadi Error / Stall pada stream audio
      mediaPlayer.addEventListener("stalled", function() {
        if (isPlaying && mediaPlayer.readyState < 3) {
          mediaPlayer.load();
          mediaPlayer.play().catch(()=>{});
        }
      });

      mediaPlayer.addEventListener("error", function() {
        stopWatchdog();
        isPlaying = false;
        setTimeout(function() {
          if (activeSongsList.length > 0) nextSong();
        }, 1000);
      });

      // Event Selesai Pemutaran Lagu (Ended Event)
      mediaPlayer.addEventListener("ended", function() {
        stopWatchdog();
        isPlaying = false;
        if (repeatMode === 2) {
          playSong(currentIndex);
        } else {
          nextSong();
        }
      });

      // Sync Progress Bar
      mediaPlayer.addEventListener("timeupdate", function() {
        if (mediaPlayer.duration) {
          let pct = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
          document.getElementById("bottomBar").style.width = pct + "%";
          
          const drawerBar = document.getElementById("drawerBar");
          if(drawerBar) drawerBar.style.width = pct + "%";
          
          let curStr = formatTime(mediaPlayer.currentTime);
          let durStr = formatTime(mediaPlayer.duration);

          document.getElementById("progressTimeDuration").innerText = `${curStr} / ${durStr}`;
          
          const dCur = document.getElementById("drawerCurrentTime");
          const dDur = document.getElementById("drawerSongDuration");
          if(dCur) dCur.innerText = curStr;
          if(dDur) dDur.innerText = durStr;
        }
      });
    };
  </script>
</body>
</html>
