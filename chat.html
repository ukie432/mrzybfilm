<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MRZYB-HT CHAT (STB LANDSCAPE)</title>
  <style>
    :root {
      --bg-main: #000000;
      --ht-bg: #121212;
      --ht-neon: #a3e635;
      --text-color: #a3e635;
      --screen-bg: #050505;
    }

    *, *:before, *:after { box-sizing: border-box; }

    body { 
      background-color: var(--bg-main); 
      color: var(--text-color); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    
    .ht-body-landscape { 
      background: var(--ht-bg); 
      border: 2px solid #ffffff; 
      border-radius: 12px; 
      padding: 12px; 
      width: 100%;
      max-width: 900px;
      height: 95vh;
      display: flex;
      gap: 12px;
      box-shadow: 0 0 10px var(--ht-neon); 
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .right-panel {
      flex: 1.8;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .screen { 
      background: var(--screen-bg); 
      border: 1px solid #ffffff; 
      box-shadow: 0 0 5px var(--ht-neon);
      padding: 12px; 
      border-radius: 6px; 
      text-align: center; 
    }
    .freq { font-size: 32px; font-weight: bold; }

    .user-list { 
      flex: 1;
      border: 1px solid #ffffff; 
      background: #080808; 
      padding: 8px; 
      border-radius: 5px; 
      font-size: 12px; 
      overflow-y: auto;
    }
    .user-names { color: #aaa; font-size: 11px; margin-top: 4px; line-height: 1.4; }

    .chat-box { 
      flex: 1;
      background: var(--screen-bg); 
      overflow-y: auto; 
      border: 1px solid #ffffff; 
      padding: 10px; 
      border-radius: 5px; 
      word-wrap: break-word; 
      font-size: 13px;
      color: #ffffff;
    }

    .input-group { display: flex; gap: 6px; }
    input { 
      flex: 1; 
      background: var(--screen-bg); 
      border: 1px solid #ffffff; 
      color: #ffffff; 
      padding: 8px; 
      border-radius: 4px; 
      font-size: 12px; 
    }
    
    input:focus, button:focus {
      outline: 2px solid var(--ht-neon);
      background: #1e293b;
    }

    button { 
      background: #222222; 
      color: var(--text-color); 
      border: 1px solid #ffffff; 
      padding: 8px 14px; 
      cursor: pointer; 
      border-radius: 4px; 
      font-size: 12px;
      font-weight: bold;
    }
    button:hover { background: #333; }
    
    .btn-clear {
      background: #7f1d1d;
      color: #fca5a5;
      font-size: 10px;
      padding: 4px 8px;
    }
    
    .btn-notif {
      background: #0284c7;
      color: #ffffff;
      font-size: 10px;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

<div class="ht-body-landscape">
  
  <div class="left-panel">
    <div class="screen">
      <div style="font-size: 10px; color: #aaa;">FREKUENSI HT (TETAP)</div>
      <div class="freq" id="freqDisplay">999.999</div>
    </div>

    <div class="input-group">
      <input type="text" id="nickInput" placeholder="Nama/Callsign (Klik/OK)">
    </div>

    <div class="input-group">
      <input type="password" id="passInput" placeholder="PIN Akses (Klik/OK)">
      <button onclick="changeFreq()">MASUK</button>
    </div>

    <div class="user-list">
      <span>Online (<span id="onlineCount">0</span>):</span>
      <div class="user-names" id="namesList">Memuat...</div>
    </div>

    <button class="btn-notif" onclick="requestNotificationPermission()">AKTIFKAN NOTIFIKASI</button>
    <button class="btn-clear" onclick="clearChatHistory()">HAPUS RIWAYAT CHAT</button>
  </div>

  <div class="right-panel">
    <div class="chat-box" id="chatBox"></div>
    <div class="input-group">
      <input type="text" id="msgInput" placeholder="Ketik pesan (Klik/OK)..." onkeypress="handleKeyPress(event)">
      <button onclick="sendText()">KIRIM</button>
    </div>
  </div>

</div>

<script>
  const WORKER_URL = "wss://my-ht-project.ukielaki8387.workers.dev";
  let ws = null;
  const currentFreq = "999.999";
  const REQUIRED_PIN = "230887";

  /* REGISTRASI SERVICE WORKER */
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', (e) => self.skipWaiting());
      self.addEventListener('activate', (e) => self.clients.claim());
      self.addEventListener('push', (e) => {
        const data = e.data ? e.data.json() : { title: 'Pesan HT Baru', body: 'Ada pesan masuk!' };
        e.waitUntil(
          self.registration.showNotification(data.title, {
            body: data.body,
            icon: 'https://cdn-icons-png.flaticon.com/512/3615/3615962.png',
            vibrate: [200, 100, 200]
          })
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    
    navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Error:', err));
  }

  function requestNotificationPermission() {
    if ('Notification' in window) {
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          alert('Notifikasi Latar Belakang Diaktifkan!');
        } else {
          alert('Izin notifikasi ditolak.');
        }
      });
    } else {
      alert('Browser/Perangkat tidak mendukung Notifikasi.');
    }
  }

  function showLocalNotification(sender, message) {
    if ('Notification' in window && Notification.permission === 'granted') {
      if (document.hidden) {
        navigator.serviceWorker.ready.then(registration => {
          registration.showNotification(`[HT] Pesan dari ${sender}`, {
            body: message,
            tag: 'ht-message',
            renotify: true
          });
        });
      }
    }
  }

  /* KONTROL KEYBOARD VIRTUAL PADA STB */
  // Paksa pemanggilan keyboard saat elemen mendapat fokus atau diklik via tombol remote OK
  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && this.id !== 'msgInput') {
        this.blur(); // Tutup keyboard saat tekan enter selain kolom chat
      }
    });
    
    input.addEventListener('click', function() {
      this.focus();
    });
  });

  function isCurrentChannelAuthenticated() {
    const inputPass = document.getElementById('passInput').value.trim();
    const savedPass = localStorage.getItem('ht_pass');
    return (inputPass === REQUIRED_PIN || savedPass === REQUIRED_PIN);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedNick = localStorage.getItem('ht_nick');
    const savedPass = localStorage.getItem('ht_pass') || "";

    if (savedNick) document.getElementById('nickInput').value = savedNick;
    if (savedPass) document.getElementById('passInput').value = savedPass;

    loadSavedChatHistory();
    connect();
  });

  function connect() {
    if (ws) { ws.close(); ws = null; }
    ws = new WebSocket(WORKER_URL);

    ws.onopen = () => {
      const savedPass = localStorage.getItem('ht_pass') || '';
      const savedNick = document.getElementById('nickInput').value.trim() || 'Anonim';
      ws.send(JSON.stringify({ type: 'join', freq: currentFreq, sender: savedNick, password: savedPass }));
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!isCurrentChannelAuthenticated()) return;

        if (data.type === 'join_success') {
          document.getElementById('freqDisplay').innerText = data.freq;
        } else if (data.type === 'presence') {
          const uniqueUsers = [...new Set((data.users || []).filter(u => u && u.trim() !== ''))];
          document.getElementById('onlineCount').innerText = uniqueUsers.length;
          document.getElementById('namesList').innerHTML = uniqueUsers.join('<br>') || '-';
        } else if (data.type === 'text') {
          appendChat(`[${data.sender}]: ${data.message}`, true);
          const myNick = document.getElementById('nickInput').value.trim();
          if (data.sender !== myNick) {
            showLocalNotification(data.sender, data.message);
          }
        }
      } catch (e) {}
    };

    ws.onclose = () => setTimeout(connect, 5000);
  }

  function changeFreq() {
    const pass = document.getElementById('passInput').value.trim();
    if (pass !== REQUIRED_PIN) {
      alert("PIN Akses Salah!");
      return;
    }
    
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    localStorage.setItem('ht_nick', nick);
    localStorage.setItem('ht_pass', pass);
    
    appendChat(`[SYS] Terhubung ke frekuensi ${currentFreq}`, true);

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'join', freq: currentFreq, sender: nick, password: pass }));
    } else { connect(); }
  }

  function sendText() {
    if (!isCurrentChannelAuthenticated()) {
      alert("PIN Akses Salah!");
      return;
    }
    const input = document.getElementById('msgInput');
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    const text = input.value.trim();

    if (text && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'text', freq: currentFreq, sender: nick, message: text, msgId: Date.now() }));
      input.value = '';
    }
  }

  function handleKeyPress(e) { 
    if (e.key === 'Enter') {
      sendText();
    }
  }

  function appendChat(msg, saveToStorage = false) {
    const box = document.getElementById('chatBox');
    box.insertAdjacentHTML('beforeend', `<div>${msg}</div>`);
    box.scrollTop = box.scrollHeight;

    if (saveToStorage) {
      let history = JSON.parse(localStorage.getItem('ht_chat_history') || '[]');
      history.push(msg);
      if (history.length > 100) history.shift();
      localStorage.setItem('ht_chat_history', JSON.stringify(history));
    }
  }

  function loadSavedChatHistory() {
    const box = document.getElementById('chatBox');
    const history = JSON.parse(localStorage.getItem('ht_chat_history') || '[]');
    history.forEach(msg => {
      box.insertAdjacentHTML('beforeend', `<div>${msg}</div>`);
    });
    box.scrollTop = box.scrollHeight;
  }

  function clearChatHistory() {
    if (confirm("Hapus seluruh riwayat percakapan dari perangkat ini?")) {
      localStorage.removeItem('ht_chat_history');
      document.getElementById('chatBox').innerHTML = '';
    }
  }
</script>

</body>
</html>
